<style>
:root{color-scheme:dark;--land:cubic-bezier(.22,.8,.3,1);--snap:cubic-bezier(.05,.85,.2,1);--disp:'Archivo Black','Jua',sans-serif;--hd:'Jua','IBM Plex Sans KR',sans-serif;--bg:#0f0b0c;--p:#1b1416;--p2:#2a1e22;--ink:#f6f1ea;--mut:#b9aca5;--red:#e5191c;--red2:#8e0f13;--gold:#f5b942;--line:#3b2b2f;--en:'Anton',Galmuri11,sans-serif;--kr:Galmuri11,'Apple SD Gothic Neo',sans-serif;
 --phys:#d9d2c5;--curse:#b45cff;--elec:#ffe14a;--wind:#5ee08a;--heal:#6ec8ff}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--kr);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}

#app{max-width:460px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.en{font-family:var(--en);letter-spacing:.03em;font-weight:400}
/* 상단 HUD */
.hud{display:flex;align-items:center;gap:10px;padding:10px 12px 8px;background:#000;border-bottom:4px solid var(--red)}
.hud .fl{font:22px/1 var(--en)}.hud .fl small{display:block;font:11px/1.3 var(--kr);color:var(--mut)}
.hud .sp{flex:1}
.hud .risk{font:16px/1 var(--en);padding:6px 9px;background:var(--gold);color:#141012}.hud .risk.hot{background:var(--red);color:#fff}
.yen{font:20px/1 var(--en)}
.mini{display:grid;grid-template-columns:repeat(4,11px);gap:2px}.mini i{width:11px;height:11px;background:#1d1517}.mini i.v{background:#5a4247}.mini i.k{background:#3a2a2e;outline:1px dashed #6b5157}.mini i.at{background:var(--red)}.mini i.b{box-shadow:inset 0 0 0 2px var(--gold)}
/* 무대 */
.stage{position:relative;height:300px;overflow:hidden;background:var(--w2,#160f11);--w1:#2a1216;--w2:#140a0c;--t1:#3b1a20;--t2:#24101410;--lamp:255,170,120}
.stage.f1{--w1:#141b26;--w2:#0b0f16;--t1:#1f2a3a;--lamp:150,200,255}.stage.f2{--w1:#151d15;--w2:#0a0e0a;--t1:#22301f;--lamp:190,255,160}
.pxbg{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;z-index:0;pointer-events:none}
.stage>*:not(.pxbg){position:relative;z-index:1}.stage>.side,.stage>.rt,.stage>.fx{position:absolute}
.stage.quake{animation:quake .4s}@keyframes quake{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,0)}}
.stage:before{display:none;content:'';position:absolute;left:0;right:0;top:64%;height:6px;background:repeating-linear-gradient(90deg,#4b3a3e 0 18px,transparent 18px 30px);opacity:.7}
.stage .rt{position:absolute;left:12px;top:10px;right:12px;font:12px/1.4 var(--kr);color:var(--mut)}
.stage .rt b{display:block;font:20px/1.1 var(--en);color:var(--ink)}
.side{position:absolute;bottom:60px;display:flex;align-items:flex-end;gap:2px}
.side.pt{left:4px}.side.en{right:6px;flex-direction:row;align-items:flex-start;bottom:auto;top:146px;gap:4px}.foe.boss,.foe.reap{margin-top:-24px}
.unit{position:relative;display:flex;flex-direction:column;align-items:center;width:48px;transition:transform .2s}
.unit img{animation:bob 1.1s steps(1,end) infinite;image-rendering:pixelated;flex:none;filter:drop-shadow(0 4px 0 rgba(0,0,0,.5))}
.unit.act img{filter:drop-shadow(0 0 6px var(--gold)) drop-shadow(0 4px 0 rgba(0,0,0,.5))}
.unit.ko{opacity:.35;transform:translateY(8px) rotate(-8deg)}.unit.ko img{animation:none}
@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.stage.walk .unit:not(.ko) img{animation:walk .32s steps(1,end) infinite}@keyframes walk{0%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(2deg)}}
.unit.lunge{animation:lunge .56s linear}@keyframes lunge{0%{transform:none}28%{transform:translateX(-9px) scale(.94,1.05) rotate(-4deg)}36%{transform:translateX(92px) scale(1.16,.92) skewX(-8deg)}62%{transform:translateX(84px) scale(1.06)}100%{transform:none}}/* 예비 동작 → 튀어나감(찌그러짐) → 맞는 순간 멈춤 → 복귀 */
.unit.cast img{animation:cast .5s steps(2,end)}@keyframes cast{50%{filter:drop-shadow(0 0 10px #fff) brightness(1.6)}}
.unit.hop img{animation:hop .5s steps(4,end) 2}@keyframes hop{50%{transform:translateY(-12px)}}
.unit.act:not(.ko) img{animation:bob .55s steps(1,end) infinite}
.unit.coll img{animation:coll .25s steps(2,end) infinite;filter:hue-rotate(250deg) saturate(1.6) drop-shadow(0 0 6px #ff4fd8)}@keyframes coll{50%{transform:translateX(2px)}}
.unit.awk img{filter:drop-shadow(0 0 8px var(--gold)) brightness(1.15)}
.unit .row{font:12px/1 var(--kr);color:var(--mut);margin-top:4px}
.unit .hb{width:40px;height:5px;background:#3a2a2e;margin-top:3px}.unit .hb i{display:block;height:100%;background:#6fdc6a}.unit .hb i.lo{background:var(--red)}
.unit.hitf{animation:hit .34s}.unit.hitf img{filter:brightness(2.2) sepia(1) saturate(4) hue-rotate(-40deg)}@keyframes hit{0%,100%{transform:none}20%{transform:translateX(-12px) scale(.92,1.06)}50%{transform:translateX(5px)}75%{transform:translateX(-2px)}}/* 맞으면 붉게 번쩍 + 뒤로 젖혀짐 */
.bub{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);width:max-content;max-width:150px;background:var(--ink);color:#141012;font:11px/1.35 var(--kr);padding:5px 7px;margin-bottom:6px;z-index:3;animation:pop .2s}
.bub:after{content:'';position:absolute;top:100%;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--ink)}
.side.pt .unit:nth-child(2) .bub{margin-bottom:44px}.side.pt .unit:first-child .bub{left:0;transform:none;animation:none;max-width:112px}.side.pt .unit:first-child .bub:after{left:24px}/* 맨 왼쪽 말풍선은 화면 밖으로 안 나가게 *//* 가운데 사람 말풍선은 한 층 위로 (겹침 방지) */
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}}
.foe{position:relative;width:58px;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.foe .bd{animation:float 1.7s ease-in-out infinite alternate;width:40px;height:46px;background:radial-gradient(60% 50% at 50% 35%,#3a0f18,#0a0607);border-radius:40% 40% 30% 30%;position:relative;box-shadow:0 0 0 2px #000,0 6px 0 rgba(0,0,0,.5)}
.foe .bd:before,.foe .bd:after{content:'';position:absolute;top:17px;width:8px;height:4px;background:var(--red);box-shadow:0 0 4px var(--red)}.foe .bd:before{left:9px}.foe .bd:after{right:9px}
.foe.boss,.foe.reap{width:96px}.foe.boss .bd{width:62px;height:70px;background:radial-gradient(60% 50% at 50% 30%,#24324a,#05070b)}
.foe.reap .bd{width:64px;height:74px;background:radial-gradient(60% 50% at 50% 30%,#2b2b2b,#000);box-shadow:0 0 0 2px var(--red),0 0 18px var(--red2)}
.foe.sel .bd{outline:3px solid var(--gold);outline-offset:3px}
.foe.down .bd{animation:none;transform:rotate(80deg) translateX(14px);opacity:.75}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.foe .bd:before,.foe .bd:after{animation:blink 3.2s steps(1,end) infinite}@keyframes blink{0%,94%{transform:none}95%,98%{transform:scaleY(.15)}}
.foe.fhit .bd{filter:brightness(4) saturate(0);transform:translateX(10px) scale(1.1,.9)}/* 흰 번쩍 + 뒤로 밀리며 찌그러짐 */.foe.flunge{animation:flunge .48s linear}@keyframes flunge{0%{transform:none}30%{transform:translateX(8px) scale(.94,1.06)}42%{transform:translateX(-34px) scale(1.14,.9)}64%{transform:translateX(-28px)}100%{transform:none}}
.foe.dead{visibility:visible;animation:fade .5s forwards;pointer-events:none}@keyframes fade{to{opacity:0;transform:translateY(10px) scale(.7)}}
.foe.boss .bd,.foe.reap .bd{animation-duration:2.4s}
.stage .bg{display:none}@media (prefers-reduced-motion:reduce){.unit img,.foe .bd,.stage.quake{animation:none!important}}
.foe.gone{visibility:hidden}
.foe .wk{white-space:nowrap}.foe .nm{font:12px/1.15 var(--kr);margin-top:5px;text-align:center;word-break:keep-all}.foe .fr{position:absolute;top:-12px;left:2px;font:12px/1 var(--kr);color:var(--mut)}.foe .wk{font-size:12px;padding:1px 3px}
.foe .hb{width:44px;height:5px;background:#3a2a2e;margin-top:3px}.foe .hb{position:relative;height:6px}.foe .hb i{position:relative;display:block;height:100%;background:var(--red)}.foe .hb u{position:absolute;left:0;top:0;bottom:0;background:#fff3b0;animation:ghp 1s linear both}@keyframes ghp{0%,45%{width:var(--a)}100%{width:var(--b)}}
.wk{font:12px/1 var(--kr);padding:2px 4px;margin-top:3px;background:#2a1e22;color:var(--mut)}
.wk.k{color:#141012}
.foe .dn{position:absolute;top:-6px;font:16px/1 var(--en);color:var(--gold);text-shadow:0 2px 0 #000}
.fx{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center;z-index:5}
.fx b{font:52px/1 var(--en);color:#fff;background:var(--red);padding:6px 18px;transform:rotate(-6deg);box-shadow:8px 8px 0 #000;animation:slam .5s}
.fx b.g{background:var(--gold);color:#141012}
@keyframes slam{from{transform:rotate(-6deg) scale(2.2);opacity:0}}
.dmg{position:absolute;top:calc(-24px - var(--k,0) * 15px);font:18px/1 var(--en);color:#fff;text-shadow:0 2px 0 #000;animation:up .8s both;z-index:4}.dmg.w{color:var(--gold)}.dmg.h{color:#6fdc6a}
.dmg.t1{font-size:17px}.dmg.t2{font-size:22px;color:var(--gold)}.dmg.t3{font-size:28px;color:#ff3b3b;-webkit-text-stroke:1.5px #fff;text-shadow:0 3px 0 #000}
.dmg.w.t3{color:#ff3b3b}
@keyframes up{0%{transform:translateY(6px) scale(.6);opacity:0}18%{transform:translateY(-4px) scale(1.15);opacity:1}35%{transform:none}100%{transform:translateY(-18px);opacity:0}}
/* 하단 */
.panel{flex:1;background:var(--p);padding:10px 12px 14px;display:flex;flex-direction:column;gap:9px}
.party{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pc{background:var(--p2);padding:6px 7px;border-left:4px solid var(--c)}

.bar{height:6px;background:#3a2a2e;margin-top:4px}.bar i{display:block;height:100%;background:#6fdc6a}.bar.s i{background:#59a7ff}.bar i.lo{background:var(--red)}
.pc .nu{font-size:12px;color:var(--mut);margin-top:2px}

.slot.f{border:2px solid var(--line);background:var(--p2)}.slot.f[data-r=증폭]{border-color:#59a7ff}.slot.f[data-r=폭발]{border-color:var(--gold)}

.pk.evo{border-left-color:var(--gold);background:#2b2210}
.bar.t i{background:#b45cff}.bar.t i.hi{background:#ff4fd8}
.md{font-size:12px;padding:0 4px;color:#141012}.md.c{background:#ff4fd8}.md.a{background:var(--gold)}
.negs{display:flex;flex-wrap:wrap;gap:5px}.neg{font-size:11px;padding:4px 7px;background:#2a0f14;border:1px solid var(--red2);color:#ffb3b3}.neg small{color:var(--gold)}
.psg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.psc{display:flex;gap:8px;align-items:center;text-align:left;background:var(--p);padding:7px;border-left:4px solid var(--c);position:relative;min-height:62px}
.psc.on{background:#3a2a2e;outline:2px solid var(--c)}.psc img{image-rendering:pixelated;flex:none}.psc b{color:var(--c);font:15px/1 var(--en)}
.psc small{display:block;font-size:12px;color:var(--mut)}.psc .po{position:absolute;top:4px;right:6px;font:16px/1 var(--en);font-style:normal;color:var(--c)}
.els{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px}.els i{font-style:normal;font-size:12px;color:#141012;padding:0 3px}
.wk+.wk{margin-left:2px}.foe .wk{display:inline-block}.foe .wks{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin-top:3px}.foe .wks .wk{margin:0;font:11px/1 var(--kr);padding:2px 3px 3px;background:#141012;color:var(--mut)}.foe .wks .wk.k{color:var(--c);box-shadow:inset 0 -2px var(--c)}.foe .wks .wk.k,.foe .wks .wk.q{min-width:15px;text-align:center}.foe .wks .wg{display:flex;gap:2px;flex:0 0 100%;justify-content:center;white-space:nowrap}.foe .wks .wk.st{flex-basis:auto}.foe .wks .wk.st:first-of-type{margin-left:0}.foe .wks .wk.st{color:var(--ink);box-shadow:inset 0 -2px #6b5a5e}.foe .wks .wk.st.hot{background:var(--red);color:#fff;box-shadow:none}
.pk.lock{opacity:.7}.pk.lock .ic{filter:grayscale(1)}
#tut{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;pointer-events:none}
.tutbox{pointer-events:auto;max-width:440px;width:calc(100% - 16px);margin:0 8px 10px;background:#000;border:3px solid var(--c);box-shadow:6px 6px 0 rgba(0,0,0,.6);padding:10px 12px}
.tutbox>b{color:var(--c);font-size:18px}.tutbox small{color:var(--mut)}.tutbox p{margin:6px 0 10px;font-size:14px;line-height:1.55}.tutbox .tui{color:var(--gold)}.tutbox .go{padding:10px 14px;font-size:18px}
.pxi{width:28px;height:28px;image-rendering:pixelated;vertical-align:middle}.slot .pxi{width:28px;height:28px}.pk .pxi{width:36px;height:36px}.neg .pxi,.tog .pxi,.tip .pxi,.card .pxi{width:20px;height:20px;vertical-align:-5px}

.row2{display:flex;gap:7px}.row2>*{flex:1}

s\"]"],"ch":[],"go":"tap"}],"C-1":[{"o":"1","who":"mona","t":"르블랑이다! 같이 갈 **세 명**을 고르고 START를 눌러. 누구를 데려가느냐에 따라 찌를 수 있는 **약점 속성**이 달라진다고!","hl":[],"ch":[],"go":"tap"}],"C-2":[{"o":"1","who":"futaba","t":"메멘토스 **환승 노선도**야! **반짝이는 역**만 갈 수 있어. 역을 옮길 때마다(왔던 역으로 돌아가도) **경계도 +1**, 층을 내려가도 이어져. **경계도 24**이 되면… 거둬들이는 자가 와. 오른쪽 위 숫자를 잘 봐! **!** 표시가 관문, 거기 의뢰 대상이 있어!","hl":[],"ch":[],"go":"tap"}],"C-3":[{"o":"1","who":"mona","t":"섀도다! 적을 눌러 대상을 고르고 스킬을 써. 적 밑에 **약점**이 보이면 그 속성으로 찔러! 모르면 이것저것 쳐 보면서 알아내는 거야.","hl":[],"ch":[],"go":"tap"}],"C-4":[{"o":"1","who":"mona","t":"**1 MORE!** 약점을 찌르면 한 번 더 움직일 수 있어. **바톤**으로 동료에게 넘기면 공격력이 오른다고!","hl":[],"ch":[],"go":"tap"}],"C-5":[{"o":"1","who":"futaba","t":"적이 전부 다운! **ALL-OUT ATTACK** 버튼이 떴어. 지금이야!","hl":[],"ch":[],"go":"tap"}],"C-6":[{"o":"1","who":"mona","t":"보상이다! 템 **3개 중 하나**. 가방은 차면 칸이 계속 늘어나니 마음껏 쌓아! 금색 **시너지** 표시는 지금 가진 템이랑 맞물린다는 뜻이야.","hl":[],"ch":[],"go":"tap"}],"C-7":[{"o":"1","who":"futaba","t":"**수상한 역**에서 동료가 **기벽**으로 먼저 튀어나가려 해! **말린다 · 부추긴다 · 그냥 둔다** 중에 골라. 지휘는 판당 3번!","hl":[],"ch":[],"go":"tap"}],"C-8":[{"o":"1","who":"mona","t":"관문 돌파! **RETURN**이면 번 엔을 전부 챙기고, **GO DEEPER**면 더 깊이. 처음엔 B2 선로가 막혀 있어서 **모나 버스 개조**가 필요해. 이 몸한테 맡기라고!","hl":[],"ch":[],"go":"tap"}],"C-9":[{"o":"1","who":"futaba","t":"귀환 완료! 번 엔은 **르블랑 지갑**에 쌓여. 위쪽 **NEXT UNLOCK** 줄이 다음에 살 것이야. 아래 **버스 · 해금 · 유대 · 각성** 탭에서 쓰면 돼!","hl":[],"ch":[],"go":"tap"}],"C-10":[{"o":"1","who":"mona","t":"**벨벳 룸 출장소**! 이번 판에 번 엔으로 **템을 사거나 · 쉬거나 · 템 2개를 진화 템으로 합성**할 수 있어. 여기서 쓴 엔은 집에 못 가져가니까 잘 생각해!","hl":[],"ch":[],"go":"tap"}]},"chem":{"lines":[{"a":"ryuji","b":"akechi","rel":"냉전","qa":"…야, 아까 일 아직도 꽁해 있냐?","qb":"기억력이 좋아서 말이지.","end":{"who":"mona","q":"둘 다 그만하라고!"}},{"a":"ryuji","b":"mona","rel":"티격태격","qa":"고양이 주제에 지도는 잘 읽네?","qb":"고양이가 아니라고 몇 번을 말해!","end":null},{"a":"akechi","b":"ryuji","rel":"뜻밖의 신뢰","qa":"…아까는 고마웠어. 한 번만 말할 거야.","qb":"어? 어어… 뭐, 당연한 거 아니냐!","end":null},{"a":"joker","b":"akechi","rel":"의기투합","qa":"다음 코너, 동시에 치고 들어갈까.","qb":"좋아. 네 타이밍에 맞춰 주지.","end":null},{"a":"ryuji","b":"ann","rel":"의기투합","qa":"야, 오늘 우리 둘 다 텐션 미치지 않았냐?!","qb":"맞아! 이 기세면 보스도 한 방이겠어!","end":null},{"a":"makoto","b":"haru","rel":"의기투합","qa":"하루, 왼쪽 섀도는 네가 맡아 줄래?","qb":"응, 맡겨 줘! 깔끔하게 정리해 버릴게.","end":null},{"a":"joker","b":"kasumi","rel":"의기투합","qa":"준비됐어, 카스미?","qb":"네, 선배! 언제든 뛰어 나갈 수 있어요!","end":null},{"a":"futaba","b":"mona","rel":"의기투합","qa":"모나! 보물 반응 찍었어! 바로 대시!","qb":"오오, 내비랑 손발이 척척 맞는다고!","end":null},{"a":"yusuke","b":"joker","rel":"의기투합","qa":"지금 이 순간, 완벽한 구도가 보였군.","qb":"그래, 그대로 밀고 가자.","end":null},{"a":"makoto","b":"futaba","rel":"의기투합","qa":"약점 스캔 끝났어? 바로 들어간다.","qb":"전부 마킹 완료! 퀸, 싹 쓸어 버려!","end":null},{"a":"futaba","b":"yusuke","rel":"티격태격","qa":"이나리! 보물 앞에서 스케치북 좀 치워!","qb":"이 빛의 각도를 놓치면 평생 후회한다!","end":{"who":"ann","q":"둘 다 얼른 걸어!"}},{"a":"makoto","b":"ryuji","rel":"티격태격","qa":"류지, 또 계획 없이 뛰어들었지?!","qb":"아, 결과만 좋으면 된 거 아니냐고!","end":{"who":"joker","q":"둘 다 진정해."}},{"a":"akechi","b":"futaba","rel":"티격태격","qa":"네 내비 안내, 가끔 너무 시끄럽지 않아?","qb":"뭐?! 내 완벽한 보이스 서포트를 무시해?!","end":null},{"a":"mona","b":"yusuke","rel":"티격태격","qa":"어이 폭스! 동전 줍는 데 무슨 예술이 필요하냐!","qb":"세속의 물욕에도 품격이 필요한 법이다.","end":null},{"a":"ryuji","b":"haru","rel":"티격태격","qa":"하루, 아까 도끼 너무 내 옆으로 스쳤다고!","qb":"어머, 안 맞았으니까 괜찮은 거 아니야?","end":{"who":"ryuji","q":"그게 더 무섭다고!"}},{"a":"ann","b":"ryuji","rel":"티격태격","qa":"야 사카모토 류지, 아까 내 쪽으로 먼지 튀겼지!","qb":"일부러 그런 게 아니라 미끄러진 거라고!","end":null},{"a":"akechi","b":"mona","rel":"티격태격","qa":"고양이 주제에 지휘관 행세가 지나치네.","qb":"고양이가 아니라 괴도단 선배라고 몇 번을 말해!","end":null},{"a":"haru","b":"akechi","rel":"냉전","qa":"아케치 군, 지금은 말을 안 거는 게 서로 편할 것 같네.","qb":"…동감이야. 할 일만 하고 끝내지.","end":null},{"a":"futaba","b":"akechi","rel":"냉전","qa":"흥, 아케치 쪽 루트는 스캔 안 해 줄 거야.","qb":"필요 없어. 내 눈으로 보는 게 더 빠르니까.","end":{"who":"makoto","q":"하아… 둘 다 그만해."}},{"a":"mona","b":"ryuji","rel":"냉전","qa":"흥, 저 녀석한테는 한마디도 안 걸 거야.","qb":"나도 고양이랑은 말 안 섞는다고!","end":{"who":"ann","q":"언제까지 저럴 거야…"}},{"a":"makoto","b":"akechi","rel":"냉전","qa":"독단적인 판단은 파티 전체를 위험하게 해.","qb":"효율을 따졌을 뿐이야. 불만이면 네가 앞장서든가.","end":null},{"a":"joker","b":"akechi","rel":"냉전","qa":"아까 그 선택, 너무 위험했어.","qb":"결과를 냈잖아. 설교는 사양할게.","end":null},{"a":"ann","b":"mona","rel":"냉전","qa":"모나, 방금 그건 좀 심했어.","qb":"으… 아, 안 아가씨한테까지 그런 소리를 듣다니…","end":null},{"a":"yusuke","b":"ryuji","rel":"냉전","qa":"…너와는 미학적 대화가 통하지 않는군.","qb":"미학이고 뭐고, 말 좀 알아듣게 하라고!","end":null},{"a":"futaba","b":"akechi","rel":"뜻밖의 신뢰","qa":"…아까 막아 준 건 꽤 나이스였어. 딱 이번만 인정해 줄게.","qb":"의외네. 네 입에서 칭찬이 다 나오고.","end":null},{"a":"haru","b":"akechi","rel":"뜻밖의 신뢰","qa":"아케치 군, 아까 뒤를 지켜 줘서 고마워.","qb":"…신경 쓰지 마. 전력을 유지하는 게 유리했을 뿐이야.","end":null},{"a":"mona","b":"ryuji","rel":"뜻밖의 신뢰","qa":"어이 스컬… 아까는 제법 듬직했다고.","qb":"뭐, 뭐야 갑자기! 기분 나쁘게 왜 칭찬하고 그래!","end":null},{"a":"makoto","b":"akechi","rel":"뜻밖의 신뢰","qa":"방금 판단은 정확했어. 네가 있어서 다행이야.","qb":"네 백업이 빨랐던 덕분이지. 호흡이 꽤 맞네.","end":null},{"a":"yusuke","b":"futaba","rel":"뜻밖의 신뢰","qa":"후타바, 아까 네 지시 덕분에 위기를 넘겼다. 고맙군.","qb":"에헤헤, 이나리가 솔직하게 고맙다고 하니까 좀 쑥스러운데?","end":null},{"a":"kasumi","b":"akechi","rel":"뜻밖의 신뢰","qa":"아케치 선배, 아까 제 빈틈을 메워 주셔서 정말 감사했어요!","qb":"네 움직임이 워낙 깔끔해서 맞추기 쉬웠을 뿐이야.","end":null},{"a":"joker","b":"akechi","rel":"뜻밖의 신뢰","qa":"등 뒤는 너한테 맡겨도 되겠네.","qb":"흥, 당연한 소리를. 놓치지 말고 따라와.","end":null},{"a":"joker","b":"akechi","rel":"의기투합","qa":"이제 말 안 해도 다음 수가 보이네.","qb":"흥, 네가 내 속도에 맞춰 주는 것뿐이야. 가자.","end":null,"lv":3},{"a":"joker","b":"kasumi","rel":"의기투합","qa":"카스미, 호흡 완벽해졌는데.","qb":"선배 옆에서 계속 뛰어온 덕분이에요! 끝까지 함께할게요!","end":null,"lv":3},{"a":"ryuji","b":"mona","rel":"뜻밖의 신뢰","qa":"야 모나, 이제 네 잔소리 안 들으면 좀 허전하다고.","qb":"흐흥, 이 몸의 소중함을 이제야 알았냐 스컬!","end":null,"lv":3},{"a":"ryuji","b":"ann","rel":"의기투합","qa":"야, 우리 이제 눈 감고도 호흡 맞출 수 있지 않냐?","qb":"당연하지! 영원한 콤비잖아!","end":null,"lv":3},{"a":"makoto","b":"haru","rel":"의기투합","qa":"하루가 뒤에 있으면 어떤 상황에서도 안심이 돼.","qb":"나도 마코토 쨩이 곁에 있어서 늘 든든해.","end":null,"lv":3},{"a":"futaba","b":"yusuke","rel":"뜻밖의 신뢰","qa":"이나리, 오늘 구도 나쁘지 않은데? 내비 인증 도장 쾅!","qb":"후타바에게 인정받다니… 오늘 그림은 걸작이 되겠군.","end":null,"lv":3},{"a":"akechi","b":"haru","rel":"뜻밖의 신뢰","qa":"…네가 맡은 쪽은 굳이 돌아볼 필요가 없네. 깔끔해.","qb":"어머, 아케치 군한테 그런 말을 다 듣네. 기분 좋다.","end":null,"lv":3},{"a":"akechi","b":"futaba","rel":"뜻밖의 신뢰","qa":"네 데이터만큼은 이제 의심 없이 믿고 움직여도 되겠어.","qb":"흥, 진작 그랬어야지! 믿고 맡겨!","end":null,"lv":3},{"a":"joker","b":"makoto","rel":"의기투합","qa":"작전은 완벽해. 이제 마무리만 남았네.","qb":"응, 네가 옆에 있으니 걱정 없어. 가자!","end":null,"lv":3},{"a":"joker","b":"mona","rel":"의기투합","qa":"오늘도 잘 부탁해, 파트너.","qb":"당연하지, 조커! 이 몸과 네 조합은 무적이라고!","end":null,"lv":3},{"a":"ann","b":"haru","rel":"의기투합","qa":"하루, 저쪽 섀도들 같이 한 번에 날려 버릴까?","qb":"좋아! 안 쨩이 불 붙이면 내가 마무리할게.","end":null},{"a":"yusuke","b":"makoto","rel":"의기투합","qa":"퀸, 그 일격에는 군더더기 없는 조형미가 있군.","qb":"고마워 유스케. 네 검술도 빈틈이 없어서 든든해.","end":null},{"a":"futaba","b":"kasumi","rel":"의기투합","qa":"바이올렛! 전방 3미터 점프 각 나왔어!","qb":"네, 후타바 선배! 지금 바로 뛰어넘을게요!","end":null},{"a":"ryuji","b":"kasumi","rel":"의기투합","qa":"카스미, 저 끝까지 누가 먼저 도착하나 내기할래?!","qb":"좋아요 류지 선배! 저도 안 질 거예요!","end":null},{"a":"joker","b":"haru","rel":"의기투합","qa":"하루, 오늘 유난히 기세가 좋네.","qb":"네가 옆에서 지휘해 주니까 마음이 놓여서 그래.","end":null},{"a":"joker","b":"futaba","rel":"의기투합","qa":"내비, 다음 루트 부탁해.","qb":"오케이 조커! 최단 보물 코스 바로 띄워 줄게!","end":null},{"a":"mona","b":"haru","rel":"의기투합","qa":"하루, 오늘 우리 콤비 플레이 최고라고!","qb":"후훗, 모나 쨩이랑 같이 다니면 늘 즐거워.","end":null},{"a":"makoto","b":"kasumi","rel":"의기투합","qa":"카스미, 호흡 흐트러지지 않고 완벽해.","qb":"마코토 선배가 리드해 주신 덕분이에요!","end":null},{"a":"ryuji","b":"yusuke","rel":"티격태격","qa":"야 유스케, 굶고 다니지 말고 편의점 빵이라도 사 먹으라고!","qb":"빵 살 돈으로 새 붓을 샀다. 후회는 없다.","end":{"who":"ann","q":"아 진짜 못 말려…"}},{"a":"ann","b":"akechi","rel":"티격태격","qa":"아케치, 가끔은 계산 좀 내려놓고 편하게 걸어도 되잖아?","qb":"방심하다 발목 잡히는 쪽보단 낫지 않아?","end":null},{"a":"mona","b":"futaba","rel":"티격태격","qa":"내비! 이 몸 수염 자꾸 톡톡 건드리지 마!","qb":"반응 속도 테스트 중이거든? 0.2초 합격!","end":null},{"a":"makoto","b":"yusuke","rel":"티격태격","qa":"유스케, 지금 이 어두운 통로에서 화구를 꺼내면 어떡해!","qb":"어둠 속의 한 줄기 붉은 선… 지금 아니면 못 그린단 말이다!","end":null},{"a":"ryuji","b":"futaba","rel":"티격태격","qa":"야 후타바, 아까 나한테 '탱커 몸빵'이라고 했지?!","qb":"어? 제일 튼튼하니까 칭찬한 건데 왜 그래~","end":null},{"a":"yusuke","b":"akechi","rel":"티격태격","qa":"아케치, 그 걸음걸이는 너무 인위적이군. 자연스러움이 부족해.","qb":"칭찬이 아닌 건 알겠네. 감상은 나중에 혼자 해.","end":null},{"a":"ann","b":"mona","rel":"티격태격","qa":"모나, 자꾸 보물만 보면 앞뒤 안 가리고 달려가잖아!","qb":"안 아가씨한테는 예쁜 보물만 보여 주고 싶단 말이야!","end":null},{"a":"haru","b":"yusuke","rel":"티격태격","qa":"유스케 군, 아까 내 화분 흙을 스케치 재료로 쓰려던 거 다 봤어.","qb":"오해다, 하루! 그저 자연의 색감을 채집하려 했을 뿐…","end":null},{"a":"ann","b":"ryuji","rel":"냉전","qa":"…류지, 아까 내 말 무시하고 뛰어나간 거 아직 화났거든?","qb":"아, 알았다고… 미안하니까 그만 째려봐.","end":null},{"a":"makoto","b":"ryuji","rel":"냉전","qa":"류지, 다음엔 내 신호 떨어지기 전에 절대 움직이지 마.","qb":"…알았어, 알았다고. 조용히 따라갈게.","end":null},{"a":"yusuke","b":"akechi","rel":"냉전","qa":"…그 차가운 시선에는 예술적 온기가 전혀 없군.","qb":"흥, 나도 네 4차원적인 궤변에 어울려 줄 기분은 아니야.","end":null},{"a":"futaba","b":"ryuji","rel":"냉전","qa":"류지한테는 당분간 미니맵 공유 안 해 줄 거야.","qb":"어이, 야! 길 잃으면 어쩌려고 그래!","end":null},{"a":"mona","b":"makoto","rel":"냉전","qa":"퀸, 아까 급커브 꺾을 때 이 몸 멀미할 뻔했다고!","qb":"미안하다고 했잖아… 나도 급해서 그랬어.","end":null},{"a":"haru","b":"ryuji","rel":"냉전","qa":"류지 군, 아까 그 행동은 조금 위험했어.","qb":"으… 하루가 정색하니까 진짜 무섭네. 미안해!","end":null},{"a":"joker","b":"mona","rel":"냉전","qa":"모나, 이번엔 네가 좀 성급했어.","qb":"흥… 조커까지 이 몸 편을 안 들어 주다니.","end":null},{"a":"kasumi","b":"akechi","rel":"냉전","qa":"아케치 선배… 방금 말씀은 조금 너무하신 것 같아요.","qb":"현실을 말했을 뿐이야. 듣기 싫으면 귀를 막든가.","end":null},{"a":"ann","b":"akechi","rel":"뜻밖의 신뢰","qa":"아케치, 아까 내 뒤 지켜 준 거… 사실 좀 감동했어.","qb":"별일 아니야. 다음엔 시야를 좀 더 넓게 써.","end":null},{"a":"yusuke","b":"akechi","rel":"뜻밖의 신뢰","qa":"아케치, 방금 그 냉철한 일격… 솔직히 경이로웠다.","qb":"네가 내 싸움 방식을 칭찬할 줄은 몰랐네.","end":null},{"a":"ryuji","b":"makoto","rel":"뜻밖의 신뢰","qa":"야 마코토, 아까 네 말 듣길 진짜 잘했다! 완전 살았네!","qb":"후훗, 이제 내 작전을 좀 믿어 주는 거야?","end":null},{"a":"futaba","b":"ryuji","rel":"뜻밖의 신뢰","qa":"류지, 아까 몸으로 막아 줘서 고마워! 오늘 MVP 줄게!","qb":"하하! 당연하지! 내비는 내가 지켜야지!","end":null},{"a":"mona","b":"akechi","rel":"뜻밖의 신뢰","qa":"크로우… 아까 그 함정 해제, 제법 쓸 만하더군.","qb":"고양이한테 인정받으니 묘한 기분이네. 고맙다고 해 두지.","end":null},{"a":"yusuke","b":"ryuji","rel":"뜻밖의 신뢰","qa":"류지, 아까 나를 끌어올려 준 그 힘… 진정한 우정이더군.","qb":"에이, 뭘 그런 걸로 감동하고 그래! 친구잖아!","end":null},{"a":"haru","b":"futaba","rel":"뜻밖의 신뢰","qa":"후타바 쨩, 네 안내 덕분에 하나도 안 다쳤어. 고마워.","qb":"에헤헤, 하루가 그렇게 말해 주니까 의욕 200% 충전됐어!","end":null},{"a":"makoto","b":"ann","rel":"뜻밖의 신뢰","qa":"안, 아까 분위기 처졌을 때 네가 웃겨 줘서 정말 고마웠어.","qb":"에이~ 우리 사이에 뭘! 서로 챙기는 거지!","end":null},{"a":"joker","b":"ryuji","rel":"의기투합","qa":"류지, 오른쪽은 네가 뚫어 줘.","qb":"오케이! 내 방망이 맛 좀 제대로 보여 주지!","end":null},{"a":"joker","b":"ann","rel":"의기투합","qa":"안, 불꽃으로 시선 끌어 줄래?","qb":"맡겨만 둬! 화려하게 태워 버릴게!","end":null},{"a":"ann","b":"yusuke","rel":"의기투합","qa":"유스케, 내 마법 다음에 바로 이어서 쳐 줘!","qb":"알았다. 불꽃 뒤에 피어나는 얼음이라… 완벽한 대비군!","end":null},{"a":"ann","b":"futaba","rel":"의기투합","qa":"후타바! 다음 약점 속성 뭐야?","qb":"화염 약점 확정! 팬서, 풀파워로 날려 버려!","end":null},{"a":"yusuke","b":"haru","rel":"의기투합","qa":"하루, 네 포격 타이밍에 맞춰 파고들지.","qb":"후훗, 좋아 유스케 군! 신호 줄 테니까 멋지게 마무리해 줘.","end":null},{"a":"haru","b":"kasumi","rel":"의기투합","qa":"카스미 쨩, 같이 리듬 맞춰서 들어가 볼까?","qb":"네, 하루 선배! 완벽하게 보조 맞출게요!","end":null},{"a":"joker","b":"ryuji","rel":"의기투합","qa":"등 뒤는 늘 네게 맡기고 있어, 류지.","qb":"하하, 당연하지! 우린 처음부터 최강 콤비잖아!","end":null,"lv":3},{"a":"joker","b":"ann","rel":"의기투합","qa":"안이랑 같이 싸우면 이상하게 마음이 놓여.","qb":"후훗, 나도! 조커가 옆에 있으면 뭐든 이길 것 같거든!","end":null,"lv":3},{"a":"ann","b":"makoto","rel":"의기투합","qa":"마코토, 이제 눈빛만 봐도 다음 작전 알겠어!","qb":"나도 그래, 안. 이제 우리 호흡은 누구도 못 따라올 거야.","end":null,"lv":3},{"a":"yusuke","b":"joker","rel":"의기투합","qa":"너와 함께 서는 전장은 언제나 한 폭의 명화로군.","qb":"그럼 마지막 붓질은 같이 끝내자, 유스케.","end":null,"lv":3},{"a":"joker","b":"ryuji","rel":"티격태격","qa":"류지, 소리 좀 낮춰. 섀도 다 몰려오겠다.","qb":"아 진짜, 신나서 그랬단 말이야! 리더 너무 엄격한 거 아니냐?!","end":null},{"a":"ann","b":"yusuke","rel":"티격태격","qa":"유스케! 전투 중에 포즈 주문하지 말라고 몇 번을 말해!","qb":"하지만 방금 그 각도에서 흩날린 머리카락은 실로 절경이었다!","end":{"who":"ann","q":"진짜 못 말려!"}},{"a":"makoto","b":"futaba","rel":"티격태격","qa":"후타바, 약점 안내할 때 게임 용어 말고 제대로 말해 줄래?","qb":"에이~ 퀸도 슬슬 겜잘알 용어 외울 때 됐거든?!","end":null},{"a":"kasumi","b":"ryuji","rel":"티격태격","qa":"류지 선배! 방금 또 준비운동 없이 뛰어드셨죠?!","qb":"어, 어이 요시자와! 잔소리가 점점 마코토 닮아 가는데?!","end":null},{"a":"akechi","b":"makoto","rel":"티격태격","qa":"니지마, 네 작전은 지나치게 교과서적이야. 변수를 못 읽잖아.","qb":"아케치 군의 도박 같은 판단보다는 훨씬 안전하다고 생각하는데.","end":null},{"a":"haru","b":"mona","rel":"티격태격","qa":"모나 쨩, 자꾸 혼자 튀어 나가면 미아 될지도 몰라.","qb":"미, 미아라니! 이 몸은 메멘토스의 살아 있는 지도라고!","end":null},{"a":"ann","b":"makoto","rel":"티격태격","qa":"마코토, 그렇게 빡빡하게 굴면 피곤해진다니까?","qb":"안, 지금 긴장 풀었다가 함정 밟으면 어쩌려고 그래!","end":null},{"a":"futaba","b":"kasumi","rel":"티격태격","qa":"카스미! 너 너무 빨리 뛰어다녀서 레이더 핀이 쫓아가질 못해!","qb":"죄, 죄송해요 후타바 선배! 조금만 속도 줄일게요!","end":null},{"a":"joker","b":"yusuke","rel":"티격태격","qa":"유스케, 보물상자 앞에서 구도 잡는 건 끝나고 하자.","qb":"안 될 말이다! 열리기 직전의 긴장감이야말로 미의 정점이지!","end":null},{"a":"akechi","b":"ryuji","rel":"티격태격","qa":"사카모토, 발소리 좀 줄여. 섀도한테 초대장 보낼 셈이야?","qb":"아 시끄러! 원래 내 보폭이 크다고!","end":{"who":"mona","q":"또 시작이네…"}},{"a":"joker","b":"ryuji","rel":"냉전","qa":"류지, 아까는 분명 기다리라고 했잖아.","qb":"…알았다고. 다음엔 말없이 안 튀어 나갈게.","end":null},{"a":"joker","b":"ann","rel":"냉전","qa":"안, 지금은 농담할 분위기가 아니야.","qb":"…미안. 나도 모르게 선을 넘었나 봐.","end":null},{"a":"ann","b":"yusuke","rel":"냉전","qa":"유스케, 지금은 정말 예술 타령 듣고 싶지 않아.","qb":"…그렇게까지 말한다면 입을 다물지.","end":null},{"a":"makoto","b":"yusuke","rel":"냉전","qa":"유스케, 파티 전체 안전보다 그림이 먼저인 건 아니지?","qb":"…내 미학을 오해하고 있군, 마코토.","end":null},{"a":"haru","b":"makoto","rel":"냉전","qa":"마코토 쨩, 아까는 조금 너무 몰아붙인 것 같아.","qb":"…미안해 하루. 나도 여유가 없었나 봐.","end":null},{"a":"futaba","b":"makoto","rel":"냉전","qa":"흥, 퀸이 다 알아서 할 거면 내비는 왜 데려왔어?","qb":"…그런 뜻이 아니었잖아, 후타바.","end":null},{"a":"mona","b":"yusuke","rel":"냉전","qa":"폭스, 지금 이 몸 말 한 귀로 흘린 거지?!","qb":"…지금은 침묵이 가장 고결한 답이로군.","end":null},{"a":"ann","b":"futaba","rel":"냉전","qa":"후타바, 아까 그 말은 좀 상처였어…","qb":"…으, 미안. 나도 모르게 필터 없이 말해 버렸어.","end":null},{"a":"kasumi","b":"ryuji","rel":"냉전","qa":"류지 선배… 아까는 정말 위험하셨어요.","qb":"…미안하다, 요시자와. 내가 너무 앞만 보고 달렸네.","end":null},{"a":"mona","b":"futaba","rel":"냉전","qa":"흥! 내비라고 이 몸을 구닥다리 취급하다니!","qb":"팩트 체크했을 뿐이거든? 당분간 통신 음소거할 거야!","end":null},{"a":"joker","b":"yusuke","rel":"뜻밖의 신뢰","qa":"유스케, 아까 네가 막아 줘서 살았어.","qb":"동료를 지키는 데 이유 따윈 필요 없지. 신경 쓰지 마라.","end":null},{"a":"ann","b":"yusuke","rel":"뜻밖의 신뢰","qa":"유스케, 평소엔 엉뚱한데 중요한 순간엔 진짜 믿음직하네.","qb":"그 말, 최고의 찬사로 받아들이지.","end":null},{"a":"makoto","b":"kasumi","rel":"뜻밖의 신뢰","qa":"요시자와, 위급할 때 판단이 정말 빨랐어. 고마워.","qb":"마코토 선배께 도움이 됐다면 그것만으로 기뻐요!","end":null},{"a":"haru","b":"ryuji","rel":"뜻밖의 신뢰","qa":"류지 군, 아까 제일 먼저 달려와 줘서 정말 고마웠어.","qb":"에이, 뭘 그런 걸로! 하루가 다치면 큰일이잖아!","end":null},{"a":"mona","b":"makoto","rel":"뜻밖의 신뢰","qa":"퀸, 아까 지휘 덕분에 위기 넘겼어. 인정할게!","qb":"후훗, 모나한테 칭찬받으니까 묘하게 뿌듯하네.","end":null},{"a":"ann","b":"kasumi","rel":"뜻밖의 신뢰","qa":"카스미, 너 진짜 대단해! 방금 완전 프로 같았어!","qb":"안 선배가 옆에서 응원해 주신 덕분이에요!","end":null},{"a":"futaba","b":"mona","rel":"뜻밖의 신뢰","qa":"모나, 아까 급회전 대박이었어! 내비 레이더보다 빨랐는데?","qb":"흐흥! 역시 이 몸의 진가를 알아보는군!","end":null},{"a":"ryuji","b":"haru","rel":"뜻밖의 신뢰","qa":"야 하루, 아까 네가 뒤 받쳐 줘서 맘 놓고 쳤다고! 최고야!","qb":"후훗, 류지 군이랑 호흡이 딱 맞아서 다행이야.","end":null},{"a":"haru","b":"kasumi","rel":"뜻밖의 신뢰","qa":"카스미 쨩이 옆에 있으면 어쩐지 마음까지 환해지는 기분이야.","qb":"저도 하루 선배랑 함께할 때가 제일 든든하고 따뜻해요!","end":null,"lv":3},{"a":"akechi","b":"kasumi","rel":"뜻밖의 신뢰","qa":"요시자와, 이제 네가 뒤를 맡아 주면 안심하고 앞만 볼 수 있겠네.","qb":"아케치 선배…! 그 믿음, 절대 저버리지 않을게요!","end":null,"lv":3}],"shifts":[{"a":"ryuji","b":"akechi","trig":"대실패","rel":"냉전","n":"{A}의 헛발질에 {B}(이)가 말없이 고개를 돌렸다.","qa":"아, 아니 그게…","qb":"…"},{"a":"*","b":"*","trig":"감싸기","rel":"뜻밖의 신뢰","n":"{A}(이)가 쓰러지기 직전의 {B} 앞을 막아섰다. 둘 사이의 공기가 조금 달라졌다.","qa":"","qb":"…빚진 걸로 할게."},{"a":"*","b":"*","trig":"승리","rel":"의기투합","n":"{A}(와)과 {B}(이)가 하이파이브를 했다.","qa":"","qb":""},{"a":"*","b":"*","trig":"감싸기","rel":"뜻밖의 신뢰","n":"{A}(이)가 망설임 없이 {B} 앞을 가로막고 공격을 받아 냈다.","qa":"뒤로 물러서!","qb":"…고마워. 잊지 않을게."},{"a":"*","b":"*","trig":"대실패","rel":"냉전","n":"{A}의 대형 실수로 먼지를 뒤집어쓴 {B}(이)가 싸늘하게 입을 다물었다.","qa":"미, 미안… 일부러 그런 건 아니야!","qb":"…잠깐 말 걸지 마."},{"a":"*","b":"*","trig":"대실패","rel":"티격태격","n":"{A}의 헛발질을 본 {B}(이)가 참지 못하고 한소리 내뱉었다.","qa":"아, 웃지 말고 좀 도와줘!","qb":"그걸 어떻게 안 웃고 넘어가!"},{"a":"*","b":"*","trig":"충돌","rel":"냉전","n":"갈림길에서 끝내 합의하지 못한 {A}(와)과 {B} 사이에 차가운 침묵이 흘렀다.","qa":"내 말이 맞다니까.","qb":"…마음대로 해."},{"a":"*","b":"*","trig":"충돌","rel":"티격태격","n":"방향을 놓고 투닥거리던 {A}(와)과 {B}가 결국 눈을 흘기며 나란히 걸었다.","qa":"다음엔 내 말대로 가자고!","qb":"두고 보면 알겠지!"},{"a":"*","b":"*","trig":"승리","rel":"의기투합","n":"{A}(와)과 {B}(이)가 눈빛만으로 연계 공격을 성공시키고 마주 웃었다.","qa":"지금 호흡 완벽했지?","qb":"이대로 끝까지 가자!"},{"a":"*","b":"*","trig":"회복","rel":"의기투합","n":"{A}(이)가 지친 {B}의 어깨를 두드리며 재빨리 회복 스킬을 걸어 줬다.","qa":"무리하지 마. 이제 괜찮을 거야.","qb":"덕분에 살았어! 힘이 나네!"},{"a":"*","b":"*","trig":"회복","rel":"뜻밖의 신뢰","n":"{A}(이)가 말없이 건넨 회복약에 {B}의 굳었던 표정이 조금 누그러졌다.","qa":"이거 받아 둬.","qb":"…의외로 세심하네. 고마워."},{"a":"*","b":"*","trig":"쌍대사","rel":"의기투합","n":"짧은 잡담 끝에 {A}(와)과 {B}의 발걸음이 한결 가벼워졌다.","qa":"이야기하다 보니 기분 풀리네.","qb":"오늘 꽤 잘 풀릴 것 같은데?"},{"a":"*","b":"*","trig":"쌍대사","rel":"티격태격","n":"사소한 농담이 번져 {A}(와)과 {B}가 서로 잔소리를 주고받기 시작했다.","qa":"아니, 그 말은 좀 지나치잖아!","qb":"사실을 말했을 뿐이거든?"},{"a":"ryuji","b":"akechi","trig":"감싸기","rel":"뜻밖의 신뢰","n":"위험에 빠진 아케치를 류지가 몸을 날려 밀쳐 냈다. 아케치의 눈이 잠시 커졌다.","qa":"멍하니 있지 마, 임마!","qb":"…네가 날 감쌀 줄은 몰랐네. 빚진 걸로 하지."},{"a":"akechi","b":"haru","trig":"감싸기","rel":"뜻밖의 신뢰","n":"섀도의 기습을 아케치가 단칼에 쳐 내며 하루 앞을 막아섰다.","qa":"물러나 있어. 여긴 내가 막을게.","qb":"어머… 아케치 군, 고마워."},{"a":"akechi","b":"futaba","trig":"회복","rel":"뜻밖의 신뢰","n":"지쳐 주저앉은 후타바에게 아케치가 조용히 회복 아이템을 내밀었다.","qa":"내비가 멈추면 곤란하니까. 받아 둬.","qb":"뭐야, 의외로 츤데레네… 고마워."},{"a":"haru","b":"akechi","trig":"충돌","rel":"냉전","n":"아케치의 차가운 지시에 하루가 미소를 거두고 조용히 도끼를 고쳐 쥐었다.","qa":"그 방식은 동의하기 어렵네, 아케치 군.","qb":"…감정론은 사양할게."},{"a":"mona","b":"ryuji","trig":"대실패","rel":"냉전","n":"모르가나가 함정에 걸려 넘어지자 류지가 배를 잡고 웃어 버렸다.","qa":"이 몸의 실수를 비웃다니… 당분간 말 걸지 마!","qb":"아 미안! 근데 진짜 너무 웃겼다고!"},{"a":"joker","b":"akechi","trig":"승리","rel":"의기투합","n":"조커와 아케치가 등을 맞대고 마지막 섀도를 동시에 베어 넘겼다.","qa":"나쁘지 않은 호흡이지?","qb":"흥, 네가 조금 더 빨랐으면 완벽했을 텐데."},{"a":"kasumi","b":"joker","trig":"감싸기","rel":"의기투합","n":"카스미가 우아하게 뛰어올라 조커를 향한 공격을 대신 쳐 냈다.","qa":"선배! 여긴 저한테 맡겨 주세요!","qb":"고마워, 카스미. 완벽했어."},{"a":"futaba","b":"yusuke","trig":"대실패","rel":"티격태격","n":"유스케가 스케치하다 웅덩이에 빠지자 후타바가 그 장면을 놓치지 않고 놀려 댔다.","qa":"이나리, 오늘 흑역사 1호 당첨이야!","qb":"이 젖은 찰나마저 미학이라고 몇 번을 말했느냐!"},{"a":"makoto","b":"haru","trig":"승리","rel":"의기투합","n":"마코토의 철권과 하루의 도끼가 연달아 터지며 섀도가 순식간에 정리됐다.","qa":"역시 하루랑 맞추면 든든해.","qb":"후훗, 마코토 쨩도 정말 멋졌어!"},{"a":"ann","b":"kasumi","trig":"회복","rel":"의기투합","n":"안이 지친 카스미에게 회복 스킬과 함께 밝은 응원을 건넸다.","qa":"카스미, 무리하지 마! 잠깐 숨 돌리자!","qb":"안 선배 감사합니다! 덕분에 다시 힘이 나요!"},{"a":"joker","b":"ryuji","trig":"감싸기","rel":"의기투합","n":"류지 앞으로 날아온 섀도의 일격을 조커가 단검으로 정확히 튕겨 냈다.","qa":"조심해, 류지.","qb":"크으, 역시 우리 리더밖에 없다니까!"},{"a":"ann","b":"mona","trig":"회복","rel":"의기투합","n":"안이 지친 모르가나를 안아 올려 회복 스킬을 걸어 주자 모르가나의 귀가 쫑긋 섰다.","qa":"모나, 무리하지 마!","qb":"안 아가씨…! 이 몸, 백 배로 힘내겠어!"},{"a":"haru","b":"akechi","trig":"회복","rel":"뜻밖의 신뢰","n":"하루가 상처 입은 아케치에게 조용히 허브티와 회복 스킬을 건넸다.","qa":"아케치 군, 무리하면 안 돼.","qb":"…네가 날 챙겨 줄 줄이야. 고맙게 받을게."},{"a":"futaba","b":"akechi","trig":"승리","rel":"뜻밖의 신뢰","n":"후타바의 약점 스캔 직후 아케치가 0.1초 만에 마무리 일격을 꽂아 넣었다.","qa":"오, 방금 딜 타이밍 완벽했잖아!","qb":"네 스캔이 정확했으니까. 꽤 좋은 합작이었어."},{"a":"akechi","b":"futaba","trig":"대실패","rel":"티격태격","n":"아케치가 보조 함정에 걸려 휘청이자 후타바가 그 순간을 놓치지 않고 녹화했다.","qa":"…그 영상 당장 지워.","qb":"싫은데~? 명탐정 흑역사 영구 소장 각!"},{"a":"yusuke","b":"makoto","trig":"대실패","rel":"냉전","n":"유스케가 스케치에 빠져 경고 신호를 놓치는 바람에 마코토가 대신 먼지를 뒤집어썼다.","qa":"유스케… 지금은 정말 화가 나려고 해.","qb":"면목 없군, 마코토. 변명의 여지가 없다."},{"a":"kasumi","b":"ryuji","trig":"감싸기","rel":"의기투합","n":"카스미가 화려한 점프로 류지 앞의 함정 파편을 정확히 쳐 냈다.","qa":"류지 선배, 위험해요!","qb":"오오! 카스미 나이스 커버!! 완전 멋졌다고!"},{"a":"ryuji","b":"futaba","trig":"감싸기","rel":"뜻밖의 신뢰","n":"후타바 쪽으로 돌진하는 섀도를 류지가 파이프로 단번에 막아 냈다.","qa":"내비 건드리지 마! 여긴 내가 막는다고!","qb":"우와… 류지 방금 진짜 탱커 같았어! 고마워!"},{"a":"makoto","b":"akechi","trig":"충돌","rel":"냉전","n":"안전 확보를 외치는 마코토와 강행 돌파를 고집하는 아케치의 시선이 차갑게 부딪혔다.","qa":"동료가 다칠 위험을 계산에서 빼지 마.","qb":"결과를 못 내는 안전주의야말로 무의미하잖아."},{"a":"ann","b":"akechi","trig":"감싸기","rel":"뜻밖의 신뢰","n":"안의 채찍이 아케치를 노리던 섀도의 발목을 정확히 감아 넘어뜨렸다.","qa":"괜찮아, 아케치?!","qb":"…덕분에 살았네. 감각이 꽤 날카롭잖아, 팬서."},{"a":"yusuke","b":"ryuji","trig":"승리","rel":"의기투합","n":"류지의 번개와 유스케의 빙결이 엇갈리며 화려한 마무리 장면을 만들어 냈다.","qa":"어때, 방금 우리 둘 다 엄청 간지났지?!","qb":"인정하지. 빛과 얼음의 완벽한 조화였다."},{"a":"mona","b":"akechi","trig":"회복","rel":"뜻밖의 신뢰","n":"모르가나가 툴툴거리면서도 아케치의 상처를 말끔히 치료해 줬다.","qa":"흥, 쓰러지면 귀찮으니까 치료해 주는 거라고!","qb":"…고마워, 모나. 빚진 건 기억해 두지."},{"a":"haru","b":"kasumi","trig":"쌍대사","rel":"의기투합","n":"잠깐의 차와 도시락 이야기를 나누며 하루와 카스미의 분위기가 화사하게 피어올랐다.","qa":"다음엔 옥상에서 같이 차 마시자, 카스미 쨩.","qb":"네, 하루 선배! 정말 기대돼요!"},{"a":"joker","b":"yusuke","trig":"쌍대사","rel":"의기투합","n":"어둠 속 붉은 선로를 나란히 바라보며 조커와 유스케가 말없이 고개를 끄덕였다.","qa":"이 풍경, 기억해 둬야겠네.","qb":"그래. 너와는 미적 감각이 통하는군."},{"a":"ryuji","b":"ann","trig":"대실패","rel":"티격태격","n":"류지가 밟은 함정 탓에 안의 머리에 거미줄이 잔뜩 엉켜 버렸다.","qa":"사카모토 류지!! 너 진짜 죽을래?!","qb":"아, 아니 일부러 그런 게 아니라고! 잠깐만 진정해!"},{"a":"makoto","b":"kasumi","trig":"승리","rel":"의기투합","n":"마코토의 지시에 맞춰 카스미가 완벽한 타이밍에 마무리 일격을 꽂아 넣었다.","qa":"완벽한 연계였어, 카스미!","qb":"마코토 선배랑 함께라 자신 있게 뛸 수 있었어요!"},{"a":"*","b":"*","trig":"감싸기","rel":"뜻밖의 신뢰","n":"{A}(이)가 날아드는 공격을 대신 막아 내자 {B}(이)가 놀란 눈으로 고개를 들었다.","qa":"다친 데 없어?","qb":"…고마워. 다시 보게 됐네."},{"a":"*","b":"*","trig":"감싸기","rel":"뜻밖의 신뢰","n":"위험한 순간 {A}(이)가 {B}의 팔을 잡아당겨 품 뒤로 숨겼다. 어색했던 거리가 한 뼘 좁혀졌다.","qa":"조심해. 여기서 쓰러지면 안 되잖아.","qb":"…신세 졌어. 다음엔 내가 갚을게."},{"a":"*","b":"*","trig":"감싸기","rel":"의기투합","n":"{A}(이)가 한 치의 망설임도 없이 {B} 앞을 막아서며 든든하게 등을 보였다.","qa":"여긴 나한테 맡기고 반격해!","qb":"알겠어! 믿고 뒤 맡길게!"},{"a":"*","b":"*","trig":"감싸기","rel":"의기투합","n":"기습을 대신 받아 낸 {A}의 곁에 {B}(이)가 곧장 나란히 서며 자세를 고쳐 잡았다.","qa":"괜찮아, 아직 버틸 수 있어!","qb":"고마워! 바로 갚아 주자고!"},{"a":"*","b":"*","trig":"감싸기","rel":"의기투합","n":"{A}(이)가 {B}에게 향하던 일격을 깔끔하게 쳐 내자 둘 사이에 강한 신뢰가 번졌다.","qa":"빈틈은 내가 메울게!","qb":"든든하네! 같이 밀어붙이자!"},{"a":"*","b":"*","trig":"회복","rel":"의기투합","n":"{A}(이)가 타이밍 딱 맞춰 회복을 걸어 주자 {B}(이)가 환하게 웃으며 주먹을 쥐었다.","qa":"아직 한창이지? 힘내!","qb":"타이밍 완벽해! 바로 다시 갈게!"},{"a":"*","b":"*","trig":"회복","rel":"의기투합","n":"{A}(이)가 건넨 회복의 빛에 기운을 되찾은 {B}(이)가 고맙다는 듯 가볍게 고개를 끄덕였다.","qa":"무리하지 말고 페이스 맞춰.","qb":"고마워! 이제 완전 멀쩡해!"},{"a":"*","b":"*","trig":"회복","rel":"뜻밖의 신뢰","n":"말다툼 직후였는데도 {A}(이)가 먼저 {B}의 상처를 돌봐 주자 차갑던 공기가 누그러졌다.","qa":"싸우는 건 나중이고, 치료부터 해.","qb":"…미안. 그리고 고마워."},{"a":"*","b":"*","trig":"회복","rel":"뜻밖의 신뢰","n":"{A}(이)가 아무 말 없이 상처를 치료해 주자 {B}(이)가 조금 쑥스러운 표정으로 시선을 피했다.","qa":"참지 말고 아프면 말해.","qb":"…신경 써 줘서 고마워."},{"a":"*","b":"*","trig":"회복","rel":"티격태격","n":"{A}(이)가 잔소리를 덧붙이며 회복을 걸어 주자 {B}(이)가 투덜거리면서도 고맙게 받아들였다.","qa":"앞 좀 보고 다니라고! 자, 치료야.","qb":"아 알았어! 그래도 고맙긴 하네!"},{"a":"*","b":"*","trig":"회복","rel":"티격태격","n":"치료해 주던 {A}(이)가 한숨을 쉬자 {B}(이)가 민망한 듯 입을 삐죽이며 맞받아쳤다.","qa":"한눈팔면 또 다친다니까.","qb":"알았다고! 다음엔 안 맞을 거거든?"},{"a":"*","b":"*","trig":"대실패","rel":"티격태격","n":"{A}(이)가 요란하게 넘어지며 판을 망치자 {B}(이)가 어이없다는 듯 혀를 찼다.","qa":"아, 방금 건 진짜 바닥이 미끄러웠어!","qb":"변명은 나중에 하고 얼른 일어나!"},{"a":"*","b":"*","trig":"대실패","rel":"티격태격","n":"엉뚱한 실수를 저지른 {A} 옆에서 {B}(이)가 한숨 반, 웃음 반으로 잔소리를 쏟아 냈다.","qa":"다음엔 진짜 제대로 할게!","qb":"그 말 벌써 몇 번째인지 알아?"},{"a":"*","b":"*","trig":"대실패","rel":"냉전","n":"{A}의 치명적인 실수에 휘말린 {B}(이)가 굳은 얼굴로 먼지만 털어 내고 앞장섰다.","qa":"미안해… 내가 너무 서둘렀어.","qb":"…됐어. 지금은 말 섞고 싶지 않아."},{"a":"*","b":"*","trig":"대실패","rel":"냉전","n":"{A}(이)가 함정을 건드린 탓에 위기에 빠지자 {B}의 시선이 차갑게 식어 버렸다.","qa":"일부러 그런 건 아니잖아…","qb":"…다음엔 생각 좀 하고 움직여."},{"a":"*","b":"*","trig":"충돌","rel":"냉전","n":"끝내 한 발짝도 물러서지 않은 {A}(와)과 {B}(이)가 서로 등을 돌린 채 거리를 두었다.","qa":"내 방식이 더 확실해.","qb":"…알아서 해. 난 상관 안 할 테니까."},{"a":"*","b":"*","trig":"충돌","rel":"냉전","n":"날 선 말이 오간 뒤 {A}(와)과 {B} 사이에 무거운 정적이 내려앉았다.","qa":"그렇게 나올 줄 알았어.","qb":"…더 이상 할 말 없네."},{"a":"*","b":"*","trig":"충돌","rel":"티격태격","n":"작전을 두고 티격태격하던 {A}(와)과 {B}(이)가 씩씩거리며 누가 맞나 보자고 내기를 걸었다.","qa":"내 말이 맞으면 끝나고 한턱내!","qb":"좋아, 자신 있으면 어디 해 보자고!"},{"a":"*","b":"*","trig":"충돌","rel":"티격태격","n":"{A}(와)과 {B}(이)가 서로 한마디도 지지 않으려 옥신각신하며 통로를 걸어갔다.","qa":"아니, 내 얘기를 끝까지 들어 봐!","qb":"들어 봐도 네 쪽이 무리수잖아!"},{"a":"*","b":"*","trig":"승리","rel":"의기투합","n":"{A}(와)과 {B}(이)가 동시에 마무리를 꽂아 넣고 뿌듯하게 주먹을 맞댔다.","qa":"지금 타이밍 진짜 좋았지?","qb":"완벽했어! 이 기세 그대로 가자!"},{"a":"*","b":"*","trig":"승리","rel":"의기투합","n":"깔끔하게 섀도를 정리한 {A}(와)과 {B}(이)가 서로의 등을 두드리며 웃음을 터뜨렸다.","qa":"우리 둘 호흡이 제법인데?","qb":"다음 섀도도 금방 끝내 버리자!"},{"a":"*","b":"*","trig":"승리","rel":"티격태격","n":"냉랭하던 {A}(와)과 {B}(이)가 전투를 끝낸 뒤 슬쩍 시선을 맞추며 퉁명스럽게 말을 섞었 ARPLUGS","desc":"불길한 쇠사슬 소리를 한 템포 늦춰 주는 소음 차단 귀마개."},{"id":"R-08","name":"태그 수집 노트","en":"TAG NOTEBOOK","desc":"탐사 중 겪은 크고 작은 사건을 메모할 때마다 짭짤한 원고료가 쌓인다."},{"id":"R-09","name":"분위기 메이커 배지","en":"MOOD MAKER PIN","desc":"파티가 신나게 웃고 떠들수록 주머니도 함께 두둑해지는 황금 배지."},{"id":"R-10","name":"벼랑 끝 부적","en":"LAST-LEG CHARM","desc":"쓰러지기 직전의 위기에서 기적처럼 전원의 체력을 끌어올리는 비상 부적."},{"id":"R-11","name":"단골의 텀블러","en":"LEBLANC TUMBLER","desc":"잠깐 딴짓하며 커피 한 모금 마실 때마다 SP가 슬며시 차오른다."},{"id":"R-12","name":"반전의 주사위","en":"TURNABOUT DICE","desc":"어색하던 사이가 극적으로 풀리는 순간 대박 보상이 터지는 주사위."},{"id":"R-13","name":"막차 승차권","en":"LAST TRAIN TICKET","desc":"후반전 막판 스퍼트에서 수익을 폭증시켜 주는 낡은 막차 티켓."}],"evIntro":{"shadow:swift":["날카로운 바람을 가르며 검은 그림자가 순식간에 코앞까지 파고들었다!","어둠 속에서 붉은 잔상만 남긴 채 날쌘 섀도가 선로를 가로질러 덮쳐 온다!"],"shadow:armor":["철컹거리는 금속음과 함께 육중한 갑옷 섀도가 통로 한가운데 버티고 섰다!","바닥이 울릴 만큼 묵직한 발걸음으로 거대한 철갑 섀도가 길을 틀어막았다!"],"shadow:swarm":["기괴한 웃음소리가 사방에서 울리더니 작은 섀도 떼가 우르르 쏟아져 나왔다!","벽면과 천장 틈새에서 시커먼 그림자들이 물밀듯 기어 내려와 파티를 둘러쌌다!"],"shadow:greed":["동전 소리를 짤랑거리며 불룩한 보따리를 진 섀도가 능글맞게 이쪽을 돌아봤다!","금빛 장신구를 잔뜩 매단 섀도가 낄낄거리며 선로 위로 굴러 들어왔다!"],"chest":["{화자}(이)가 어둠 속에 반쯤 가려진 보물상자를 발견하고 발걸음을 멈췄다.","먼지 덮인 선반 밑에서 금빛 장식이 번쩍이자 {화자}(이)가 조심스레 다가갔다."],"vend":["깜빡이는 형광등 아래 낡은 자판기 한 대가 낮게 윙윙거리며 돌아가고 있다.","버튼 불빛이 반쯤 나간 자판기에서 아직 차가운 냉기가 새어 나온다."],"trap":["바닥 이음새 사이로 미세한 금속 와이어가 어스름하게 빛나고 있다.","유독 발자국 하나 찍히지 않은 바닥 구역이 묘하게 삐걱거리며 내려앉아 있다."],"bag":["지퍼가 반쯤 열린 낡은 가죽 가방이 벤치 아래에 덩그러니 굴러 있다.","주인 이름표가 찢겨 나간 묵직한 여행 가방이 통로 구석에 놓여 있다."],"drink":["아까 뽑아 둔 정체불명의 캔이 가방 안에서 기묘하게 차가운 온기를 낸다.","라벨 하나 없는 알루미늄 캔이 걸음을 옮길 때마다 찰랑거리며 존재감을 드러낸다."],"rest":["어두운 승강장 한쪽에 먼지 하나 없이 말끔한 나무 벤치가 놓여 있다.","지나가는 섀도도 없는 한적한 구석에 잠시 숨을 돌릴 만한 벤치가 보인다."],"quarrel":["갈림길 앞에서 {화자}(이)가 먼저 고개를 저으며 다른 쪽을 고집하고 나섰다.","앞으로 나아갈 방식을 두고 {화자}(이)가 목소리를 높이자 공기가 금세 날카로워졌다."],"ghost":["짙은 붉은 안개 너머로 지도에 없는 승강장의 희미한 불빛이 아른거린다.","지워진 역명판이 매달린 낯선 선로 끝에서 낡은 발차 벨이 울려 퍼진다."],"break":["잠시 섀도의 기척이 잦아든 통로 구석에 어깨를 기댈 만한 벽이 보인다.","붉은 조명이 은은하게 비치는 승강장 귀퉁이에서 모처럼 조용한 틈이 생겼다."],"c-vend":["류지가 아까 먹힌 동전이 아직도 억울한지 자판기 옆을 떠나지 못하고 서성인다.","자판기 앞에서 팔짱을 낀 류지가 이번엔 꼭 본전을 뽑겠다는 표정으로 노려본다."],"c-lead":["좁은 통로 입구에서 모르가나와 류지가 서로 먼저 가겠다고 어깨를 밀치기 시작했다.","앞장설 자리를 두고 모르가나와 류지 사이에 불꽃 튀는 신경전이 벌어졌다."],"c-tea":["잠시 발걸음을 멈춘 틈에 하루가 향긋한 김이 모락모락 나는 보온병 두 개를 내밀었다.","하루가 찻잔을 가지런히 꺼내 들자 통로 안에 고소한 커피와 홍차 향이 동시에 퍼졌다."],"c-model":["유스케가 진지한 눈빛으로 스케치북을 펼치자 후타바가 기겁하며 뒷걸음질쳤다.","빛의 각도가 절묘하다며 유스케가 후타바에게 꼼짝 말라고 외치고 있다."],"c-chase":["선두를 걷는 조커의 보폭에 맞추려는 듯 카스미가 눈을 반짝이며 속도를 높였다.","조커의 발걸음을 좇던 카스미가 가볍게 몸을 풀며 지지 않겠다는 듯 미소 지었다."],"E-001":["어두운 보관실 한가운데서 보물상자 하나가 마치 유인하듯 지나치게 밝게 빛난다.","주변은 온통 먼지투성이인데 유독 그 보물상자만 금방 닦아 놓은 듯 반짝이고 있다."],"E-002":["두꺼운 쇠 셔터가 통로를 가로막고 있고, 아래쪽 틈으로 붉은 안개가 흘러나온다.","오래 녹슨 철문이 굳게 닫혀 있지만, 너머에서 어딘가 값진 기운이 감돈다."],"E-003":["어둠 속 전광판이 치직거리는 잡음과 함께 낯선 기호와 좌표를 번갈아 띄우고 있다.","꺼져 있던 행선지 안내판이 갑자기 켜지더니 기묘한 숫자를 깜빡이며 멈춰 섰다."],"E-004":["천장 어둠 속에서 기척 없이 뛰어내린 섀도 무리가 단숨에 퇴로를 막아섰다.","사방에서 붉은 안광이 번쩍이더니 거대한 섀도 무리가 포위망을 좁혀 온다."],"E-005":["어두운 선로 옆 벤치에 김이 살짝 오르는 찻잔 세트가 누군가를 기다리듯 놓여 있다.","이질적일 만큼 깔끔한 테이블 위에 흰 찻잔과 다과 접시가 정갈하게 차려져 있다."],"E-006":["짤랑거리는 맑은 소리와 함께 황금빛 동전 하나가 어두운 선로 틈으로 굴러갔다.","발끝을 스친 금화 하나가 반짝이는 궤적을 그리며 승강장 아래로 떨어져 내렸다."],"E-007":["파티가 걸음을 멈추자 뒤편 안개 속에서도 똑같이 발소리가 뚝 끊겼다.","일정한 간격으로 울리는 낯선 발소리가 어둠 너머에서 조금씩 가까워지고 있다."],"E-008":["묵직한 쇠사슬로 칭칭 감긴 붉은 궤짝이 심장처럼 낮게 울리며 흔들리고 있다.","자물쇠가 겹겹이 채워진 거대한 궤짝에서 심상치 않은 보물의 기운이 새어 나온다."],"E-009":["행선지 표시가 꺼진 낡은 열차 한 대가 반쯤 열린 문 너머로 희미한 빛을 흘리고 있다.","정적에 잠긴 플랫폼에 소리 없이 멈춰 선 전동차가 마치 탑승을 기다리는 듯하다."],"E-010":["선로 끝을 막아선 거대한 전신 거울 속에 파티원들의 표정이 묘하게 뒤틀려 비친다.","먼지 한 점 없는 커다란 거울이 어둠 속에서도 기이할 만큼 선명하게 이쪽을 비춘다."],"E-011":["불꽃이 튈 듯 요란하게 덜컹거리는 개찰구 틈으로 반짝이는 동전이 쏟아져 내린다.","고장 난 개찰구가 경고음을 울리며 쉴 새 없이 열렸다 닫히기를 반복하고 있다."],"E-012":["수화기 줄이 뚝 끊어진 붉은 공중전화기에서 기이할 만큼 선명한 벨 소리가 울려 퍼진다.","아무도 없는 통로 한구석, 낡은 공중전화기가 누군가 받기를 기다리듯 요란하게 울린다."],"E-013":["반짝이는 금빛 보마가 상자 위에 웅크린 채 이쪽 기척도 모르고 곤히 잠들어 있다.","선로 옆 어둠 속에서 은은한 금빛을 내뿜는 보마가 고른 숨을 내쉬며 졸고 있다."],"E-014":["굳게 잠긴 고급 여행 가방 하나가 보관실 정중앙에 유독 눈에 띄게 놓여 있다.","번호 자물쇠가 반짝이는 묵직한 가방이 마치 열어 보라는 듯 통로 한가운데 서 있다."],"E-015":["플랫폼 천장에 매달린 대형 시계가 기묘한 소리를 내며 거꾸로 시간을 되감고 있다.","붉은 조명 아래 시계 바늘이 반시계 방향으로 째깍거리며 돌아가는 광경이 시선을 끈다."],"E-016":["어두운 지하철 벽면 가득 괴도단 마크를 빼닮은 강렬한 붉은 벽화가 그려져 있다.","통로 한쪽 벽을 뒤덮은 거대한 붉은 그림이 마치 예고장처럼 또렷하게 눈에 들어온다."],"E-017":["어둠 속에서 섀도 둘이 반짝이는 상자를 서로 차지하려고 씩씩거리며 맞서고 있다.","보물 상자를 가운데 두고 신경전을 벌이는 섀도 둘이 아직 이쪽 기척을 눈치채지 못했다."],"E-018":["차갑게 식은 자판기 사이로 유독 따뜻한 노란 불빛이 켜진 칸에서 커피 향이 풍겨 온다.","불 꺼진 승강장 구석, 자판기 한 칸에 켜진 은은한 불빛과 함께 구수한 향기가 퍼진다."],"E-019":["무너져 내린 선로 너머 아슬아슬한 거리 건너편에 반짝이는 보물 더미가 쌓여 있다.","뚝 끊긴 철길 건너편에 값비싸 보이는 상자들이 어둠 속에서 유혹하듯 빛난다."],"E-020":["반쯤 열린 역무실 문 너머로 마이크 전원이 켜진 방송 콘솔이 붉게 빛나고 있다.","아무도 없는 방송실 안에서 붉은 송출 버튼이 깜빡이며 조용히 잡음을 흘려보낸다."],"E-021":["위압적인 기운을 뿜는 정예 섀도가 앞을 가로막자 세 사람의 호흡이 순식간에 맞춰졌다.","거대한 섀도가 포효하며 다가오는 순간, 세 사람이 말없이 서로의 빈틈을 메울 대형을 잡았다."],"E-022":["잠시 발걸음이 멎은 승강장에 칼날처럼 차가운 정적이 내려앉았고, 아케치의 시선이 가라앉았다.","아무도 먼저 입을 열지 않는 무거운 공기 속에서 승강장의 형광등만 신경질적으로 깜빡였다."],"E-023":["양쪽에서 섀도가 동시에 달려들자 류지와 안이 눈짓 한 번으로 자연스럽게 등을 맞댔다.","좁은 통로가 순식간에 막히자 오랜 시간 호흡을 맞춰 온 류지와 안이 나란히 자세를 낮췄다."],"E-024":["세 갈래로 나뉜 선로 앞에서 마코토·하루·아케치가 각기 다른 근거를 들며 길을 짚었다.","갈림길에 멈춰 선 3학년 세 사람이 서로 물러서지 않는 눈빛으로 각자의 루트를 주장했다."],"E-025":["자판기 앞에서 동전 몇 개를 손바닥에 올려놓은 유스케와 류지가 사뭇 비장하게 머리를 맞댔다.","굶주린 눈빛의 유스케와 류지가 자판기 음료 가격을 두고 생존이 걸린 듯 진지한 토론에 빠졌다."],"E-026":["세 사람의 분석과 스캔 데이터가 순식간에 맞물리며 굳게 닫힌 금고의 암호가 모습을 드러냈다.","짧은 의견 교환만으로 퍼즐 조각이 맞춰지듯 숨겨진 금고의 해독 키가 단번에 완성됐다."]},"combos":[{"id":"X-001","a":"joker","b":"mona","title":"파트너의 감","en":"PARTNER INSTINCT","zones":["pass","lost"],"c":[],"intro":"두 갈래 어둠 앞에서 조커와 모르가나가 서로 다른 방향을 가리켰다.","qa":"저쪽 환기구 너머가 수상해.","qb":"아니라고! 이 몸의 코는 왼쪽을 가리킨다고!","ch":[{"label":"조커의 감을 믿는다","sub":"안전한 탐색 · 엔 확보","n":"환기구 너머 작은 창고에서 흩어진 엔을 깔끔하게 챙겼다.","qa":"내 감도 나쁘지 않지?","qb":"흥, 이번엔 조커한테 졌네.","fx":[{"k":"yen","a":350,"b":350},{"k":"mvp","v":1,"all":false}],"rel":"의기투합"},{"label":"모르가나의 코를 믿는다","sub":"보물 기회 · 체력 소모","n":"모르가나가 좁은 틈을 비집고 들어가 반짝이는 보물을 물어 왔다.","qa":"역시 파트너네.","qb":"흐흥! 이제 이 몸의 코를 믿겠지?!","fx":[{"k":"tre","v":1},{"k":"hp","v":-5,"all":false},{"k":"mood","v":4,"all":false}],"rel":"의기투합"}]},{"id":"X-002","a":"joker","b":"ryuji","title":"지름길 돌파","en":"SHORTCUT DASH","zones":[ function vLog(){return `<button class="sm" data-a="log">${ui.log?'로그 접기 ▴':'로그 펼치기 ▾'}</button>${ui.log?`<div class="log">${G.log.map(l=>`<p>${l.who?`<b>${CH[l.who].name}</b> 「${esc(l.t)}」`:esc(l.t)}</p>`).join('')}</div>`:''}`}
function vResult(){const e=G.end||{kind:'clear',y:G.yen},s=G.stats,head=e.kind==='wipe'?'WIPED OUT':G.cleared?(G.fl>=3?'ENDLESS CLEAR':'ALL CLEAR'):'RETURNED';
 return `<div class="title res"><h1>${head.split(' ').join('<br>')}</h1>${G.cut?`<p class="cut">「${esc(G.cut)}」</p>`:''}${(G.achNew||[]).map(k=>{const a=ACH.find(x=>x.id===k);return `<div class="card ach ok" style="--rc:${RAR[a.r]}"><div class="ah"><b>ACHIEVEMENT · ${esc(a.n)}</b><em class="rar">${a.r}</em></div><small>해금: ${esc(achRw(a))}</small></div>`}).join('')}<p>${e.kind==='wipe'?`B${G.fl+1}에서 전멸했습니다. 번 엔의 절반을 건졌습니다.`:G.cleared?(G.fl>=3?`무한 모드로 심층 B${G.fl+1}까지 내려갔다가 무사히 돌아왔습니다.`:'세 관문을 모두 넘고 무사히 르블랑으로 돌아왔습니다.'):`B${G.fl+1}에서 무사히 르블랑으로 돌아왔습니다.`}</p>${G.questNew?`<div class="card quest"><b class="en">REQUEST ${G.questNew} CLEAR</b><p><b>${esc(QUESTS[G.questNew-1].n)}</b> — 괴도 채널 지지율 ${QUESTS[G.questNew-1].sup}%</p><p class="qrw">의뢰 보상 <b>+¥${QUESTS[G.questNew-1].y.toLocaleString()}</b> <small>(르블랑 지갑으로 · 판 수익과 따로)</small></p>${vGuide('in')}</div>`:''}${G.questNew===3?`<div class="dlg ending"><span class="who">ENDING</span><p>선로를 비틀던 쇠사슬 소리가 멎었다. 아침 첫차가 평소처럼 들어오고, 괴도 채널의 숫자가 100에 멈췄다.</p><p>르블랑 다락방, 누군가 말한다. 「…내일도 메멘토스, 가 볼까?」</p></div>`:''}
 <div class="card"><dl><dt>수익${G.setup.negItem?' (×1.5)':''}</dt><dd>¥${e.y}</dd><dt>서브 의뢰</dt><dd>${e.subOk?'+¥'+e.sy:'—'}</dd>${G.setup.bet?`<dt>판돈</dt><dd>${e.bet?'+¥'+e.bet:'잃음'}</dd>`:''}<dt>르블랑 지갑</dt><dd>¥${SV.yen}</dd>${e.dy?`<dt>심층 보너스</dt><dd>+¥${e.dy}</dd>`:''}<dt>도달</dt><dd>B${G.fl+1}${G.fl>=3?' ∞':''}</dd><dt>최고 한 방</dt><dd>${s.best}</dd></dl>
 <div class="slots">${G.items.map(id=>{const I=IT(id);return `<div class="slot f ${EVO[id]?'evo':''} ${I.risk?'risk':''}" data-r="${I.r}">${tierI(id,'sl')}${I.ic}<small>${I.risk?'왜곡':I.r}</small></div>`}).join('')||'<div class="slot"></div>'}</div></div>
 ${(G.afters||[]).length?`<div class="card"><b class="en" style="color:var(--gold)">AFTER</b>${G.afters.map(a=>`<div style="margin-top:8px">${a.chain?`<small class="tg">사슬 · ${esc(a.chain)}</small>`:''}${a.lines.map(l=>l.who&&CH[l.who]?`<p style="margin:4px 0"><b style="color:${CH[l.who].col}">${CH[l.who].name}</b> 「${esc(fillT(l.t))}」</p>`:`<p style="margin:4px 0;color:var(--mut)">${esc(fillT(l.t))}</p>`).join('')}</div>`).join('')}</div>`:''}
 ${vNext()}
 <button class="go" data-a="start">BACK TO LEBLANC →</button><button class="sm" data-a="title">처음 화면</button></div>`}
/* ============ 입력 ============ */
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const [a,v]=b.dataset.a.split(':');
 if(a==='tutok'){const r=tutOk();setTimeout(()=>{if(!tutCur)autoGo()},80);return r}if(a==='tutoff'){SV.tutOff=true;save();tutCur=null;tutDraw();return autoGo()}
 if(a==='start'||a==='hubgo'){ui.screen='hub';ui.ht='go';ui.ps=null;return render()}
 if(a==='codex'){ui.screen='hub';ui.ht='scene';return render()}if(a==='saveload'){ui.screen='hub';ui.ht='rec';return render()}if(a==='manual'){ui.screen='manual';return render()}
 if(a==='mute'){SV.mute=!SV.mute;save();return render()}
 if(a==='htalk')return hubTalk(v);
 if(a==='ht'){ui.ht=v;ui.sv=null;return render()}
 if(a==='sv'){const [,id,i]=b.dataset.a.split(':');ui.sv={id,i:+i};return render()}
 if(a==='ssave')return slotSave(+v);if(a==='sload')return slotLoad(+v);if(a==='cont')return runLoad();
 if(a==='tutt'){SV.tutOff=!SV.tutOff;save();return render()}if(a==='tutr'){SV.tut=[];SV.tutOff=false;save();return render()}
 if(a==='setneg'){SV.set.neg=!SV.set.neg;save();return render()}
 if(a==='setbet'){SV.set.bet=!SV.set.bet;save();return render()}
 if(a==='setstart'){SV.set.start=SV.set.start===v?null:v;save();return render()}
 if(a==='awk'){const x=AWK[v];if(x&&!awoke(v)&&SV.yen>=x.c){SV.yen-=x.c;SV.awk.push(v);save()}return render()}
  if(a==='pack'){const P=PACKS[v];if(P&&!packDone(v)&&SV.yen>=P.c){SV.yen-=P.c;for(const id of P.ids)if(!SV.unl.includes(id))SV.unl.push(id);save()}return render()}
  if(a==='unl'){if(SV.yen>=LOCK[v]&&!SV.unl.includes(v)){SV.yen-=LOCK[v];SV.unl.push(v);save()}return render()}
 if(a==='upg'){const c=UPG[v].cost[SV.up[v]||0];if(c&&SV.yen>=c){SV.yen-=c;SV.up[v]=(SV.up[v]||0)+1;if(v==='bus'&&(SV.q||0)>=SV.up.bus){SV.freeWarp=SV.up.bus;band(`<b>선로 개통!</b> 다음 판 한 번은 B${SV.up.bus+1}에서 바로 출발합니다`,'chain',4200)}save()}return render()}
 if(a==='bond'){const x=SV.bond[v];if(x&&bondReady(v)&&SV.yen>=BOND.cost[x.lv]){SV.yen-=BOND.cost[x.lv];x.lv++;save();ui.bs=v}return render()}
 if(a==='bsee'){ui.bs=ui.bs===v?null:v;return render()}
 if(a==='setwarp'){SV.set.warp=+v;save();return render()}
 if(a==='reroll')return reroll();if(a==='curry')return eatCurry();
 if(a==='ps'){const p=ui.ps,j=p.indexOf(v);if(j>=0)p.splice(j,1);else if(p.length<3)p.push(v);return render()}
 if(a==='go'){if(ui.screen==='title'){ui.screen='hub';ui.ht='go';ui.ps=null;return render()}if(ui.ps&&ui.ps.length===3)return newRun(ui.ps);return}if(a==='title'){ui.screen='title';return render()}
 if(a==='mv')return move(+v);if(a==='ret'){if(G.battle&&G.battle.kind==='reaper'&&G.battle.round<=1)achGet('stare');return endRun(G.cleared?'clear':'return')}
 if(a==='smoke'){const B=G.battle;if(!B||B.kind!=='reaper'||!(G.smoke>0)||ui.busy)return;G.smoke--;G.battle=null;addRisk(-8,'연막탄');log('연막탄! 거둬들이는 자를 따돌렸다 — 이 층에선 다시 안 쫓아온다.');ui.screen='map';return render()}if(a==='down')return descend();
 if(a==='ev')return resolveEv(v==='open'?'leave':v);
 if(a==='rsel'){ui.riftSel=v;return render()}if(a==='rpay')return riftPay(v);if(a==='rleave'){G.ev=null;log('균열이 소리 없이 닫혔다.');ui.screen='map';return render()}
  if(a==='deal')return dealPick(v);
 if(a==='storyok')return storyOk();
 if(a==='cb')return comboPick(+v);
 if(a==='take')return takeItem(v);
 if(a==='buy')return shopBuy(+v);if(a==='shopheal')return shopHeal();if(a==='shoprr')return shopReroll();
 if(a==='bsel')return benchToggle(+v);if(a==='bsell')return benchSell();if(a==='bplus')return benchPlus();if(a==='synth')return synth();if(a==='leave'){benchLeave();ui.screen='map';return render()}
 if(a==='tip'){ui.tip=ui.tip===v?null:v;return render()}
 if(a==='nofw'){SV.freeWarp=0;save();return render()}
 if(a==='endshow'){ui.endShow=!ui.endShow;return render()}
 if(a==='sbtog'){SV.sbOff=SV.sbOff?0:1;save();if(!SV.sbOff){sbFlush();sbStats(true)}return render()}
 if(a==='tagi'){ui.tagi=ui.tagi===v?null:v;return render()}
 if(a==='tagmv'){const i=G.items.indexOf(ui.tip);if(i<0||G.battle)return;const [x]=G.items.splice(i,1);if(v==='in')G.items.splice(TAG_N-1,0,x);else G.items.push(x);log(`${IT(x).n}: 각인 칸${v==='in'?'으로 올렸다':'에서 뺐다'}`);achTag4();runSave(true,null);return render()}
 if(a==='log'){ui.log=!ui.log;return render()}
 if(!G.battle)return;
 if(a==='sel'){G.battle.sel=+v;return render()}
 if(a==='sk')return useSkill(+v);if(a==='sw')return doSwap(+v);if(a==='bt')return baton(v);if(a==='allout')return allOut();
 if(a==='auto'){G.auto=!G.auto;if(G.auto)say('joker','decide');render();return autoGo()}});
document.addEventListener('keydown',e=>{if(ui.screen==='battle'&&G.battle&&!ui.busy){const k=e.key;if(k==='1'||k==='2')useSkill(+k-1);else if(k==='3')doSwap(-1);else if(k==='4')doSwap(1);else if(k===' '){const al=foeAlive();if(al.length&&al.every(f=>f.down))allOut()}}
 else if(ui.screen==='event'&&G.ev&&G.ev.kind!=='combo'){if(G.ev.kind==='plain'&&(e.key===' '||e.key==='Enter'))resolveEv('leave');else if(e.key==='1')resolveEv('stop');else if(e.key==='2')resolveEv('boost');else if(e.key==='3')resolveEv('leave')}});
render();
</script>
