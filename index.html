<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘도 메멘토스!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="fonts/galmuri/galmuri.css" rel="stylesheet">
<!-- 구글 폰트는 첫 화면을 막지 않게 늦게 붙인다 (리뷰 3차 P1). 글꼴이 오기 전엔 대체 글꼴로 먼저 보임 -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Anton&family=Jua&family=Archivo+Black&family=IBM+Plex+Sans+KR:wght@400;700&family=Orbit&family=Playfair+Display:ital,wght@0,900;1,900&family=Special+Elite&display=swap" onload="this.onload=null;this.rel='stylesheet';window.gfOk=1" onerror="window.gfOk=1">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Jua&family=Archivo+Black&family=IBM+Plex+Sans+KR:wght@400;700&family=Orbit&family=Playfair+Display:ital,wght@0,900;1,900&family=Special+Elite&display=swap"></noscript>
<style>
/* 로딩 화면: 원래 생기는 빈틈(큰 파일 해석 · 구글 폰트 교체)만 가린다. 일부러 기다리게 하지 않음 */
#loader{position:fixed;inset:0;z-index:999;display:grid;place-items:center;align-content:center;gap:14px;background:#0f0b0c radial-gradient(120% 50% at 50% -10%,#3d0a0e 0,transparent 60%) no-repeat;color:#f6f1ea;font-family:Galmuri11,monospace;transition:opacity .4s,visibility .4s}
#loader.out{opacity:0;visibility:hidden;pointer-events:none}
#loader .ld-tun{width:240px;height:84px;perspective:140px;overflow:hidden;-webkit-mask:linear-gradient(transparent,#000 70%);mask:linear-gradient(transparent,#000 70%)}
#loader .ld-rail{width:100%;height:220%;transform-origin:50% 100%;transform:rotateX(62deg) translateY(-50%);background:linear-gradient(90deg,transparent 30%,#e5191c 30% 33%,transparent 33% 67%,#e5191c 67% 70%,transparent 70%),repeating-linear-gradient(#0f0b0c 0 14px,#4a3237 14px 20px);background-size:100% 100%,52% 100%;background-position:0 0,50% 0;background-repeat:no-repeat,no-repeat;animation:ldrun .5s linear infinite}
#loader p{margin:0}#loader .ld-t{font-size:16px;letter-spacing:.12em;margin-top:4px}
#loader .ld-t b{color:#e5191c;font-weight:700}
#loader .ld-s{font-size:12px;color:#8d807a;letter-spacing:.2em}
@keyframes ldrun{to{background-position:0 0,50% 20px}}
@media(prefers-reduced-motion:reduce){#loader{transition:none}#loader .ld-rail{animation:none}}
/* VOICE: 장난스럽고 날렵한 괴도단 관찰 놀이터
   IDEA: 메멘토스 역의 붉은 안내판과 괴도단 예고장
   PICTURE: 붉은 선로가 소실점으로 빨려 드는 터널 포스터, 탐사 중엔 노선도와 말풍선
   COLOUR and TYPE: 먹색 바탕, 신호 빨강, 종이 흰색 / 주아(제목) + IBM Plex Sans KR(본문) + Orbit(내비·시스템) + Anton
   LAYOUT: 모바일 한 줄 스택, 넓은 화면은 노선도 | 로그 두 칸 */
:root{color-scheme:dark;--bg:#0f0b0c;--p:#1b1416;--p2:#2a1e22;--ink:#f6f1ea;--mut:#b9aca5;--red:#e5191c;--red2:#8e0f13;--gold:#f5b942;--line:#3b2b2f;--line2:#4a3237;--faint:#8d807a;--redt:#ff5a5a;--hd:'Jua','IBM Plex Sans KR',sans-serif;--en:'Anton','Jua',sans-serif;--disp:'Archivo Black','Jua',sans-serif;--sys:'Orbit','IBM Plex Sans KR',sans-serif}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{word-break:keep-all;overflow-wrap:anywhere;margin:0;background:var(--bg) radial-gradient(120% 50% at 50% -10%,#3d0a0e 0,transparent 60%) no-repeat;color:var(--ink);font:16px/1.55 'IBM Plex Sans KR',system-ui,sans-serif;overflow-x:clip;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
h1,h2,h3{font-family:var(--hd);font-weight:400;line-height:1.05;margin:0;text-wrap:balance}
.btn{min-height:44px;padding:10px 20px;background:var(--red);color:#fff;font-family:var(--en);letter-spacing:.03em;font-size:18px;clip-path:polygon(5% 0,100% 0,95% 100%,0 100%);transition:transform .15s}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn.ghost{background:var(--ink);color:#141012}
.btn.sm{min-height:40px;font-size:15px;padding:8px 16px}
.btn.big{font-size:21px;padding:12px 34px}
.btn:disabled{background:#3b2b2f;color:var(--faint);cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.wrap{max-width:1080px;margin:0 auto;padding:16px max(4vw,14px) 40px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.bar h2{font-size:32px;flex:1}
.pill{background:var(--ink);color:#141012;font-family:var(--en);padding:4px 12px;font-size:17px;white-space:nowrap}
.hint{color:var(--mut);font-size:14px;margin:4px 0 14px}
/* main */
.main{max-width:1080px;margin:0 auto;padding:max(3vw,16px) max(4vw,14px) 40px}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(20px,4vw,48px);align-items:center}
.poster{aspect-ratio:4/3;background:#000;border:3px solid var(--ink);transform:rotate(-1.5deg);box-shadow:12px 12px 0 var(--red);overflow:hidden}
.poster svg{display:block;width:100%;height:100%}
.glow{animation:pulse 2.6s ease-in-out infinite alternate;transform-origin:200px 158px}
@keyframes pulse{to{opacity:.45;transform:scale(1.15)}}
.kick{color:var(--mut);font-size:14px;margin:0 0 10px}
.ttl h1{font-size:clamp(46px,8vw,78px);line-height:.98;text-shadow:5px 5px 0 var(--red)}
.lead{font-size:17px;max-width:32em;color:#ebe3dd;margin:18px 0 22px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:36px 0 18px}
.stat{background:var(--p);padding:12px 14px}
.stat b{display:block;font-family:var(--disp);font-size:26px;font-weight:400}
.stat span{color:var(--mut);font-size:13px}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.how div{background:var(--p);padding:14px 16px}
.how b{font-family:var(--disp);font-weight:400;font-size:20px;letter-spacing:.02em;display:block;color:var(--red)}
.how p{margin:4px 0 0;color:var(--mut);font-size:14px}
.fine{color:var(--faint);font-size:13px;margin-top:26px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fine button{text-decoration:underline;color:var(--mut);min-height:44px}
/* party */
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--mut);margin-bottom:10px}
.legend i{display:inline-block;width:12px;height:12px;margin-right:5px;vertical-align:-1px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.card{position:relative;text-align:left;background:var(--p);padding:12px 12px 14px;border:2px solid transparent;display:flex;flex-direction:column;gap:4px;min-height:190px}
.card:hover{border-color:var(--line2)}
.card .code{font-family:var(--en);font-size:28px;color:var(--c);line-height:1;letter-spacing:.02em}
.card b{font-size:17px}
.card .tp{font-family:var(--en);letter-spacing:.05em;font-size:14px;color:#141012;background:var(--c);align-self:flex-start;padding:0 8px}
.card .tr{font-size:13px;color:var(--mut);line-height:1.45}
.card .w{display:flex;height:7px;margin-top:auto;gap:2px}
.card .w i{display:block;height:100%}
.card.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 15%,var(--p))}
.card .no{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:var(--c);color:#141012;font-family:var(--hd);display:none;place-items:center;font-size:18px}
.card.on .no{display:grid}
.dock{position:sticky;bottom:0;margin:16px calc(-1*max(4vw,14px)) 0;padding:12px max(4vw,14px) calc(12px + env(safe-area-inset-bottom));background:rgba(15,11,12,.97);border-top:2px solid var(--red);display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.slots{display:flex;gap:6px}
.slot{width:76px;height:44px;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--en);font-size:16px;color:var(--line2)}
.slot.f{border:2px solid var(--c);color:var(--c)}
.dinfo{flex:1 1 220px;font-size:13px;color:var(--mut);line-height:1.5}
.dinfo b{color:var(--ink)}
.dinfo .new{color:var(--gold);font-weight:700}
/* explore */
.ex{max-width:1180px;margin:0 auto;padding:8px max(3vw,10px) 96px}
.xbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:6px 0 10px;border-bottom:2px solid var(--red)}
.tn{font-family:var(--en);font-size:36px;line-height:1}
.tn small{font-size:16px;color:var(--mut)}
.zn{flex:1 1 140px}
.zn b{font-family:var(--en);font-weight:400;font-size:22px;letter-spacing:.02em;display:block;line-height:1.1}
.zn small{color:var(--mut);font-size:13px;font-family:var(--sys);word-spacing:-.22em}
.money{font-family:var(--disp);font-size:21px;white-space:nowrap}
.money small{font-family:var(--en);letter-spacing:.05em;font-size:14px;color:var(--mut);margin-left:6px}
.xrow{display:flex;gap:4px;justify-content:flex-end}
.card .cnd{position:absolute;top:6px;right:6px;font-size:13px;padding:1px 6px;background:var(--p2)}.card .cnd.fresh{color:#9ff0ae}.card .cnd.tired{color:#ffb1b1}.card .memdot{position:absolute;bottom:6px;right:8px;font-size:13px;color:var(--gold)}
.board .fx,.detail .fx{grid-column:1/-1;margin:4px 0 0;font-size:13px;line-height:1.45;color:var(--ink)}.board .fx i,.detail .fx i{font-style:normal;color:var(--gold);margin-right:4px}
.plog{margin:14px 0}.plog ul{list-style:none;margin:0;padding:0}.plog li{padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}.plog li span{color:var(--mut)}.plog li em{font-style:normal;color:var(--gold)}.plog li.ok span,.plog li.card span{color:var(--gold)}.tag.flow.up{color:#9ff0ae;background:#1d3a24}.tag.flow.dn{color:#ffb1b1;background:#4a1517}
.ptags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.tag{font-size:13px;padding:2px 8px;background:var(--p2);color:var(--gold);white-space:nowrap}
.mood{font-family:var(--en);letter-spacing:.05em;font-size:14px;color:#141012}
.m-good{background:var(--gold)}.m-meh{background:#c8a9b2}.m-bad{background:var(--red);color:#fff}
.party{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.tile{background:var(--p);padding:8px;border-top:3px solid var(--c);transition:opacity .3s}
.tile.down{opacity:.45;filter:grayscale(1)}
.bub{position:relative;background:var(--ink);color:#141012;font-size:13px;line-height:1.35;padding:6px 8px;border-radius:12px 12px 12px 2px;margin-bottom:12px;transform-origin:14px 100%}
.bub.tap{display:block;width:100%;text-align:left;border:0;font:inherit;font-size:13px;cursor:pointer;outline:2px dashed transparent}.bub.tap:hover,.bub.tap:focus-visible{outline-color:var(--gold)}
.bub .nd{position:absolute;right:-4px;top:-8px;background:var(--gold);color:#141012;font:400 13px var(--en);padding:0 5px;letter-spacing:.03em}
.bub span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.bub::after{content:'';position:absolute;left:10px;bottom:-8px;border-style:solid;border-width:8px 9px 0 0;border-color:var(--ink) transparent transparent}
.bub.fresh{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(.4) rotate(-7deg);opacity:0}60%{transform:scale(1.06) rotate(1deg);opacity:1}100%{transform:none}}
.face.fresh{animation:bounce .5s ease-out .1s}
@keyframes bounce{30%{transform:translateY(-7px) scale(1.25)}65%{transform:translateY(1px) scale(.95)}}
.tile.hit{animation:shake .42s}
.tile.hit .hb i{background:var(--red)}
@keyframes shake{15%{transform:translateX(-6px) rotate(-1.5deg)}35%{transform:translateX(5px) rotate(1deg)}55%{transform:translateX(-3px)}75%{transform:translateX(2px)}}
.tile.heal{animation:heal .7s}
@keyframes heal{35%{box-shadow:inset 0 0 0 3px #59c3ff,0 0 18px #59c3ff66}}
.money{position:relative}
.fly{position:absolute;right:0;top:20px;font-family:var(--en);font-size:19px;color:var(--gold);pointer-events:none;white-space:nowrap;animation:fly 1.1s ease-out forwards}
.fly.neg{color:#ff7a7a}
@keyframes fly{0%{transform:translateY(8px) scale(.8);opacity:0}20%{transform:translateY(0) scale(1.1);opacity:1}100%{transform:translateY(-28px);opacity:0}}
.banner{position:fixed;left:-10%;right:-10%;top:40%;z-index:40;background:var(--red);color:#fff;font-family:var(--hd);font-size:clamp(28px,7vw,50px);text-align:center;padding:12px 0;transform:skewY(-4deg);pointer-events:none;border-block:4px solid var(--ink);animation:sweep 1.05s cubic-bezier(.7,0,.3,1) forwards}
.banner span{display:inline-block;transform:skewY(4deg)}
.banner small{display:block;font-size:.42em;font-family:'IBM Plex Sans KR',sans-serif;font-weight:700;opacity:.85}
@keyframes sweep{0%{clip-path:inset(0 100% 0 0)}28%,72%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 100%)}}
.scrim{position:fixed;inset:0;z-index:25;background:rgba(8,5,6,.6)}
.scrim.enter{animation:fade .25s}
@keyframes fade{from{opacity:0}}
.evt.enter{animation:sheet .4s cubic-bezier(.2,.9,.25,1.06)}
@keyframes sheet{from{transform:translateY(100%)}}
.evt.enter h3{animation:slash .45s .12s both}
@keyframes slash{from{transform:translateX(-36px) skewX(-14deg);opacity:0}}
.evt.enter .ch{animation:rise .32s both;animation-delay:calc(180ms + var(--i)*70ms)}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
.ch{transition:transform .12s,border-color .12s}
.ch:active:not(:disabled){transform:scale(.97)}
.nm{display:flex;align-items:center;gap:6px}
.nm .code{font-family:var(--en);color:var(--c);font-size:19px;line-height:1}
.nm b{font-size:13px;color:var(--mut);font-weight:400;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.face{width:24px;height:24px;border-radius:50%;background:var(--c);color:#141012;display:grid;place-items:center;font-weight:900;font-size:13px;flex:none}
.hb{height:7px;background:var(--line);margin-top:6px}
.hb i{display:block;height:100%;background:var(--ink);transition:width .4s}
.hb i.low{background:var(--red)}
.hb.s{height:4px;margin-top:3px}.hb.s i{background:#59c3ff}
.nums{font-size:13px;color:var(--mut);margin-top:3px;white-space:nowrap}
.mt{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.mt .tag{padding:0 6px}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:10px;margin-top:10px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.mapbox{background:var(--p);padding:10px}
.map{position:relative;height:190px}
.mapbox.big .map{height:290px}
@media(min-width:821px){.map{height:290px}}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.map line{stroke:var(--line2);stroke-width:7;stroke-linecap:round}
.map line.hot{stroke:var(--red)}
.node{position:absolute;transform:translate(-50%,-50%);width:max-content;max-width:42%;padding:6px 10px;background:var(--p2);border:2px solid var(--line2);text-align:center;line-height:1.2}
.node b{display:block;font-family:var(--en);font-weight:400;font-size:16px;letter-spacing:.03em}
.node small{display:block;font-size:13px;color:var(--mut);font-family:var(--sys);word-spacing:-.22em}
.node.cur{background:var(--red);border-color:var(--ink)}
.node.cur small{color:#ffe1e1}
button.node.opt{border-color:var(--ink);min-height:44px;animation:blink 1s ease-in-out infinite alternate}
button.node.opt:hover{background:var(--line)}
@keyframes blink{to{border-color:var(--red)}}
.node.lock{opacity:.6;border-style:dashed}
.mhint{font-size:14px;color:var(--gold);margin:8px 0 0;font-weight:700}
.logbox{background:var(--p)}
#log{list-style:none;margin:0;padding:4px 10px;height:clamp(260px,44vh,520px);overflow-y:auto}
#log li{display:grid;grid-template-columns:42px minmax(0,1fr);gap:8px;padding:7px 0;border-bottom:1px solid var(--p2);font-size:15px}
#log time{font-family:var(--en);color:var(--faint);font-size:13px;padding-top:2px}
#log p{margin:0;border-left:3px solid var(--c,transparent);padding-left:8px}
#log .who{color:var(--c);margin-right:6px;font-family:var(--en);font-weight:400;letter-spacing:.03em}
#log q{quotes:'“' '”';color:#fff;font-weight:700}
#log em{display:inline-block;font-style:normal;font-size:13px;background:var(--p2);color:var(--gold);padding:0 6px;margin-left:6px}
#log li.sys p{color:var(--mut);font-family:var(--sys);word-spacing:-.22em}
#log li.grp p{color:var(--faint)}#log li.grp b{font-family:var(--en);font-weight:400;margin-right:2px}
#log .lgx{margin-left:8px;background:none;border:1px solid var(--p2);color:var(--mut);font:13px var(--sys);padding:1px 7px;cursor:pointer}
#log li.ev p{color:#fff;font-family:var(--hd);word-spacing:normal;font-size:18px;border-left-color:var(--red)}
#log li.turn p{color:var(--redt);font-family:var(--hd);word-spacing:normal}
#log li.warn p{color:#ff7a7a;font-weight:700}
.evt{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#150f11;border-top:4px solid var(--red);padding:16px max(4vw,14px) calc(18px + env(safe-area-inset-bottom));box-shadow:0 -24px 48px rgba(0,0,0,.7);max-height:78vh;overflow:auto}
.evt>div{max-width:640px;margin:0 auto}
.evt h3{font-size:26px}
.evt .intro{color:var(--mut);margin:6px 0}
.pq{margin:6px 0 4px;font-weight:700}
.pq b{color:var(--c);font-family:var(--en);font-weight:400;font-size:18px;margin-right:6px}
.ch{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--p2);padding:10px 12px;margin-top:8px;min-height:56px;border:2px solid transparent}
.ch:hover:not(:disabled){border-color:var(--ink)}
.ch .k{font-family:var(--en);font-size:22px;background:var(--red);color:#fff;width:38px;height:38px;display:grid;place-items:center;flex:none;transform:skewX(-8deg)}
.ch b{display:block}
.ch small{color:var(--mut);font-size:13px}
.ch:disabled{opacity:.42;cursor:not-allowed}
.ctl{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(15,11,12,.97);border-top:2px solid var(--red);display:flex;gap:6px;padding:8px max(3vw,8px) calc(8px + env(safe-area-inset-bottom));justify-content:center}
.ctl button{min-height:44px;padding:6px 10px;background:var(--p2);font-family:var(--en);letter-spacing:.04em;font-size:15px;flex:1 1 0;max-width:120px;white-space:nowrap}
.ctl button[aria-pressed=true]{background:var(--ink);color:#141012}
.ctl .warn{background:var(--red2)}
.ctl button:disabled{opacity:.38;cursor:not-allowed}
/* result */
.report{background:var(--ink);color:#141012;max-width:520px;margin:12px auto 0;transform:rotate(-1deg);box-shadow:12px 12px 0 var(--red);padding:0 0 16px}
.report header{background:#141012;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px 20px;clip-path:polygon(0 0,100% 0,100% 78%,0 100%)}
.report header span{font-family:var(--hd);font-size:25px}
.report header small{font-size:13px;color:#cfc4be;white-space:nowrap}
.report dl{margin:10px 16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px}
.report dt{font-family:var(--en);letter-spacing:.05em;font-size:14px;color:#6b5f5a;padding-top:2px;white-space:nowrap}
.report dd{margin:0;font-weight:700}
.stars{color:var(--red);font-size:21px;letter-spacing:2px}
.stars i{display:inline-block;font-style:normal}
.report.anim{animation:drop .55s cubic-bezier(.2,.9,.25,1.1) both}
@keyframes drop{from{transform:translateY(-40px) rotate(-7deg);opacity:0}}

body{background-image:radial-gradient(120% 50% at 50% -10%,#3d0a0e 0,transparent 60%),radial-gradient(rgba(255,255,255,.035) 1px,transparent 1.5px);background-size:auto,6px 6px;background-repeat:no-repeat,repeat}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.rn{display:inline-block;transform:rotate(var(--r,0deg));padding:.02em .1em;margin:.03em .015em;line-height:1.05;font-family:var(--disp);font-style:normal}
.rn0{background:var(--ink);color:#141012}
.rn1{background:#141012;color:var(--ink);font-family:'Playfair Display','Jua',serif;font-weight:900}
.rn2{color:var(--ink);font-family:'Anton','Jua',sans-serif;font-size:1.12em;text-shadow:2px 2px 0 #141012}
.rn3{background:var(--red);color:#fff;box-shadow:2px 2px 0 #141012}
.rn4{background:var(--ink);color:#141012;font-family:'Playfair Display','Jua',serif;font-style:italic;font-weight:900}
.rn5{background:#d9d2cc;color:#141012;font-family:'Special Elite','Jua',monospace}
.rnb{font-size:1.24em}
.rn-sp{display:inline-block;width:.28em}
.rnword{display:inline-block;white-space:nowrap}
.stair{list-style:none;margin:26px 0 0;padding:0;display:grid;gap:10px;justify-items:start}
.stair li{margin-left:calc(var(--n)*22px)}
.stair button{position:relative;isolation:isolate;text-align:left;min-height:52px;padding:6px 20px 8px 14px;font-family:var(--disp);font-size:clamp(26px,4vw,34px);line-height:1.05;color:var(--ink);text-shadow:3px 3px 0 #141012;transform:rotate(-2deg)}
.stair button::before{content:'';position:absolute;inset:-4px -12px -4px -8px;z-index:-1;background:#141012;clip-path:polygon(0 4%,98% 0,100% 90%,2% 100%);transform:scaleX(0);transform-origin:left;transition:transform .2s cubic-bezier(.2,.9,.25,1.1)}
.stair button.primary::before,.stair button:hover::before,.stair button:focus-visible::before{transform:none}
.stair button.primary{text-shadow:none}

.ch::before{content:'';position:absolute;inset:0 -6px 0 -8px;z-index:-1;background:var(--red);clip-path:polygon(1% 12%,100% 0,97% 90%,0 100%);transform:scaleX(0);transform-origin:left;transition:transform .16s cubic-bezier(.2,.9,.25,1.1)}
.ch:hover:not(:disabled)::before,.ch:focus-visible::before,.ch:active:not(:disabled)::before{transform:none}
.ch:hover:not(:disabled),.ch:focus-visible{border:0;outline:none}

/* ===== v5 모션 시스템 (motionmaxxing · mg-styles-15 Collage 참고) =====
   착지=감속(snap/land), 퇴장=가속(exit), 오버슈트는 보고서 별 도장 하나만.
   예고장 조각=12fps 스톱모션(steps), 나머지 UI=부드러운 프레임. 화면 하나에 살아 있는 것 하나. */
:root{--snap:cubic-bezier(.05,.85,.2,1);--land:cubic-bezier(.22,.8,.3,1);--exit:cubic-bezier(.6,0,.9,.4)}
.btn,.ch,.stair button,.ctl button,.card,.tabs button{transition:transform .22s var(--land)}
.btn:active:not(:disabled),.ctl button:active:not(:disabled),.card:active,.tabs button:active,.ch:active:not(:disabled){transform:scale(.94);transition-duration:.06s}
.stair button:active{transform:rotate(-2deg) scale(.95);transition-duration:.06s}
.bub.fresh{animation:bubIn .4s var(--snap)}
@keyframes bubIn{0%{transform:translateY(-4px) scale(1.12) rotate(-2deg);opacity:.25}25%{opacity:1}100%{transform:none}}
.face.fresh{animation:faceIn .3s var(--snap) .07s both}
@keyframes faceIn{from{transform:scale(1.45)}}
.fly{animation:fly 1s var(--exit) forwards}
@keyframes fly{0%{transform:translateY(6px);opacity:0}12%{transform:translateY(0);opacity:1}100%{transform:translateY(-30px);opacity:0}}
.evt.enter{animation:sheet .38s var(--snap)}
.evt.enter h3{animation:none}
.evt.enter .ch{animation:rise .4s var(--land) both;animation-delay:var(--d,0ms)}
@keyframes rise{0%{transform:translateY(14px);opacity:.2}30%{opacity:1}100%{transform:none}}
.ch::before,.stair button::before{transition:transform .2s var(--snap)}
.report.anim{animation:arrive .5s var(--snap) both}
@keyframes arrive{0%{transform:translateY(-16px) scale(1.07) rotate(-3deg);opacity:.3}20%{opacity:1}100%{transform:rotate(-1deg)}}
#app.scr-in>*:not(.ex),#app.scr-in>.ex>*:not(.ctl):not(.evt):not(.scrim){animation:scrIn .42s var(--snap) both}
#app.scr-in>*:nth-child(2),#app.scr-in>.ex>*:nth-child(2){animation-delay:.04s}
#app.scr-in>.ex>*:nth-child(3){animation-delay:.07s}
#app.scr-in>.ex>*:nth-child(4){animation-delay:.12s}
@keyframes scrIn{0%{transform:translateX(26px) skewX(-3deg);opacity:.35}25%{opacity:1}100%{transform:none}}
.rn1{box-shadow:0 0 0 2px var(--ink)}
.rn3{box-shadow:0 0 0 2px var(--ink),3px 3px 0 #141012}
.scr-in .rn,.evt.enter .rn,.report.anim .rn,.banner .rn{animation:rnSlap .25s steps(3,end) var(--rd,0ms) both}
@keyframes rnSlap{0%{transform:scale(1.6) rotate(calc(var(--r,0deg) - 12deg));opacity:0}34%{opacity:1}100%{transform:rotate(var(--r,0deg))}}
.boil .rn{animation:boil .5s steps(1,end) infinite;animation-delay:calc(var(--rd,0ms) * -3)}
.scr-in .boil .rn{animation:rnSlap .25s steps(3,end) var(--rd,0ms) both,boil .5s steps(1,end) calc(var(--rd,0ms) + .45s) infinite}
@keyframes boil{0%{transform:rotate(var(--r,0deg))}33%{transform:rotate(calc(var(--r,0deg) + .7deg)) translate(1px,-1px)}66%{transform:rotate(calc(var(--r,0deg) - .6deg)) translate(-1px,0)}}
@keyframes tone{to{background-position:8px 8px}}

"qa":"모나! 보물 반응 찍었어! 바로 대시!","qb":"오오, 내비랑 손발이 척척 맞는다고!","end":null},{"a":"yusuke","b":"joker","rel":"의기투합","qa":"지금 이 순간, 완벽한 구도가 보였군.","qb":"그래, 그대로 밀고 가자.","end":null},{"a":"makoto","b":"futaba","rel":"의기투합","qa":"약점 스캔 끝났어? 바로 들어간다.","qb":"전부 마킹 완료! 퀸, 싹 쓸어 버려!","end":null},{"a":"futaba","b":"yusuke","rel":"티격태격","qa":"이나리! 보물 앞에서 스케치북 좀 치워!","qb":"이 빛의 각도를 놓치면 평생 후회한다!","end":{"who":"ann","q":"둘 다 얼른 걸어!"}},{"a":"makoto","b":"ryuji","rel":"티격태격","qa":"류지, 또 계획 없이 뛰어들었지?!","qb":"아, 결과만 좋으면 된 거 아니냐고!","end":{"who":"joker","q":"둘 다 진정해."}},{"a":"akechi","b":"futaba","rel":"티격태격","qa":"네 내비 안내, 가끔 너무 시끄럽지 않아?","qb":"뭐?! 내 완벽한 보이스 서포트를 무시해?!","end":null},{"a":"mona","b":"yusuke","rel":"티격태격","qa":"어이 폭스! 동전 줍는 데 무슨 예술이 필요하냐!","qb":"세속의 물욕에도 품격이 필요한 법이다.","end":null},{"a":"ryuji","b":"haru","rel":"티격태격","qa":"하루, 아까 도끼 너무 내 옆으로 스쳤다고!","qb":"어머, 안 맞았으니까 괜찮은 거 아니야?","end":{"who":"ryuji","q":"그게 더 무섭다고!"}},{"a":"ann","b":"ryuji","rel":"티격태격","qa":"야 사카모토 류지, 아까 내 쪽으로 먼지 튀겼지!","qb":"일부러 그런 게 아니라 미끄러진 거라고!","end":null},{"a":"akechi","b":"mona","rel":"티격태격","qa":"고양이 주제에 지휘관 행세가 지나치네.","qb":"고양이가 아니라 괴도단 선배라고 몇 번을 말해!","end":null},{"a":"haru","b":"akechi","rel":"냉전","qa":"아케치 군, 지금은 말을 안 거는 게 서로 편할 것 같네.","qb":"…동감이야. 할 일만 하고 끝내지.","end":null},{"a":"futaba","b":"akechi","rel":"냉전","qa":"흥, 아케치 쪽 루트는 스캔 안 해 줄 거야.","qb":"필요 없어. 내 눈으로 보는 게 더 빠르니까.","end":{"who":"makoto","q":"하아… 둘 다 그만해."}},{"a":"mona","b":"ryuji","rel":"냉전","qa":"흥, 저 녀석한테는 한마디도 안 걸 거야.","qb":"나도 고양이랑은 말 안 섞는다고!","end":{"who":"ann","q":"언제까지 저럴 거야…"}},{"a":"makoto","b":"akechi","rel":"냉전","qa":"독단적인 판단은 파티 전체를 위험하게 해.","qb":"효율을 따졌을 뿐이야. 불만이면 네가 앞장서든가.","end":null},{"a":"joker","b":"akechi","rel":"냉전","qa":"아까 그 선택, 너무 위험했어.","qb":"결과를 냈잖아. 설교는 사양할게.","end":null},{"a":"ann","b":"mona","rel":"냉전","qa":"모나, 방금 그건 좀 심했어.","qb":"으… 아, 안 아가씨한테까지 그런 소리를 듣다니…","end":null},{"a":"yusuke","b":"ryuji","rel":"냉전","qa":"…자네와는 미학적 대화가 통하지 않는군.","qb":"미학이고 뭐고, 말 좀 알아듣게 하라고!","end":null},{"a":"futaba","b":"akechi","rel":"뜻밖의 신뢰","qa":"…아까 막아 준 건 꽤 나이스였어. 딱 이번만 인정해 줄게.","qb":"의외네. 네 입에서 칭찬이 다 나오고.","end":null},{"a":"haru","b":"akechi","rel":"뜻밖의 신뢰","qa":"아케치 군, 아까 뒤를 지켜 줘서 고마워.","qb":"…신경 쓰지 마. 전력을 유지하는 게 유리했을 뿐이야.","end":null},{"a":"mona","b":"ryuji","rel":"뜻밖의 신뢰","qa":"어이 스컬… 아까는 제법 듬직했다고.","qb":"뭐, 뭐야 갑자기! 기분 나쁘게 왜 칭찬하고 그래!","end":null},{"a":"makoto","b":"akechi","rel":"뜻밖의 신뢰","qa":"방금 판단은 정확했어. 네가 있어서 다행이야.","qb":"네 백업이 빨랐던 덕분이지. 호흡이 꽤 맞네.","end":null},{"a":"yusuke","b":"futaba","rel":"뜻밖의 신뢰","qa":"후타바, 아까 네 지시 덕분에 위기를 넘겼다. 고맙군.","qb":"에헤헤, 이나리가 솔직하게 고맙다고 하니까 좀 쑥스러운데?","end":null},{"a":"kasumi","b":"akechi","rel":"뜻밖의 신뢰","qa":"아케치 선배, 아까 제 빈틈을 메워 주셔서 정말 감사했어요!","qb":"네 움직임이 워낙 깔끔해서 맞추기 쉬웠을 뿐이야.","end":null},{"a":"joker","b":"akechi","rel":"뜻밖의 신뢰","qa":"등 뒤는 너한테 맡겨도 되겠네.","qb":"흥, 당연한 소리를. 놓치지 말고 따라와.","end":null},{"a":"joker","b":"akechi","rel":"의기투합","qa":"이제 말 안 해도 다음 수가 보이네.","qb":"흥, 네가 내 속도에 맞춰 주는 것뿐이야. 가자.","end":null,"lv":3},{"a":"joker","b":"kasumi","rel":"의기투합","qa":"카스미, 호흡 완벽해졌는데.","qb":"선배 옆에서 계속 뛰어온 덕분이에요! 끝까지 함께할게요!","end":null,"lv":3},{"a":"ryuji","b":"mona","rel":"뜻밖의 신뢰","qa":"야 모나, 이제 네 잔소리 안 들으면 좀 허전하다고.","qb":"흐흥, 이 몸의 소중함을 이제야 알았냐 스컬!","end":null,"lv":3},{"a":"ryuji","b":"ann","rel":"의기투합","qa":"야, 우리 이제 눈 감고도 호흡 맞출 수 있지 않냐?","qb":"당연하지! 영원한 콤비잖아!","end":null,"lv":3},{"a":"makoto","b":"haru","rel":"의기투합","qa":"하루가 뒤에 있으면 어떤 상황에서도 안심이 돼.","qb":"나도 마코토 쨩이 곁에 있어서 늘 든든해.","end":null,"lv":3},{"a":"futaba","b":"yusuke","rel":"뜻밖의 신뢰","qa":"이나리, 오늘 구도 나쁘지 않은데? 내비 인증 도장 쾅!","qb":"후타바에게 인정받다니… 오늘 그림은 걸작이 되겠군.","end":null,"lv":3},{"a":"akechi","b":"haru","rel":"뜻밖의 신뢰","qa":"…네가 맡은 쪽은 굳이 돌아볼 필요가 없네. 깔끔해.","qb":"어머, 아케치 군한테 그런 말을 다 듣네. 기분 좋다.","end":null,"lv":3},{"a":"akechi","b":"futaba","rel":"뜻밖의 신뢰","qa":"네 데이터만큼은 이제 의심 없이 믿고 움직여도 되겠어.","qb":"흥, 진작 그랬어야지! 믿고 맡겨!","end":null,"lv":3},{"a":"joker","b":"makoto","rel":"의기투합","qa":"작전은 완벽해. 이제 마무리만 남았네.","qb":"응, 네가 옆에 있으니 걱정 없어. 가자!","end":null,"lv":3},{"a":"joker","b":"mona","rel":"의기투합","qa":"오늘도 잘 부탁해, 파트너.","qb":"당연하지, 조커! 이 몸과 네 조합은 무적이라고!","end":null,"lv":3},{"a":"ann","b":"haru","rel":"의기투합","qa":"하루, 저쪽 섀도들 같이 한 번에 날려 버릴까?","qb":"좋아! 안 쨩이 불 붙이면 내가 마무리할게.","end":null},{"a":"yusuke","b":"makoto","rel":"의기투합","qa":"퀸, 자네의 일격은 군더더기 없는 조형미가 있군.","qb":"고마워 유스케. 네 검술도 빈틈이 없어서 든든해.","end":null},{"a":"futaba","b":"kasumi","rel":"의기투합","qa":"바이올렛! 전방 3미터 점프 각 나왔어!","qb":"네, 후타바 선배! 지금 바로 뛰어넘을게요!","end":null},{"a":"ryuji","b":"kasumi","rel":"의기투합","qa":"카스미, 저 끝까지 누가 먼저 도착하나 내기할래?!","qb":"좋아요 류지 선배! 저도 안 질 거예요!","end":null},{"a":"joker","b":"haru","rel":"의기투합","qa":"하루, 오늘 유난히 기세가 좋네.","qb":"네가 옆에서 지휘해 주니까 마음이 놓여서 그래.","end":null},{"a":"joker","b":"futaba","rel":"의기투합","qa":"내비, 다음 루트 부탁해.","qb":"오케이 조커! 최단 보물 코스 바로 띄워 줄게!","end":null},{"a":"mona","b":"haru","rel":"의기투합","qa":"하루, 오늘 우리 콤비 플레이 최고라고!","qb":"후훗, 모나 쨩이랑 같이 다니면 늘 즐거워.","end":null},{"a":"makoto","b":"kasumi","rel":"의기투합","qa":"카스미, 호흡 흐트러지지 않고 완벽해.","qb":"마코토 선배가 리드해 주신 덕분이에요!","end":null},{"a":"ryuji","b":"yusuke","rel":"티격태격","qa":"야 유스케, 굶고 다니지 말고 편의점 빵이라도 사 먹으라고!","qb":"빵 살 돈으로 새 붓을 샀다. 후회는 없다.","end":{"who":"ann","q":"아 진짜 못 말려…"}},{"a":"ann","b":"akechi","rel":"티격태격","qa":"아케치, 가끔은 계산 좀 내려놓고 편하게 걸어도 되잖아?","qb":"방심하다 발목 잡히는 쪽보단 낫지 않아?","end":null},{"a":"mona","b":"futaba","rel":"티격태격","qa":"내비! 이 몸 수염 자꾸 톡톡 건드리지 마!","qb":"반응 속도 테스트 중이거든? 0.2초 합격!","end":null},{"a":"makoto","b":"yusuke","rel":"티격태격","qa":"유스케, 지금 이 어두운 통로에서 화구를 꺼내면 어떡해!","qb":"어둠 속의 한 줄기 붉은 선… 지금 아니면 못 그린단 말이다!","end":null},{"a":"ryuji","b":"futaba","rel":"티격태격","qa":"야 후타바, 아까 나한테 '탱커 몸빵'이라고 했지?!","qb":"어? 제일 튼튼하니까 칭찬한 건데 왜 그래~","end":null},{"a":"yusuke","b":"akechi","rel":"티격태격","qa":"아케치, 자네의 걸음걸이는 너무 인위적이군. 자연스러움이 부족해.","qb":"칭찬이 아닌 건 알겠네. 감상은 나중에 혼자 해.","end":null},{"a":"ann","b":"mona","rel":"티격태격","qa":"모나, 자꾸 보물만 보면 앞뒤 안 가리고 달려가잖아!","qb":"안 아가씨한테는 예쁜 보물만 보여 주고 싶단 말이야!","end":null},{"a":"haru","b":"yusuke","rel":"티격태격","qa":"유스케 군, 아까 내 화분 흙을 스케치 재료로 쓰려던 거 다 봤어.","qb":"오해다, 하루! 그저 자연의 색감을 채집하려 했을 뿐…","end":null},{"a":"ann","b":"ryuji","rel":"냉전","qa":"…류지, 아까 내 말 무시하고 뛰어나간 거 아직 화났거든?","qb":"아, 알았다고… 미안하니까 그만 째려봐.","end":null},{"a":"makoto","b":"ryuji","rel":"냉전","qa":"류지, 다음엔 내 신호 떨어지기 전에 절대 움직이지 마.","qb":"…알았어, 알았다고. 조용히 따라갈게.","end":null},{"a":"yusuke","b":"akechi","rel":"냉전","qa":"…자네의 차가운 시선에는 예술적 온기가 전혀 없군.","qb":"흥, 나도 네 4차원적인 궤변에 어울려 줄 기분은 아니야.","end":null},{"a":"futaba","b":"ryuji","rel":"냉전","qa":"류지한테는 당분간 미니맵 공유 안 해 줄 거야.","qb":"어이, 야! 길 잃으면 어쩌려고 그래!","end":null},{"a":"mona","b":"makoto","rel":"냉전","qa":"퀸, 아까 급커브 꺾을 때 이 몸 멀미할 뻔했다고!","qb":"미안하다고 했잖아… 나도 급해서 그랬어.","end":null},{"a":"haru","b":"ryuji","rel":"냉전","qa":"류지 군, 아까 그 행동은 조금 위험했어.","qb":"으… 하루가 정색하니까 진짜 무섭네. 미안해!","end":null},{"a":"joker","b":"mona","rel":"냉전","qa":"모나, 이번엔 네가 좀 성급했어.","qb":"흥… 조커까지 이 몸 편을 안 들어 주다니.","end":null},{"a":"kasumi","b":"akechi","rel":"냉전","qa":"아케치 선배… 방금 말씀은 조금 너무하신 것 같아요.","qb":"현실을 말했을 뿐이야. 듣기 싫으면 귀를 막든가.","end":null},{"a":"ann","b":"akechi","rel":"뜻밖의 신뢰","qa":"아케치, 아까 내 뒤 지켜 준 거… 사실 좀 감동했어.","qb":"별일 아니야. 다음엔 시야를 좀 더 넓게 써.","end":null},{"a":"yusuke","b":"akechi","rel":"뜻밖의 신뢰","qa":"아케치, 방금 그 냉철한 일격… 솔직히 경이로웠다.","qb":"네가 내 싸움 방식을 칭찬할 줄은 몰랐네.","end":null},{"a":"ryuji","b":"makoto","rel":"뜻밖의 신뢰","qa":"야 마코토, 아까 네 말 듣길 진짜 잘했다! 완전 살았네!","qb":"후훗, 이제 내 작전을 좀 믿어 주는 거야?","end":null},{"a":"futaba","b":"ryuji","rel":"뜻밖의 신뢰","qa":"류지, 아까 몸으로 막아 줘서 고마워! 오늘 MVP 줄게!","qb":"하하! 당연하지! 내비는 내가 지켜야지!","end":null},{"a":"mona","b":"akechi","rel":"뜻밖의 신뢰","qa":"크로우… 아까 그 함정 해제, 제법 쓸 만하더군.","qb":"고양이한테 인정받으니 묘한 기분이네. 고맙다고 해 두지.","end":null},{"a":"yusuke","b":"ryuji","rel":"뜻밖의 신뢰","qa":"류지, 아까 나를 끌어올려 준 그 힘… 진정한 우정이더군.","qb":"에이, 뭘 그런 걸로 감동하고 그래! 친구잖아!","end":null},{"a":"haru","b":"futaba","rel":"뜻밖의 신뢰","qa":"후타바 쨩, 네 안내 덕분에 하나도 안 다쳤어. 고마워.","qb":"에헤헤, 하루가 그렇게 말해 주니까 의욕 200% 충전됐어!","end":null},{"a":"makoto","b":"ann","rel":"뜻밖의 신뢰","qa":"안, 아까 분위기 처졌을 때 네가 웃겨 줘서 정말 고마웠어.","qb":"에이~ 우리 사이에 뭘! 서로 챙기는 거지!","end":null},{"a":"joker","b":"ryuji","rel":"의기투합","qa":"류지, 오른쪽은 네가 뚫어 줘.","qb":"오케이! 내 방망이 맛 좀 제대로 보여 주지!","end":null},{"a":"joker","b":"ann","rel":"의기투합","qa":"안, 불꽃으로 시선 끌어 줄래?","qb":"맡겨만 둬! 화려하게 태워 버릴게!","end":null},{"a":"ann","b":"yusuke","rel":"의기투합","qa":"유스케, 내 마법 다음에 바로 이어서 쳐 줘!","qb":"알았다. 불꽃 뒤에 피어나는 얼음이라… 완벽한 대비군!","end":null},{"a":"ann","b":"futaba","rel":"의기투합","qa":"후타바! 다음 약점 속성 뭐야?","qb":"화염 약점 확정! 팬서, 풀파워로 날려 버려!","end":null},{"a":"yusuke","b":"haru","rel":"의기투합","qa":"하루, 자네의 포격 타이밍에 맞춰 파고들지.","qb":"후훗, 좋아 유스케 군! 신호 줄 테니까 멋지게 마무리해 줘.","end":null},{"a":"haru","b":"kasumi","rel":"의기투합","qa":"카스미 쨩, 같이 리듬 맞춰서 들어가 볼까?","qb":"네, 하루 선배! 완벽하게 보조 맞출게요!","end":null},{"a":"joker","b":"ryuji","rel":"의기투합","qa":"등 뒤는 늘 네게 맡기고 있어, 류지.","qb":"하하, 당연하지! 우린 처음부터 최강 콤비잖아!","end":null,"lv":3},{"a":"joker","b":"ann","rel":"의기투합","qa":"안이랑 같이 싸우면 이상하게 마음이 놓여.","qb":"후훗, 나도! 조커가 옆에 있으면 뭐든 이길 것 같거든!","end":null,"lv":3},{"a":"ann","b":"makoto","rel":"의기투합","qa":"마코토, 이제 눈빛만 봐도 다음 작전 알겠어!","qb":"나도 그래, 안. 이제 우리 호흡은 누구도 못 따라올 거야.","end":null,"lv":3},{"a":"yusuke","b":"joker","rel":"의기투합","qa":"자네와 함께 서는 전장은 언제나 한 폭의 명화로군.","qb":"그럼 마지막 붓질은 같이 끝내자, 유스케.","end":null,"lv":3},{"a":"joker","b":"ryuji","rel":"티격태격","qa":"류지, 소리 좀 낮춰. 섀도 다 몰려오겠다.","qb":"아 진짜, 신나서 그랬단 말이야! 리더 너무 엄격한 거 아니냐?!","end":null},{"a":"ann","b":"yusuke","rel":"티격태격","qa":"유스케! 전투 중에 포즈 주문하지 말라고 몇 번을 말해!","qb":"하지만 방금 그 각도에서 흩날린 머리카락은 실로 절경이었네!","end":{"who":"ann","q":"진짜 못 말려!"}},{"a":"makoto","b":"futaba","rel":"티격태격","qa":"후타바, 약점 안내할 때 게임 용어 말고 제대로 말해 줄래?","qb":"에이~ 퀸도 슬슬 겜잘알 용어 외울 때 됐거든?!","end":null},{"a":"kasumi","b":"ryuji","rel":"티격태격","qa":"류지 선배! 방금 또 준비운동 없이 뛰어드셨죠?!","qb":"어, 어이 요시자와! 잔소리가 점점 마코토 닮아 가는데?!","end":null},{"a":"akechi","b":"makoto","rel":"티격태격","qa":"니지마, 네 작전은 지나치게 교과서적이야. 변수를 못 읽잖아.","qb":"아케치 군의 도박 같은 판단보다는 훨씬 안전하다고 생각하는데.","end":null},{"a":"haru","b":"mona","rel":"티격태격","qa":"모나 쨩, 자꾸 혼자 튀어 나가면 미아 될지도 몰라.","qb":"미, 미아라니! 이 몸은 메멘토스의 살아 있는 지도라고!","end":null},{"a":"ann","b":"makoto","rel":"티격태격","qa":"마코토, 그렇게 빡빡하게 굴면 피곤해진다니까?","qb":"안, 지금 긴장 풀었다가 함정 밟으면 어쩌려고 그래!","end":null},{"a":"futaba","b":"kasumi","rel":"티격태격","qa":"카스미! 너 너무 빨리 뛰어다녀서 레이더 핀이 쫓아가질 못해!","qb":"죄, 죄송해요 후타바 선배! 조금만 속도 줄일게요!","end":null},{"a":"joker","b":"yusuke","rel":"티격태격","qa":"유스케, 보물상자 앞에서 구도 잡는 건 끝나고 하자.","qb":"안 될 말이다! 열리기 직전의 긴장감이야말로 미의 정점이지!","end":null},{"a":"akechi","b":"ryuji","rel":"티격태격","qa":"사카모토, 발소리 좀 줄여. 섀도한테 초대장 보낼 셈이야?","qb":"아 시끄러! 원래 내 보폭이 크다고!","end":{"who":"mona","q":"또 시작이네…"}},{"a":"joker","b":"ryuji","rel":"냉전","qa":"류지, 아까는 분명 기다리라고 했잖아.","qb":"…알았다고. 다음엔 말없이 안 튀어 나갈게.","end":null},{"a":"joker","b":"ann","rel":"냉전","qa":"안, 지금은 농담할 분위기가 아니야.","qb":"…미안. 나도 모르게 선을 넘었나 봐.","end":null},{"a":"ann","b":"yusuke","rel":"냉전","qa":"유스케, 지금은 정말 예술 타령 듣고 싶지 않아.","qb":"…그렇게까지 말한다면 입을 다물지.","end":null},{"a":"makoto","b":"yusuke","rel":"냉전","qa":"유스케, 파티 전체 안전보다 그림이 먼저인 건 아니지?","qb":"…내 미학을 오해하고 있군, 마코토.","end":null},{"a":"haru","b":"makoto","rel":"냉전","qa":"마코토 쨩, 아까는 조금 너무 몰아붙인 것 같아.","qb":"…미안해 하루. 나도 여유가 없었나 봐.","end":null},{"a":"futaba","b":"makoto","rel":"냉전","qa":"흥, 퀸이 다 알아서 할 거면 내비는 왜 데려왔어?","qb":"…그런 뜻이 아니었잖아, 후타바.","end":null},{"a":"mona","b":"yusuke","rel":"냉전","qa":"폭스, 지금 이 몸 말 한 귀로 흘린 거지?!","qb":"…지금은 침묵이 가장 고결한 답이로군.","end":null},{"a":"ann","b":"futaba","rel":"냉전","qa":"후타바, 아까 그 말은 좀 상처였어…","qb":"…으, 미안. 나도 모르게 필터 없이 말해 버렸어.","end":null},{"a":"kasumi","b":"ryuji","rel":"냉전","qa":"류지 선배… 아까는 정말 위험하셨어요.","qb":"…미안하다, 요시자와. 내가 너무 앞만 보고 달렸네.","end":null},{"a":"mona","b":"futaba","rel":"냉전","qa":"흥! 내비라고 이 몸을 구닥다리 취급하다니!","qb":"팩트 체크했을 뿐이거든? 당분간 통신 음소거할 거야!","end":null},{"a":"joker","b":"yusuke","rel":"뜻밖의 신뢰","qa":"유스케, 아까 네가 막아 줘서 살았어.","qb":"동료를 지키는 데 이유 따윈 필요 없지. 신경 쓰지 마라.","end":null},{"a":"ann","b":"yusuke","rel":"뜻밖의 신뢰","qa":"유스케, 평소엔 엉뚱한데 중요한 순간엔 진짜 믿음직하네.","qb":"그 말, 최고의 찬사로 받아들이지.","end":null},{"a":"makoto","b":"kasumi","rel":"뜻밖의 신뢰","qa":"요시자와, 위급할 때 판단이 정말 빨랐어. 고마워.","qb":"마코토 선배께 도움이 됐다면 그것만으로 기뻐요!","end":null},{"a":"haru","b":"ryuji","rel":"뜻밖의 신뢰","qa":"류지 군, 아까 제일 먼저 달려와 줘서 정말 고마웠어.","qb":"에이, 뭘 그런 걸로! 하루가 다치면 큰일이잖아!","end":null},{"a":"mona","b":"makoto","rel":"뜻밖의 신뢰","qa":"퀸, 아까 지휘 덕분에 위기 넘겼어. 인정할게!","qb":"후훗, 모나한테 칭찬받으니까 묘하게 뿌듯하네.","end":null},{"a":"ann","b":"kasumi","rel":"뜻밖의 신뢰","qa":"카스미, 너 진짜 대단해! 방금 완전 프로 같았어!","qb":"안 선배가 옆에서 응원해 주신 덕분이에요!","end":null},{"a":"futaba","b":"mona","rel":"뜻밖의 신뢰","qa":"모나, 아까 급회전 대박이었어! 내비 레이더보다 빨랐는데?","qb":"흐흥! 역시 이 몸의 진가를 알아보는군!","end":null},{"a":"ryuji","b":"haru","rel":"뜻밖의 신뢰","qa":"야 하루, 아까 네가 뒤 받쳐 줘서 맘 놓고 쳤다고! 최고야!","qb":"후훗, 류지 군이랑 호흡이 딱 맞아서 다행이야.","end":null},{"a":"haru","b":"kasumi","rel":"뜻밖의 신뢰","qa":"카스미 쨩이 옆에 있으면 어쩐지 마음까지 환해지는 기분이야.","qb":"저도 하루 선배랑 함께할 때가 제일 든든하고 따뜻해요!","end":null,"lv":3},{"a":"akechi","b":"kasumi","rel":"뜻밖의 신뢰","qa":"요시자와, 이제 네가 뒤를 맡아 주면 안심하고 앞만 볼 수 있겠네.","qb":"아케치 선배…! 그 믿음, 절대 저버리지 않을게요!","end":null,"lv":3}],"shifts":[{"a":"ryuji","b":"akechi","trig":"대실패","rel":"냉전","n":"{A}의 헛발질에 {B}(이)가 말없이 고개를 돌렸다.","qa":"아, 아니 그게…","qb":"…"},{"a":"*","b":"*","trig":"감싸기","rel":"뜻밖의 신뢰","n":"{A}(이)가 쓰러지기 직전의 {B} 앞을 막아섰다. 둘 사이의 공기가 조금 달라졌다.","qa":"","qb":"…빚진 걸로 할게."},{"a":"*","b":"*","trig":"승리","rel":"의기투합","n":"{A}(와)과 {B}(이)가 하이파이브를 했다.","qa":"","qb":""},{"a":"*","b":"*","trig":"감싸기","rel":"뜻밖의 신뢰","n":"{A}(이)가 망설임 없이 {B} 앞을 가로막고 공격을 받아 냈다.","qa":"뒤로 물러서!","qb":"…고마워. 잊지 않을게."},{"a":"*","b":"*","trig":"대실패","rel":"냉전","n":"{A}의 대형 실수로 먼지를 뒤집어쓴 {B}(이)가 싸늘하게 입을 다물었다.","qa":"미, 미안… 일부러 그런 건 아니야!","qb":"…잠깐 말 걸지 마."},{"a":"*","b":"*","trig":"대실패","rel":"티격태격","n":"{A}의 헛발질을 본 {B}(이)가 참지 못하고 한소리 내뱉었다.","qa":"아, 웃지 말고 좀 도와줘!","qb":"그걸 어떻게 안 웃고 넘어가!"},{"a":"*","b":"*","trig":"충돌","rel":"냉전","n":"갈림길에서 끝내 합의하지 못한 {A}(와)과 {B} 사이에 차가운 침묵이 흘렀다.","qa":"내 말이 맞다니까.","qb":"…마음대로 해."},{"a":"*","b":"*","trig":"충돌","rel":"티격태격","n":"방향을 놓고 투닥거리던 {A}(와)과 {B}가 결국 눈을 흘기며 나란히 걸었다.","qa":"다음엔 내 말대로 가자고!","qb":"두고 보면 알겠지!"},{"a":"*","b":"*","trig":"승리","rel":"의기투합","n":"{A}(와)과 {B}(이)가 눈빛만으로 연계 공격을 성공시키고 마주 웃었다.","qa":"지금 호흡 완벽했지?","qb":"이대로 끝까지 가자!"},{"a":"*","b":"*","trig":"회복","rel":"의기투합","n":"{A}(이)가 지친 {B}의 어깨를 두드리며 재빨리 회복 스킬을 걸어 줬다.","qa":"무리하지 마. 이제 괜찮을 거야.","qb":"덕분에 살았어! 힘이 나네!"},{"a":"*","b":"*","trig":"회복","rel":"뜻밖의 신뢰","n":"{A}(이)가 말없이 건넨 회복약에 {B}의 굳었던 표정이 조금 누그러졌다.","qa":"이거 받아 둬.","qb":"…의외로 세심하네. 고마워."},{"a":"*","b":"*","trig":"쌍대사","rel":"의기투합","n":"짧은 잡담 끝에 {A}(와)과 {B}의 발걸음이 한결 가벼워졌다.","qa":"이야기하다 보니 기분 풀리네.","qb":"오늘 꽤 잘 풀릴 것 같은데?"},{"a":"*","b":"*","trig":"쌍대사","rel":"티격태격","n":"사소한 농담이 번져 {A}(와)과 {B}가 서로 잔소리를 주고받기 시작했다.","qa":"아니, 그 말은 좀 지나치잖아!","qb":"사실을 말했을 뿐이거든?"},{"a":"ryuji","b":"akechi","trig":"감싸기","rel":"뜻밖의 신뢰","n":"위험에 빠진 아케치를 류지가 몸을 날려 밀쳐 냈다. 아케치의 눈이 잠시 커졌다.","qa":"멍하니 있지 마, 임마!","qb":"…네가 날 감쌀 줄은 몰랐네. 빚진 걸로 하지."},{"a":"akechi","b":"haru","trig":"감싸기","rel":"뜻밖의 신뢰","n":"섀도의 기습을 아케치가 단칼에 쳐 내며 하루 앞을 막아섰다.","qa":"물러나 있어. 여긴 내가 막을게.","qb":"어머… 아케치 군, 고마워."},{"a":"akechi","b":"futaba","trig":"회복","rel":"뜻밖의 신뢰","n":"지쳐 주저앉은 후타바에게 아케치가 조용히 회복 아이템을 내밀었다.","qa":"내비가 멈추면 곤란하니까. 받아 둬.","qb":"뭐야, 의외로 츤데레네… 고마워."},{"a":"haru","b":"akechi","trig":"충돌","rel":"냉전","n":"아케치의 차가운 지시에 하루가 미소를 거두고 조용히 도끼를 고쳐 쥐었다.","qa":"그 방식은 동의하기 어렵네, 아케치 군.","qb":"…감정론은 사양할게."},{"a":"mona","b":"ryuji","trig":"대실패","rel":"냉전","n":"모르가나가 함정에 걸려 넘어지자 류지가 배를 잡고 웃어 버렸다.","qa":"이 몸의 실수를 비웃다니… 당분간 말 걸지 마!","qb":"아 미안! 근데 진짜 너무 웃겼다고!"},{"a":"joker","b":"akechi","trig":"승리","rel":"의기투합","n":"조커와 아케치가 등을 맞대고 마지막 섀도를 동시에 베어 넘겼다.","qa":"나쁘지 않은 호흡이지?","qb":"흥, 네가 조금 더 빨랐으면 완벽했을 텐데."},{"a":"kasumi","b":"joker","trig":"감싸기","rel":"의기투합","n":"카스미가 우아하게 뛰어올라 조커를 향한 공격을 대신 쳐 냈다.","qa":"선배! 여긴 저한테 맡겨 주세요!","qb":"고마워, 카스미. 완벽했어."},{"a":"futaba","b":"yusuke","trig":"대실패","rel":"티격태격","n":"유스케가 스케치하다 웅덩이에 빠지자 후타바가 그 장면을 놓치지 않고 놀려 댔다.","qa":"이나리, 오늘 흑역사 1호 당첨이야!","qb":"이 젖은 찰나마저 미학이라고 몇 번을 말했느냐!"},{"a":"makoto","b":"haru","trig":"승리","rel":"의기투합","n":"마코토의 철권과 하루의 도끼가 연달아 터지며 섀도가 순식간에 정리됐다.","qa":"역시 하루랑 맞추면 든든해.","qb":"후훗, 마코토 쨩도 정말 멋졌어!"},{"a":"ann","b":"kasumi","trig":"회복","rel":"의기투합","n":"안이 지친 카스미에게 회복 스킬과 함께 밝은 응원을 건넸다.","qa":"카스미, 무리하지 마! 잠깐 숨 돌리자!","qb":"안 선배 감사합니다! 덕분에 다시 힘이 나요!"},{"a":"joker","b":"ryuji","trig":"감싸기","rel":"의기투합","n":"류지 앞으로 날아온 섀도의 일격을 조커가 단검으로 정확히 튕겨 냈다.","qa":"조심해, 류지.","qb":"크으, 역시 우리 리더밖에 없다니까!"},{"a":"ann","b":"mona","trig":"회복","rel":"의기투합","n":"안이 지친 모르가나를 안아 올려 회복 스킬을 걸어 주자 모르가나의 귀가 쫑긋 섰다.","qa":"모나, 무리하지 마!","qb":"안 아가씨…! 이 몸, 백 배로 힘내겠어!"},{"a":"haru","b":"akechi","trig":"회복","rel":"뜻밖의 신뢰","n":"하루가 상처 입은 아케치에게 조용히 허브티와 회복 스킬을 건넸다.","qa":"아케치 군, 무리하면 안 돼.","qb":"…네가 날 챙겨 줄 줄이야. 고맙게 받을게."},{"a":"futaba","b":"akechi","trig":"승리","rel":"뜻밖의 신뢰","n":"후타바의 약점 스캔 직후 아케치가 0.1초 만에 마무리 일격을 꽂아 넣었다.","qa":"오, 방금 딜 타이밍 완벽했잖아!","qb":"네 스캔이 정확했으니까. 꽤 좋은 합작이었어."},{"a":"akechi","b":"futaba","trig":"대실패","rel":"티격태격","n":"아케치가 보조 함정에 걸려 휘청이자 후타바가 그 순간을 놓치지 않고 녹화했다.","qa":"…그 영상 당장 지워.","qb":"싫은데~? 명탐정 흑역사 영구 소장 각!"},{"a":"yusuke","b":"makoto","trig":"대실패","rel":"냉전","n":"유스케가 스케치에 빠져 경고 신호를 놓치는 바람에 마코토가 대신 먼지를 뒤집어썼다.","qa":"유스케… 지금은 정말 화가 나려고 해.","qb":"면목 없군, 마코토. 변명의 여지가 없다."},{"a":"kasumi","b":"ryuji","trig":"감싸기","rel":"의기투합","n":"카스미가 화려한 점프로 류지 앞의 함정 파편을 정확히 쳐 냈다.","qa":"류지 선배, 위험해요!","qb":"오오! 카스미 나이스 커버!! 완전 멋졌다고!"},{"a":"ryuji","b":"futaba","trig":"감싸기","rel":"뜻밖의 신뢰","n":"후타바 쪽으로 돌진하는 섀도를 류지가 파이프로 단번에 막아 냈다.","qa":"내비 건드리지 마! 여긴 내가 막는다고!","qb":"우와… 류지 방금 진짜 탱커 같았어! 고마워!"},{"a":"makoto","b":"akechi","trig":"충돌","rel":"냉전","n":"안전 확보를 외치는 마코토와 강행 돌파를 고집하는 아케치의 시선이 차갑게 부딪혔다.","qa":"동료가 다칠 위험을 계산에서 빼지 마.","qb":"결과를 못 내는 안전주의야말로 무의미하잖아."},{"a":"ann","b":"akechi","trig":"감싸기","rel":"뜻밖의 신뢰","n":"안의 채찍이 아케치를 노리던 섀도의 발목을 정확히 감아 넘어뜨렸다.","qa":"괜찮아, 아케치?!","qb":"…덕분에 살았네. 감각이 꽤 날카롭잖아, 팬서."},{"a":"yusuke","b":"ryuji","trig":"승리","rel":"의기투합","n":"류지의 번개와 유스케의 빙결이 엇갈리며 화려한 마무리 장면을 만들어 냈다.","qa":"어때, 방금 우리 둘 다 엄청 간지났지?!","qb":"인정하지. 빛과 얼음의 완벽한 조화였다."},{"a":"mona","b":"akechi","trig":"회복","rel":"뜻밖의 신뢰","n":"모르가나가 툴툴거리면서도 아케치의 상처를 말끔히 치료해 줬다.","qa":"흥, 쓰러지면 귀찮으니까 치료해 주는 거라고!","qb":"…고마워, 모나. 빚진 건 기억해 두지."},{"a":"haru","b":"kasumi","trig":"쌍대사","rel":"의기투합","n":"잠깐의 차와 도시락 이야기를 나누며 하루와 카스미의 분위기가 화사하게 피어올랐다.","qa":"다음엔 옥상에서 같이 차 마시자, 카스미 쨩.","qb":"네, 하루 선배! 정말 기대돼요!"},{"a":"joker","b":"yusuke","trig":"쌍대사","rel":"의기투합","n":"어둠 속 붉은 선로를 나란히 바라보며 조커와 유스케가 말없이 고개를 끄덕였다.","qa":"이 풍경, 기억해 둬야겠네.","qb":"그래. 자네와는 미적 감각이 통하는군."},{"a":"ryuji","b":"ann","trig":"대실패","rel":"티격태격","n":"류지가 밟은 함정 탓에 안의 머리에 거미줄이 잔뜩 엉켜 버렸다.","qa":"사카모토 류지!! 너 진짜 죽을래?!","qb":"아, 아니 일부러 그런 게 아니라고! 잠깐만 진정해!"},{"a":"makoto","b":"kasumi","trig":"승리","rel":"의기투합","n":"마코토의 지시에 맞춰 카스미가 완벽한 타이밍에 마무리 일격을 꽂아 넣었다.","qa":"완벽한 연계였어, 카스미!","qb":"마코토 선배랑 함께라 자신 있게 뛸 수 있었어요!"},{"a":"*","b":"*","trig":"감싸기","rel":"뜻밖의 신뢰","n":"{A}(이)가 날아드는 공격을 대신 막아 내자 {B}(이)가 놀란 눈으로 고개를 들었다.","qa":"다친 데 없어?","qb":"…고마워. 다시 보게 됐네."},{"a":"*","b":"*","trig":"감싸기","rel":"뜻밖의 신뢰","n":"위험한 순간 {A}(이)가 {B}의 팔을 잡아당겨 품 뒤로 숨겼다. 어색했던 거리가 한 뼘 좁혀졌다.","qa":"조심해. 여기서 쓰러지면 안 되잖아.","qb":"…신세 졌어. 다음엔 내가 갚을게."},{"a":"*","b":"*","trig":"감싸기","rel":"의기투합","n":"{A}(이)가 한 치의 망설임도 없이 {B} 앞을 막아서며 든든하게 등을 보였다.","qa":"여긴 나한테 맡기고 반격해!","qb":"알겠어! 믿고 뒤 맡길게!"},{"a":"*","b":"*","trig":"감싸기","rel":"의기투합","n":"기습을 대신 받아 낸 {A}의 곁에 {B}(이)가 곧장 나란히 서며 자세를 고쳐 잡았다.","qa":"괜찮아, 아직 버틸 수 있어!","qb":"고마워! 바로 갚아 주자고!"},{"a":"*","b":"*","trig":"감싸기","rel":"의기투합","n":"{A}(이)가 {B}에게 향하던 일격을 깔끔하게 쳐 내자 둘 사이에 강한 신뢰가 번졌다.","qa":"빈틈은 내가 메울게!","qb":"든든하네! 같이 밀어붙이자!"},{"a":"*","b":"*","trig":"회복","rel":"의기투합","n":"{A}(이)가 타이밍 딱 맞춰 회복을 걸어 주자 {B}(이)가 환하게 웃으며 주먹을 쥐었다.","qa":"아직 한창이지? 힘내!","qb":"타이밍 완벽해! 바로 다시 갈게!"},{"a":"*","b":"*","trig":"회복","rel":"의기투합","n":"{A}(이)가 건넨 회복의 빛에 기운을 되찾은 {B}(이)가 고맙다는 듯 가볍게 고개를 끄덕였다.","qa":"무리하지 말고 페이스 맞춰.","qb":"고마워! 이제 완전 멀쩡해!"},{"a":"*","b":"*","trig":"회복","rel":"뜻밖의 신뢰","n":"말다툼 직후였는데도 {A}(이)가 먼저 {B}의 상처를 돌봐 주자 차갑던 공기가 누그러졌다.","qa":"싸우는 건 나중이고, 치료부터 해.","qb":"…미안. 그리고 고마워."},{"a":"*","b":"*","trig":"회복","rel":"뜻밖의 신뢰","n":"{A}(이)가 아무 말 없이 상처를 치료해 주자 {B}(이)가 조금 쑥스러운 표정으로 시선을 피했다.","qa":"참지 말고 아프면 말해.","qb":"…신경 써 줘서 고마워."},{"a":"*","b":"*","trig":"회복","rel":"티격태격","n":"{A}(이)가 잔소리를 덧붙이며 회복을 걸어 주자 {B}(이)가 투덜거리면서도 고맙게 받아들였다.","qa":"앞 좀 보고 다니라고! 자, 치료야.","qb":"아 알았어! 그래도 고맙긴 하네!"},{"a":"*","b":"*","trig":"회복","rel":"티격태격","n":"치료해 주던 {A}(이)가 한숨을 쉬자 {B}(이)가 민망한 듯 입을 삐죽이며 맞받아쳤다.","qa":"한눈팔면 또 다친다니까.","qb":"알았다고! 다음엔 안 맞을 거거든?"},{"a":"*","b":"*","trig":"대실패","rel":"티격태격","n":"{A}(이)가 요란하게 넘어지며 판을 망치자 {B}(이)가 어이없다는 듯 혀를 찼다.","qa":"아, 방금 건 진짜 바닥이 미끄러웠어!","qb":"변명은 나중에 하고 얼른 일어나!"},{"a":"*","b":"*","trig":"대실패","rel":"티격태격","n":"엉뚱한 실수를 저지른 {A} 옆에서 {B}(이)가 한숨 반, 웃음 반으로 잔소리를 쏟아 냈다.","qa":"다음엔 진짜 제대로 할게!","qb":"그 말 벌써 몇 번째인지 알아?"},{"a":"*","b":"*","trig":"대실패","rel":"냉전","n":"{A}의 치명적인 실수에 휘말린 {B}(이)가 굳은 얼굴로 먼지만 털어 내고 앞장섰다.","qa":"미안해… 내가 너무 서둘렀어.","qb":"…됐어. 지금은 말 섞고 싶지 않아."},{"a":"*","b":"*","trig":"대실패","rel":"냉전","n":"{A}(이)가 함정을 건드린 탓에 위기에 빠지자 {B}의 시선이 차갑게 식어 버렸다.","qa":"일부러 그런 건 아니잖아…","qb":"…다음엔 생각 좀 하고 움직여."},{"a":"*","b":"*","trig":"충돌","rel":"냉전","n":"끝내 한 발짝도 물러서지 않은 {A}(와)과 {B}(이)가 서로 등을 돌린 채 거리를 두었다.","qa":"내 방식이 더 확실해.","qb":"…알아서 해. 난 상관 안 할 테니까."},{"a":"*","b":"*","trig":"충돌","rel":"냉전","n":"날 선 말이 오간 뒤 {A}(와)과 {B} 사이에 무거운 정적이 내려앉았다.","qa":"그렇게 나올 줄 알았어.","qb":"…더 이상 할 말 없네."},{"a":"*","b":"*","trig":"충돌","rel":"티격태격","n":"작전을 두고 티격태격하던 {A}(와)과 {B}(이)가 씩씩거리며 누가 맞나 보자고 내기를 걸었다.","qa":"내 말이 맞으면 끝나고 한턱내!","qb":"좋아, 자신 있으면 어디 해 보자고!"},{"a":"*","b":"*","trig":"충돌","rel":"티격태격","n":"{A}(와)과 {B}(이)가 서로 한마디도 지지 않으려 옥신각신하며 통로를 걸어갔다.","qa":"아니, 내 얘기를 끝까지 들어 봐!","qb":"들어 봐도 네 쪽이 무리수잖아!"},{"a":"*","b":"*","trig":"승리","rel":"의기투합","n":"{A}(와)과 {B}(이)가 동시에 마무리를 꽂아 넣고 뿌듯하게 주먹을 맞댔다.","qa":"지금 타이밍 진짜 좋았지?","qb":"완벽했어! 이 기세 그대로 가자!"},{"a":"*","b":"*","trig":"승리","rel":"의기투합","n":"깔끔하게 섀도를 정리한 {A}(와)과 {B}(이)가 서로의 등을 두드리며 웃음을 터뜨렸다.","qa":"우리 둘 호흡이 제법인데?","qb":"다음 섀도도 금방 끝내 버리자!"},{"a":"*","b":"*","trig":"승리","rel":"티격태격","n":"냉랭하던 {A}(와)과 {B}(이)가 전투를 끝낸 뒤 슬쩍 시선을 맞추며 퉁명스럽게 말을 섞었다.","qa":"흥, 방금 마무리는 내가 더 빨랐거든?","qb":"뭐래, 내가 빈틈 만들어 준 거잖아!"},{"a":"*","b":"*","trig":"승리","rel":"티격태격","n":"호흡이 맞아떨어져 이긴 뒤에도 {A}(와)과 {B}(은)는 멋쩍은 듯 투닥거리기 시작했다.","qa":"방금 건 운 좋게 맞았을 뿐이야.","qb":"운은 무슨, 내 타이밍에 맞춘 거면서!"},{"a":"*","b":"*","trig":"쌍대사","rel":"의기투합","n":"소소한 농담을 주고받던 {A}(와)과 {B}의 웃음소리가 어두운 통로를 환하게 밝혔다.","qa":"덕분에 긴장이 싹 풀렸어!","qb":"나도! 이대로 재밌게 가 보자!"},{"a":"*","b":"*","trig":"쌍대사","rel":"의기투합","n":"걷다가 나눈 짧은 대화가 의외로 잘 통해 {A}(와)과 {B}(이)가 나란히 발걸음을 맞췄다.","qa":"생각보다 말이 잘 통하네?","qb":"그러게! 다음에도 같이 가자!"},{"a":"*","b":"*","trig":"쌍대사","rel":"티격태격","n":"가볍게 던진 한마디가 불씨가 되어 {A}(와)과 {B}(이)가 옥신각신 말싸움을 벌였다.","qa":"방금 그건 좀 얄미웠거든?!","qb":"농담도 못 받아치냐고!"},{"a":"*","b":"*","trig":"쌍대사","rel":"티격태격","n":"장난스럽게 시작된 대화가 어느새 {A}(와)과 {B}의 자존심 대결로 번져 버렸다.","qa":"절대 안 질 거니까 두고 봐!","qb":"얼마든지 덤벼 보시지!"}]},"idle":[{"who":"yusuke","n":"유스케가 갑자기 멈춰 서서 벽의 균열을 스케치하기 시작했다.","q":"이 균열… 놓칠 수 없군.","c":[]},{"who":"futaba","n":"","q":"(휴대폰을 꺼내며) 로그인 보상만 받고 올게.","c":[]},{"who":"joker","n":"조커가 장갑을 살짝 당겨 고쳐 끼며 어둠 너머를 바라봤다.","q":"르블랑 돌아가면 원두부터 갈아야겠네.","c":[]},{"who":"joker","n":"조커가 바닥에 굴러다니는 빈 승차권을 주워 뒤집어 봤다.","q":"유효기간이… 199X년?","c":[{"k":"zone","v":["plat"]}]},{"who":"joker","n":"","q":"(안경이 없는데도 습관처럼 콧등을 짚으며) …버릇이란 무섭네.","c":[]},{"who":"mona","n":"모르가나가 갑자기 멈춰 서서 앞발로 수염을 슥슥 정리했다.","q":"이 몸은 깔끔한 신사니까 말이야.","c":[]},{"who":"mona","n":"모르가나가 코를 킁킁거리다 벽 틈의 먼지에 재채기를 했다.","q":"에취! …보물 냄새인 줄 알았잖아!","c":[{"k":"zone","v":["lost"]}]},{"who":"mona","n":"","q":"(꼬리를 살랑거리며) 오늘 저녁엔 참치캔 나오려나…","c":[{"k":"mood","op":">=","v":65}]},{"who":"ryuji","n":"류지가 걷다가 제자리에서 가볍게 스트레칭을 하며 어깨를 돌렸다.","q":"아, 끝나면 진짜 차슈 추가해서 라멘 먹어야지.","c":[]},{"who":"ryuji","n":"류지가 신발 끈이 풀린 걸 뒤늦게 보고 쪼그려 앉아 묶었다.","q":"어이, 잠깐만! 나 두고 가지 말라고!","c":[]},{"who":"ryuji","n":"","q":"(하품을 크게 하며) 여기 지하철은 왜 맨날 똑같이 생겼냐…","c":[{"k":"mood","op":"<","v":50}]},{"who":"ann","n":"안이 선로 위 어두운 창문에 비친 자기 머리카락을 살짝 정돈했다.","q":"여긴 습해서 앞머리가 자꾸 풀린단 말이야.","c":[]},{"who":"ann","n":"","q":"(작은 소리로 흥얼거리며) 크레이프… 생크림 듬뿍 올려서…","c":[]},{"who":"ann","n":"안이 구석에 붙은 이상한 포스터를 한참 들여다봤다.","q":"저거 패션 센스 완전 꽝인데?","c":[{"k":"zone","v":["pass"]}]},{"who":"yusuke","n":"유스케가 손가락으로 허공에 사각형을 그리며 동료들을 겨눴다.","q":"음, 3도만 왼쪽으로 기울어 주면 완벽하겠군.","c":[]},{"who":"yusuke","n":"유스케가 지갑을 슬쩍 열어 보더니 깊은 한숨을 내쉬었다.","q":"…오늘 저녁도 물로 배를 채워야 하는가.","c":[]},{"who":"yusuke","n":"","q":"(벽의 녹슨 자국을 만지며) 세월의 풍화란 참으로 덧없고 아름답군.","c":[{"k":"zone","v":["plat"]}]},{"w :"단골의 텀블러","en":"LEBLANC TUMBLER","desc":"잠깐 딴짓하며 커피 한 모금 마실 때마다 SP가 슬며시 차오른다."},{"id":"R-12","name":"반전의 주사위","en":"TURNABOUT DICE","desc":"어색하던 사이가 극적으로 풀리는 순간 대박 보상이 터지는 주사위."},{"id":"R-13","name":"막차 승차권","en":"LAST TRAIN TICKET","desc":"후반전 막판 스퍼트에서 수익을 폭증시켜 주는 낡은 막차 티켓."}],"evIntro":{"shadow:swift":["날카로운 바람을 가르며 검은 그림자가 순식간에 코앞까지 파고들었다!","어둠 속에서 붉은 잔상만 남긴 채 날쌘 섀도가 선로를 가로질러 덮쳐 온다!"],"shadow:armor":["철컹거리는 금속음과 함께 육중한 갑옷 섀도가 통로 한가운데 버티고 섰다!","바닥이 울릴 만큼 묵직한 발걸음으로 거대한 철갑 섀도가 길을 틀어막았다!"],"shadow:swarm":["기괴한 웃음소리가 사방에서 울리더니 작은 섀도 떼가 우르르 쏟아져 나왔다!","벽면과 천장 틈새에서 시커먼 그림자들이 물밀듯 기어 내려와 파티를 둘러쌌다!"],"shadow:greed":["동전 소리를 짤랑거리며 불룩한 보따리를 진 섀도가 능글맞게 이쪽을 돌아봤다!","금빛 장신구를 잔뜩 매단 섀도가 낄낄거리며 선로 위로 굴러 들어왔다!"],"chest":["{화자}(이)가 어둠 속에 반쯤 가려진 보물상자를 발견하고 발걸음을 멈췄다.","먼지 덮인 선반 밑에서 금빛 장식이 번쩍이자 {화자}(이)가 조심스레 다가갔다."],"vend":["깜빡이는 형광등 아래 낡은 자판기 한 대가 낮게 윙윙거리며 돌아가고 있다.","버튼 불빛이 반쯤 나간 자판기에서 아직 차가운 냉기가 새어 나온다."],"trap":["바닥 이음새 사이로 미세한 금속 와이어가 어스름하게 빛나고 있다.","유독 발자국 하나 찍히지 않은 바닥 구역이 묘하게 삐걱거리며 내려앉아 있다."],"bag":["지퍼가 반쯤 열린 낡은 가죽 가방이 벤치 아래에 덩그러니 굴러 있다.","주인 이름표가 찢겨 나간 묵직한 여행 가방이 통로 구석에 놓여 있다."],"drink":["아까 뽑아 둔 정체불명의 캔이 가방 안에서 기묘하게 차가운 온기를 낸다.","라벨 하나 없는 알루미늄 캔이 걸음을 옮길 때마다 찰랑거리며 존재감을 드러낸다."],"rest":["어두운 승강장 한쪽에 먼지 하나 없이 말끔한 나무 벤치가 놓여 있다.","지나가는 섀도도 없는 한적한 구석에 잠시 숨을 돌릴 만한 벤치가 보인다."],"quarrel":["갈림길 앞에서 {화자}(이)가 먼저 고개를 저으며 다른 쪽을 고집하고 나섰다.","앞으로 나아갈 방식을 두고 {화자}(이)가 목소리를 높이자 공기가 금세 날카로워졌다."],"ghost":["짙은 붉은 안개 너머로 지도에 없는 승강장의 희미한 불빛이 아른거린다.","지워진 역명판이 매달린 낯선 선로 끝에서 낡은 발차 벨이 울려 퍼진다."],"break":["잠시 섀도의 기척이 잦아든 통로 구석에 어깨를 기댈 만한 벽이 보인다.","붉은 조명이 은은하게 비치는 승강장 귀퉁이에서 모처럼 조용한 틈이 생겼다."],"c-vend":["류지가 아까 먹힌 동전이 아직도 억울한지 자판기 옆을 떠나지 못하고 서성인다.","자판기 앞에서 팔짱을 낀 류지가 이번엔 꼭 본전을 뽑겠다는 표정으로 노려본다."],"c-lead":["좁은 통로 입구에서 모르가나와 류지가 서로 먼저 가겠다고 어깨를 밀치기 시작했다.","앞장설 자리를 두고 모르가나와 류지 사이에 불꽃 튀는 신경전이 벌어졌다."],"c-tea":["잠시 발걸음을 멈춘 틈에 하루가 향긋한 김이 모락모락 나는 보온병 두 개를 내밀었다.","하루가 찻잔을 가지런히 꺼내 들자 통로 안에 고소한 커피와 홍차 향이 동시에 퍼졌다."],"c-model":["유스케가 진지한 눈빛으로 스케치북을 펼치자 후타바가 기겁하며 뒷걸음질쳤다.","빛의 각도가 절묘하다며 유스케가 후타바에게 꼼짝 말라고 외치고 있다."],"c-chase":["선두를 걷는 조커의 보폭에 맞추려는 듯 카스미가 눈을 반짝이며 속도를 높였다.","조커의 발걸음을 좇던 카스미가 가볍게 몸을 풀며 지지 않겠다는 듯 미소 지었다."],"E-001":["어두운 보관실 한가운데서 보물상자 하나가 마치 유인하듯 지나치게 밝게 빛난다.","주변은 온통 먼지투성이인데 유독 그 보물상자만 금방 닦아 놓은 듯 반짝이고 있다."],"E-002":["두꺼운 쇠 셔터가 통로를 가로막고 있고, 아래쪽 틈으로 붉은 안개가 흘러나온다.","오래 녹슨 철문이 굳게 닫혀 있지만, 너머에서 어딘가 값진 기운이 감돈다."],"E-003":["어둠 속 전광판이 치직거리는 잡음과 함께 낯선 기호와 좌표를 번갈아 띄우고 있다.","꺼져 있던 행선지 안내판이 갑자기 켜지더니 기묘한 숫자를 깜빡이며 멈춰 섰다."],"E-004":["천장 어둠 속에서 기척 없이 뛰어내린 섀도 무리가 단숨에 퇴로를 막아섰다.","사방에서 붉은 안광이 번쩍이더니 거대한 섀도 무리가 포위망을 좁혀 온다."],"E-005":["어두운 선로 옆 벤치에 김이 살짝 오르는 찻잔 세트가 누군가를 기다리듯 놓여 있다.","이질적일 만큼 깔끔한 테이블 위에 흰 찻잔과 다과 접시가 정갈하게 차려져 있다."],"E-006":["짤랑거리는 맑은 소리와 함께 황금빛 동전 하나가 어두운 선로 틈으로 굴러갔다.","발끝을 스친 금화 하나가 반짝이는 궤적을 그리며 승강장 아래로 떨어져 내렸다."],"E-007":["파티가 걸음을 멈추자 뒤편 안개 속에서도 똑같이 발소리가 뚝 끊겼다.","일정한 간격으로 울리는 낯선 발소리가 어둠 너머에서 조금씩 가까워지고 있다."],"E-008":["묵직한 쇠사슬로 칭칭 감긴 붉은 궤짝이 심장처럼 낮게 울리며 흔들리고 있다.","자물쇠가 겹겹이 채워진 거대한 궤짝에서 심상치 않은 보물의 기운이 새어 나온다."],"E-009":["행선지 표시가 꺼진 낡은 열차 한 대가 반쯤 열린 문 너머로 희미한 빛을 흘리고 있다.","정적에 잠긴 플랫폼에 소리 없이 멈춰 선 전동차가 마치 탑승을 기다리는 듯하다."],"E-010":["선로 끝을 막아선 거대한 전신 거울 속에 파티원들의 표정이 묘하게 뒤틀려 비친다.","먼지 한 점 없는 커다란 거울이 어둠 속에서도 기이할 만큼 선명하게 이쪽을 비춘다."],"E-011":["불꽃이 튈 듯 요란하게 덜컹거리는 개찰구 틈으로 반짝이는 동전이 쏟아져 내린다.","고장 난 개찰구가 경고음을 울리며 쉴 새 없이 열렸다 닫히기를 반복하고 있다."],"E-012":["수화기 줄이 뚝 끊어진 붉은 공중전화기에서 기이할 만큼 선명한 벨 소리가 울려 퍼진다.","아무도 없는 통로 한구석, 낡은 공중전화기가 누군가 받기를 기다리듯 요란하게 울린다."],"E-013":["반짝이는 금빛 보마가 상자 위에 웅크린 채 이쪽 기척도 모르고 곤히 잠들어 있다.","선로 옆 어둠 속에서 은은한 금빛을 내뿜는 보마가 고른 숨을 내쉬며 졸고 있다."],"E-014":["굳게 잠긴 고급 여행 가방 하나가 보관실 정중앙에 유독 눈에 띄게 놓여 있다.","번호 자물쇠가 반짝이는 묵직한 가방이 마치 열어 보라는 듯 통로 한가운데 서 있다."],"E-015":["플랫폼 천장에 매달린 대형 시계가 기묘한 소리를 내며 거꾸로 시간을 되감고 있다.","붉은 조명 아래 시계 바늘이 반시계 방향으로 째깍거리며 돌아가는 광경이 시선을 끈다."],"E-016":["어두운 지하철 벽면 가득 괴도단 마크를 빼닮은 강렬한 붉은 벽화가 그려져 있다.","통로 한쪽 벽을 뒤덮은 거대한 붉은 그림이 마치 예고장처럼 또렷하게 눈에 들어온다."],"E-017":["어둠 속에서 섀도 둘이 반짝이는 상자를 서로 차지하려고 씩씩거리며 맞서고 있다.","보물 상자를 가운데 두고 신경전을 벌이는 섀도 둘이 아직 이쪽 기척을 눈치채지 못했다."],"E-018":["차갑게 식은 자판기 사이로 유독 따뜻한 노란 불빛이 켜진 칸에서 커피 향이 풍겨 온다.","불 꺼진 승강장 구석, 자판기 한 칸에 켜진 은은한 불빛과 함께 구수한 향기가 퍼진다."],"E-019":["무너져 내린 선로 너머 아슬아슬한 거리 건너편에 반짝이는 보물 더미가 쌓여 있다.","뚝 끊긴 철길 건너편에 값비싸 보이는 상자들이 어둠 속에서 유혹하듯 빛난다."],"E-020":["반쯤 열린 역무실 문 너머로 마이크 전원이 켜진 방송 콘솔이 붉게 빛나고 있다.","아무도 없는 방송실 안에서 붉은 송출 버튼이 깜빡이며 조용히 잡음을 흘려보낸다."],"E-021":["위압적인 기운을 뿜는 정예 섀도가 앞을 가로막자 세 사람의 호흡이 순식간에 맞춰졌다.","거대한 섀도가 포효하며 다가오는 순간, 세 사람이 말없이 서로의 빈틈을 메울 대형을 잡았다."],"E-022":["잠시 발걸음이 멎은 승강장에 칼날처럼 차가운 정적이 내려앉았고, 아케치의 시선이 가라앉았다.","아무도 먼저 입을 열지 않는 무거운 공기 속에서 승강장의 형광등만 신경질적으로 깜빡였다."],"E-023":["양쪽에서 섀도가 동시에 달려들자 류지와 안이 눈짓 한 번으로 자연스럽게 등을 맞댔다.","좁은 통로가 순식간에 막히자 오랜 시간 호흡을 맞춰 온 류지와 안이 나란히 자세를 낮췄다."],"E-024":["세 갈래로 나뉜 선로 앞에서 마코토·하루·아케치가 각기 다른 근거를 들며 길을 짚었다.","갈림길에 멈춰 선 3학년 세 사람이 서로 물러서지 않는 눈빛으로 각자의 루트를 주장했다."],"E-025":["자판기 앞에서 동전 몇 개를 손바닥에 올려놓은 유스케와 류지가 사뭇 비장하게 머리를 맞댔다.","굶주린 눈빛의 유스케와 류지가 자판기 음료 가격을 두고 생존이 걸린 듯 진지한 토론에 빠졌다."],"E-026":["세 사람의 분석과 스캔 데이터가 순식간에 맞물리며 굳게 닫힌 금고의 암호가 모습을 드러냈다.","짧은 의견 교환만으로 퍼즐 조각이 맞춰지듯 숨겨진 금고의 해독 키가 단번에 완성됐다."]},"combos":[{"id":"X-001","a":"joker","b":"mona","title":"파트너의 감","en":"PARTNER INSTINCT","zones":["pass","lost"],"c":[],"intro":"두 갈래 어둠 앞에서 조커와 모르가나가 서로 다른 방향을 가리켰다.","qa":"저쪽 환기구 너머가 수상해.","qb":"아니라고! 이 몸의 코는 왼쪽을 가리킨다고!","ch":[{"label":"조커의 감을 믿는다","sub":"안전한 탐색 · 엔 확보","n":"환기구 너머 작은 창고에서 흩어진 엔을 깔끔하게 챙겼다.","qa":"내 감도 나쁘지 않지?","qb":"흥, 이번엔 조커한테 졌네.","fx":[{"k":"yen","a":350,"b":350},{"k":"mvp","v":1,"all":false}],"rel":"의기투합"},{"label":"모르가나의 코를 믿는다","sub":"보물 기회 · 체력 소모","n":"모르가나가 좁은 틈을 비집고 들어가 반짝이는 보물을 물어 왔다.","qa":"역시 파트너네.","qb":"흐흥! 이제 이 몸의 코를 믿겠지?!","fx":[{"k":"tre","v":1},{"k":"hp","v":-5,"all":false},{"k":"mood","v":4,"all":false}],"rel":"의기투합"}]},{"id":"X-002","a":"joker","b":"ryuji","title":"지름길 돌파","en":"SHORTCUT DASH","zones":["pass","gate"],"c":[],"intro":"녹슨 철망 너머로 반짝이는 상자가 보이자 류지가 먼저 달려 나가려 했다.","qa":"잠깐, 함정부터 확인하자.","qb":"에이, 고민할 시간에 부수고 챙기면 되잖아!","ch":[{"label":"류지대로 밀어붙인다","sub":"빠른 돌파 · 피해 감수","n":"류지가 철망을 단숨에 걷어차고 안쪽 보물을 낚아챘다.","qa":"기세는 인정할게.","qb":"봤냐?! 이럴 땐 스피드가 생명이라고!","fx":[{"k":"tre","v":1},{"k":"yen","a":250,"b":250},{"k":"hp","v":-8,"all":false},{"k":"mis","v":1,"all":false}],"rel" const nudgeOk=()=>!!run&&run.phase==='running'&&!tq&&run.nudge>0&&!(run.nudgeAt!=null&&run.beat<run.nudgeAt+3);/* 연타 방지: 거든 뒤 몇 줄은 쉰다 */

 if(m.hp<=35){hp(m,6);out=[{sys:1,text:`조커가 ${m.c.name}의 어깨를 가볍게 두드렸다.`},{who:m.id,n:'',q:say(m.c,'reply'),res:'HP +6'}]}
 else if(chance(.4)){const pr=actPair(m.id);if(pr)out=[{sys:1,text:`조커가 ${ul(m.c.name)} 슬쩍 부추겼다.`},...pr]}

/* 쌍대사: 둘 다 파티에 있고 조건이 맞으면, 한 판에 한 번씩 */
function actPair(who){
 if(!who&&run.rel&&chance(.6)){const cl=chemLine();if(cl){if(hasR('R-02')){alive().forEach(x=>hp(x,6));relicPay('R-02','전원 HP +6')}return cl}}
 const cand=SCRIPT.pairs.filter(x=>!run.pairs.includes(x.id)&&mem(x.a)&&mem(x.b)&&(!who||x.a===who||x.b===who)&&ok(x.c,{a:x.a}));if(!cand.length)return null;
 const mw=x=>['MEM_SAVED','MEM_SPLASH'].some(id=>hasMem(x.a,id,x.b)||hasMem(x.b,id,x.a))?2:1;/* storyteller 3: 기억이 얽힌 짝 */

 const out=[{who:x.a,n:'',q:fill(x.qa,{who:a.c})},{who:x.b,n:'',q:fill(x.qb,{who:mem(x.b).c})}];
 if(x.end&&x.end.who&&mem(x.end.who))out.push({who:x.end.who,n:'',q:x.end.q});
 const res=applyFx(a,x.fx);if(res)out[out.length-1].res=res;out[out.length-1].hold=1;/* 쌍대사 = 장면: 다 나오면 탭 대기 */
 if(hasR('R-02')){alive().forEach(y=>hp(y,6));relicPay('R-02','전원 HP +6')}if(chance(.5))chemShift(x.a,x.b,'쌍대사');return out}

 if(a==='buy'){const p=PROPS.find(x=>x.id===v);if(p&&!has(p.id)&&spend(p.cost)){S.props.push(p.id);ui.msg=`${p.name} 배치 완료! ${p.unlock} 해금 · ${p.eff}`}save();render();return}
 if(a==='bus'){const nb=BUS[S.bus+1];if(nb&&spend(nb.cost)){S.bus++;ui.msg=`모나 버스 Lv.${S.bus} 튜닝 완료! ${nb.eff}`}save();render();return}
 if(a==='pick'){const c=PICK[S.pick+1];if(c&&spend(c)){S.pick++;ui.msg=`자물쇠 따개 Lv.${S.pick} 강화 완료!`}save();render();return}
 if(a==='smoke'){if(S.smoke<9&&spend(600)){S.smoke++;ui.msg='연막탄을 하나 챙겼습니다.'}save();render();return}
 if(a==='curry-buy'){if(S.curry<9&&spend(400)){S.curry++;ui.msg='르블랑 카레를 포장했습니다.'}save();render();return}
 if(a==='reset'){if(!ui.reset){ui.reset=true;render();return}clearTimeout(T);run=null;S=DEF();save();clearRun();ui.reset=false;ui.msg='모든 기록과 진행 중인 판을 지웠습니다.';render();return}/* 진행 중 판(RKEY)도 함께 지워야 CONTINUE가 남지 않음 */
 if(a==='backup'){backupSave();return}
 if(a==='restore'){restoreSave();return}
});
artLoad();try{document.fonts&&document.fonts.ready.then(()=>setTimeout(()=>{if(![...document.fonts].some(f=>f.family.replace(/["']/g,'')==='Orbit'&&f.status==='loaded'))document.body.classList.add('noorbit')},1500))}catch(e){}/* Orbit이 실제로 불러와졌는지 */
(()=>{/* 로딩 화면 걷기(비동기라 아래 첫 render 뒤에 걷힘): 구글 폰트 스타일이 붙고 글꼴이 준비되면. 늦어도 2.5초 */
 const L=document.getElementById('loader');if(!L)return;let done=0;
 const off=()=>{if(done)return;done=1;L.classList.add('out');setTimeout(()=>L.remove(),RM?0:450)};
 const fr=()=>{try{return document.fonts?document.fonts.ready:Promise.resolve()}catch(e){return Promise.resolve()}};
 const wait=()=>{if(window.gfOk)requestAnimationFrame(()=>fr().then(off,off));else if(!done)setTimeout(wait,50)};
 wait();setTimeout(off,2500)})();
render();
}
</script>
