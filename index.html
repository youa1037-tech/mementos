<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘도 메멘토스!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Black+Han+Sans&family=Archivo+Black&family=Noto+Sans+KR:wght@400;700;900&family=Playfair+Display:ital,wght@0,900;1,900&family=Special+Elite&display=swap" rel="stylesheet">
<style>
/* VOICE: 장난스럽고 날렵한 괴도단 관찰 놀이터
   IDEA: 메멘토스 역의 붉은 안내판과 괴도단 예고장
   PICTURE: 붉은 선로가 소실점으로 빨려 드는 터널 포스터, 탐사 중엔 노선도와 말풍선
   COLOUR and TYPE: 먹색 바탕, 신호 빨강, 종이 흰색 / Black Han Sans + Anton + Noto Sans KR
   LAYOUT: 모바일 한 줄 스택, 넓은 화면은 노선도 | 로그 두 칸 */
:root{color-scheme:dark;--bg:#0f0b0c;--p:#1b1416;--p2:#2a1e22;--ink:#f6f1ea;--mut:#b9aca5;--red:#e5191c;--red2:#8e0f13;--gold:#f5b942;--line:#3b2b2f;--line2:#4a3237;--faint:#8d807a;--redt:#ff5a5a;--hd:'Black Han Sans','Noto Sans KR',sans-serif;--en:'Anton','Black Han Sans',sans-serif;--disp:'Archivo Black','Black Han Sans',sans-serif}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{word-break:keep-all;overflow-wrap:anywhere;margin:0;background:var(--bg) radial-gradient(120% 50% at 50% -10%,#3d0a0e 0,transparent 60%) no-repeat;color:var(--ink);font:16px/1.55 'Noto Sans KR',system-ui,sans-serif;overflow-x:clip;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
h1,h2,h3{font-family:var(--hd);font-weight:400;line-height:1.05;margin:0;text-wrap:balance}
.btn{min-height:44px;padding:10px 20px;background:var(--red);color:#fff;font-family:var(--en);letter-spacing:.03em;font-size:18px;clip-path:polygon(5% 0,100% 0,95% 100%,0 100%);transition:transform .15s}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn.ghost{background:var(--ink);color:#141012}
.btn.sm{min-height:40px;font-size:15px;padding:8px 16px}
.btn.big{font-size:21px;padding:12px 34px}
.btn:disabled{background:#3b2b2f;color:var(--faint);cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.wrap{max-width:1080px;margin:0 auto;padding:16px max(4vw,14px) 40px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.bar h2{font-size:32px;flex:1}
.pill{background:var(--ink);color:#141012;font-family:var(--en);padding:4px 12px;font-size:17px;white-space:nowrap}
.hint{color:var(--mut);font-size:14px;margin:4px 0 14px}
/* main */
.main{max-width:1080px;margin:0 auto;padding:max(3vw,16px) max(4vw,14px) 40px}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(20px,4vw,48px);align-items:center}
.poster{aspect-ratio:4/3;background:#000;border:3px solid var(--ink);transform:rotate(-1.5deg);box-shadow:12px 12px 0 var(--red);overflow:hidden}
.poster svg{display:block;width:100%;height:100%}
.glow{animation:pulse 2.6s ease-in-out infinite alternate;transform-origin:200px 158px}
@keyframes pulse{to{opacity:.45;transform:scale(1.15)}}
.kick{color:var(--mut);font-size:14px;margin:0 0 10px}
.ttl h1{font-size:clamp(46px,8vw,78px);line-height:.98;text-shadow:5px 5px 0 var(--red)}
.lead{font-size:17px;max-width:32em;color:#ebe3dd;margin:18px 0 22px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:36px 0 18px}
.stat{background:var(--p);padding:12px 14px}
.stat b{display:block;font-family:var(--disp);font-size:26px;font-weight:400}
.stat span{color:var(--mut);font-size:13px}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.how div{background:var(--p);padding:14px 16px}
.how b{font-family:var(--disp);font-weight:400;font-size:20px;letter-spacing:.02em;display:block;color:var(--red)}
.how p{margin:4px 0 0;color:var(--mut);font-size:14px}
.fine{color:var(--faint);font-size:13px;margin-top:26px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fine button{text-decoration:underline;color:var(--mut);min-height:44px}
/* party */
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--mut);margin-bottom:10px}
.legend i{display:inline-block;width:12px;height:12px;margin-right:5px;vertical-align:-1px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.card{position:relative;text-align:left;background:var(--p);padding:12px 12px 14px;border:2px solid transparent;display:flex;flex-direction:column;gap:4px;min-height:190px}
.card:hover{border-color:var(--line2)}
.card .code{font-family:var(--en);font-size:28px;color:var(--c);line-height:1;letter-spacing:.02em}
.card b{font-size:17px}
.card .tp{font-family:var(--en);letter-spacing:.05em;font-size:14px;color:#141012;background:var(--c);align-self:flex-start;padding:0 8px}
.card .tr{font-size:13px;color:var(--mut);line-height:1.45}
.card .w{display:flex;height:7px;margin-top:auto;gap:2px}
.card .w i{display:block;height:100%}
.card.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 15%,var(--p))}
.card .no{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:var(--c);color:#141012;font-family:var(--hd);display:none;place-items:center;font-size:18px}
.card.on .no{display:grid}
.dock{position:sticky;bottom:0;margin:16px calc(-1*max(4vw,14px)) 0;padding:12px max(4vw,14px) calc(12px + env(safe-area-inset-bottom));background:rgba(15,11,12,.97);border-top:2px solid var(--red);display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.slots{display:flex;gap:6px}
.slot{width:76px;height:44px;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--en);font-size:16px;color:var(--line2)}
.slot.f{border:2px solid var(--c);color:var(--c)}
.dinfo{flex:1 1 220px;font-size:13px;color:var(--mut);line-height:1.5}
.dinfo b{color:var(--ink)}
.dinfo .new{color:var(--gold);font-weight:700}
/* explore */
.ex{max-width:1180px;margin:0 auto;padding:8px max(3vw,10px) 96px}
.xbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:6px 0 10px;border-bottom:2px solid var(--red)}
.tn{font-family:var(--en);font-size:36px;line-height:1}
.tn small{font-size:16px;color:var(--mut)}
.zn{flex:1 1 140px}
.zn b{font-family:var(--en);font-weight:400;font-size:22px;letter-spacing:.02em;display:block;line-height:1.1}
.zn small{color:var(--mut);font-size:13px}
.money{font-family:var(--disp);font-size:21px;white-space:nowrap}
.money small{font-family:var(--en);letter-spacing:.05em;font-size:14px;color:var(--mut);margin-left:6px}
.ptags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.tag{font-size:13px;padding:2px 8px;background:var(--p2);color:var(--gold);white-space:nowrap}
.mood{font-family:var(--en);letter-spacing:.05em;font-size:14px;color:#141012}
.m-good{background:var(--gold)}.m-meh{background:#c8a9b2}.m-bad{background:var(--red);color:#fff}
.party{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.tile{background:var(--p);padding:8px;border-top:3px solid var(--c);transition:opacity .3s}
.tile.down{opacity:.45;filter:grayscale(1)}
.bub{position:relative;background:var(--ink);color:#141012;font-size:13px;line-height:1.35;padding:6px 8px;border-radius:12px 12px 12px 2px;margin-bottom:12px;transform-origin:14px 100%}
.bub span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.bub::after{content:'';position:absolute;left:10px;bottom:-8px;border-style:solid;border-width:8px 9px 0 0;border-color:var(--ink) transparent transparent}
.bub.fresh{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(.4) rotate(-7deg);opacity:0}60%{transform:scale(1.06) rotate(1deg);opacity:1}100%{transform:none}}
.face.fresh{animation:bounce .5s ease-out .1s}
@keyframes bounce{30%{transform:translateY(-7px) scale(1.25)}65%{transform:translateY(1px) scale(.95)}}
.tile.hit{animation:shake .42s}
.tile.hit .hb i{background:var(--red)}
@keyframes shake{15%{transform:translateX(-6px) rotate(-1.5deg)}35%{transform:translateX(5px) rotate(1deg)}55%{transform:translateX(-3px)}75%{transform:translateX(2px)}}
.tile.heal{animation:heal .7s}
@keyframes heal{35%{box-shadow:inset 0 0 0 3px #59c3ff,0 0 18px #59c3ff66}}
.money{position:relative}
.fly{position:absolute;right:0;top:20px;font-family:var(--en);font-size:19px;color:var(--gold);pointer-events:none;white-space:nowrap;animation:fly 1.1s ease-out forwards}
.fly.neg{color:#ff7a7a}
@keyframes fly{0%{transform:translateY(8px) scale(.8);opacity:0}20%{transform:translateY(0) scale(1.1);opacity:1}100%{transform:translateY(-28px);opacity:0}}
.banner{position:fixed;left:-10%;right:-10%;top:40%;z-index:40;background:var(--red);color:#fff;font-family:var(--hd);font-size:clamp(28px,7vw,50px);text-align:center;padding:12px 0;transform:skewY(-4deg);pointer-events:none;border-block:4px solid var(--ink);animation:sweep 1.05s cubic-bezier(.7,0,.3,1) forwards}
.banner span{display:inline-block;transform:skewY(4deg)}
.banner small{display:block;font-size:.42em;font-family:'Noto Sans KR',sans-serif;font-weight:700;opacity:.85}
@keyframes sweep{0%{clip-path:inset(0 100% 0 0)}28%,72%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 100%)}}
.scrim{position:fixed;inset:0;z-index:25;background:rgba(8,5,6,.6)}
.scrim.enter{animation:fade .25s}
@keyframes fade{from{opacity:0}}
.evt.enter{animation:sheet .4s cubic-bezier(.2,.9,.25,1.06)}
@keyframes sheet{from{transform:translateY(100%)}}
.evt.enter h3{animation:slash .45s .12s both}
@keyframes slash{from{transform:translateX(-36px) skewX(-14deg);opacity:0}}
.evt.enter .ch{animation:rise .32s both;animation-delay:calc(180ms + var(--i)*70ms)}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
.ch{transition:transform .12s,border-color .12s}
.ch:active:not(:disabled){transform:scale(.97)}
.nm{display:flex;align-items:center;gap:6px}
.nm .code{font-family:var(--en);color:var(--c);font-size:19px;line-height:1}
.nm b{font-size:13px;color:var(--mut);font-weight:400;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.face{width:24px;height:24px;border-radius:50%;background:var(--c);color:#141012;display:grid;place-items:center;font-weight:900;font-size:13px;flex:none}
.hb{height:7px;background:var(--line);margin-top:6px}
.hb i{display:block;height:100%;background:var(--ink);transition:width .4s}
.hb i.low{background:var(--red)}
.hb.s{height:4px;margin-top:3px}.hb.s i{background:#59c3ff}
.nums{font-size:13px;color:var(--mut);margin-top:3px;white-space:nowrap}
.mt{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.mt .tag{padding:0 6px}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:10px;margin-top:10px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.mapbox{background:var(--p);padding:10px}
.map{position:relative;height:190px}
.mapbox.big .map{height:290px}
@media(min-width:821px){.map{height:290px}}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.map line{stroke:var(--line2);stroke-width:7;stroke-linecap:round}
.map line.hot{stroke:var(--red)}
.node{position:absolute;transform:translate(-50%,-50%);width:max-content;max-width:42%;padding:6px 10px;background:var(--p2);border:2px solid var(--line2);text-align:center;line-height:1.2}
.node b{display:block;font-family:var(--en);font-weight:400;font-size:16px;letter-spacing:.03em}
.node small{display:block;font-size:13px;color:var(--mut)}
.node.cur{background:var(--red);border-color:var(--ink)}
.node.cur small{color:#ffe1e1}
button.node.opt{border-color:var(--ink);min-height:44px;animation:blink 1s ease-in-out infinite alternate}
button.node.opt:hover{background:var(--line)}
@keyframes blink{to{border-color:var(--red)}}
.node.lock{opacity:.6;border-style:dashed}
.mhint{font-size:14px;color:var(--gold);margin:8px 0 0;font-weight:700}
.logbox{background:var(--p)}
#log{list-style:none;margin:0;padding:4px 10px;height:clamp(260px,44vh,520px);overflow-y:auto}
#log li{display:grid;grid-template-columns:42px minmax(0,1fr);gap:8px;padding:7px 0;border-bottom:1px solid var(--p2);font-size:15px}
#log time{font-family:var(--en);color:var(--faint);font-size:13px;padding-top:2px}
#log p{margin:0;border-left:3px solid var(--c,transparent);padding-left:8px}
#log .who{color:var(--c);margin-right:6px;font-family:var(--en);font-weight:400;letter-spacing:.03em}
#log q{quotes:'“' '”';color:#fff;font-weight:700}
#log em{display:inline-block;font-style:normal;font-size:13px;background:var(--p2);color:var(--gold);padding:0 6px;margin-left:6px}
#log li.sys p{color:var(--mut)}
#log li.ev p{color:#fff;font-family:var(--hd);font-size:18px;border-left-color:var(--red)}
#log li.turn p{color:var(--redt);font-family:var(--hd)}
#log li.warn p{color:#ff7a7a;font-weight:700}
.evt{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#150f11;border-top:4px solid var(--red);padding:16px max(4vw,14px) calc(18px + env(safe-area-inset-bottom));box-shadow:0 -24px 48px rgba(0,0,0,.7);max-height:78vh;overflow:auto}
.evt>div{max-width:640px;margin:0 auto}
.evt h3{font-size:26px}
.evt .intro{color:var(--mut);margin:6px 0}
.pq{margin:6px 0 4px;font-weight:700}
.pq b{color:var(--c);font-family:var(--en);font-weight:400;font-size:18px;margin-right:6px}
.ch{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--p2);padding:10px 12px;margin-top:8px;min-height:56px;border:2px solid transparent}
.ch:hover:not(:disabled){border-color:var(--ink)}
.ch .k{font-family:var(--en);font-size:22px;background:var(--red);color:#fff;width:38px;height:38px;display:grid;place-items:center;flex:none;transform:skewX(-8deg)}
.ch b{display:block}
.ch small{color:var(--mut);font-size:13px}
.ch:disabled{opacity:.42;cursor:not-allowed}
.ctl{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(15,11,12,.97);border-top:2px solid var(--red);display:flex;gap:6px;padding:8px max(3vw,8px) calc(8px + env(safe-area-inset-bottom));justify-content:center}
.ctl button{min-height:44px;padding:6px 10px;background:var(--p2);font-family:var(--en);letter-spacing:.04em;font-size:15px;flex:1 1 0;max-width:120px;white-space:nowrap}
.ctl button[aria-pressed=true]{background:var(--ink);color:#141012}
.ctl .warn{background:var(--red2)}
.ctl button:disabled{opacity:.38;cursor:not-allowed}
/* result */
.report{background:var(--ink);color:#141012;max-width:520px;margin:12px auto 0;transform:rotate(-1deg);box-shadow:12px 12px 0 var(--red);padding:0 0 16px}
.report header{background:#141012;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px 20px;clip-path:polygon(0 0,100% 0,100% 78%,0 100%)}
.report header span{font-family:var(--hd);font-size:25px}
.report header small{font-size:13px;color:#cfc4be;white-space:nowrap}
.report dl{margin:10px 16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px}
.report dt{font-family:var(--en);letter-spacing:.05em;font-size:14px;color:#6b5f5a;padding-top:2px;white-space:nowrap}
.report dd{margin:0;font-weight:700}
.stars{color:var(--red);font-size:21px;letter-spacing:2px}
.stars i{display:inline-block;font-style:normal}
.report.anim{animation:drop .55s cubic-bezier(.2,.9,.25,1.1) both}
@keyframes drop{from{transform:translateY(-40px) rotate(-7deg);opacity:0}}
.report.anim .stars i{animation:stamp .38s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(450ms + var(--i)*170ms)}
@keyframes stamp{from{transform:scale(2.6) rotate(-24deg);opacity:0}}
.report.anim blockquote{animation:slash .5s 1.4s both}
.report blockquote{margin:12px 16px 0;padding:10px 14px;background:#141012;color:#fff;font-family:var(--hd);font-size:19px}
.report footer{margin:10px 16px 0;font-size:13px;color:#6b5f5a}
.newc{max-width:520px;margin:24px auto 0;background:var(--gold);color:#141012;padding:10px 14px;font-family:var(--en);letter-spacing:.04em;font-size:17px}
.after{max-width:640px;margin:30px auto 0}
.after h3{font-size:26px;margin-bottom:10px}
.after ol{list-style:none;padding:0;margin:0}
.after li{padding:9px 12px;border-left:3px solid var(--c,var(--line2));margin-bottom:6px;background:var(--p)}
.after li b{color:var(--c);font-family:var(--en);font-weight:400;font-size:17px;margin-right:8px}
.after li.n{color:var(--mut)}
.res .row{justify-content:center;margin-top:26px}
textarea{width:100%;max-width:520px;display:block;margin:14px auto 0;min-height:170px;background:var(--p);color:var(--ink);border:1px solid var(--line);font:15px/1.5 'Noto Sans KR',sans-serif;padding:10px}
/* shop */
.shop section{margin-top:26px}
.shop h3{font-size:26px;margin-bottom:4px}
.toast{background:var(--gold);color:#141012;padding:10px 14px;font-weight:700;margin:6px 0 0}
.shelf,.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.prop{background:var(--p);padding:12px;display:grid;grid-template-columns:60px minmax(0,1fr);gap:12px;align-items:start;border:2px solid transparent}
.prop.own{border-color:var(--gold)}
.prop svg{width:60px;height:60px;display:block}
.prop b{font-family:var(--en);font-weight:400;font-size:20px;letter-spacing:.02em;display:block;line-height:1.2}
.prop p{margin:4px 0 10px;font-size:13px;color:var(--mut)}
.owned{font-size:14px;color:var(--gold);font-weight:700}
.busbox{background:var(--p);padding:14px 16px;max-width:640px}
.lv{display:flex;gap:6px;margin:6px 0 10px}
.lv i{flex:1;height:14px;background:var(--line);transform:skewX(-14deg)}
.lv i.on{background:var(--red)}
.buslist{list-style:none;padding:0;margin:0 0 12px;font-size:14px}
.buslist li{padding:3px 0;color:var(--faint)}
.buslist li.on{color:var(--ink)}
.buslist li b{font-family:var(--en);font-weight:400;margin-right:8px}
/* ===== layout v2 (DESIGN.md 7장 개선 목록) ===== */
.stats{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:820px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat.wide{grid-column:span 2}}
.cards{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.card{min-height:0;padding:10px 12px 12px;gap:3px}
.card .w{margin-top:8px}
.dock{flex-direction:column;align-items:stretch;gap:10px}
.detail{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;align-items:center}
.detail .code{font-family:var(--en);font-size:26px;color:var(--c);line-height:1;grid-row:span 2}
.detail b{font-size:15px}
.detail p{margin:0;font-size:13px;color:var(--mut)}
.drow{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
.drow .row{margin-left:auto}
.ex{padding-top:0}
.xbar{position:sticky;top:0;z-index:15;background:rgba(15,11,12,.96);margin:0 calc(-1*max(3vw,10px));padding:8px max(3vw,10px);gap:4px 12px;flex-wrap:nowrap}
.xr{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.party{margin-top:8px;gap:6px}
.tile{padding:6px 8px 8px}
.nm .hpn{margin-left:auto;font-family:var(--en);font-size:16px;line-height:1}

function ok(cs,x={}){return (cs||[]).every(c=>{switch(c.k){
 case 'mood':return !!run&&(c.op==='>='?run.mood>=c.v:run.mood<c.v);

 return v.replace(/([가-힣A-Za-z0-9]+)\((이)\)가|([가-힣A-Za-z0-9]+)\(을\)를|([가-힣A-Za-z0-9]+)\(은\)는|([가-힣A-Za-z0-9]+)\(과\)와/g,(m,a,_,b,c2,d)=>a?ig(a):b?ul(b):c2?un(c2):wa(d))}

function maybeEvent(){

/* 관계 사건(의견 충돌)은 구역 사건과 경쟁하지 않고 따로 굴린다: 분위기가 나쁘면 일어날 수 있는 일 */

/* ============ 사슬: 발견 → 전개 → 결말, 턴 범위와 조건이 맞을 때 한 턴에 한 장면 ============ */
const ctTurn=()=>run.maxT===7?run.turn:Math.min(7,Math.round(run.turn*7/run.maxT));
const stepOk=x=>x&&(!x.turn||(ctTurn()>=x.turn[0]&&ctTurn()<=x.turn[1]))&&ok(x.c);
const nextKey=st=>st.stage==='find'?'grow':st.stage==='grow'?'end':null;
function chainNeeds(t){return !!run&&run.chains.some(st=>{if(st.done)return false;const x=CHAIN[st.id].steps[nextKey(st)];return x&&x.c.some(c=>c.k==='tag'&&c.v===t)})}
function chainScene(ch,x,key){const sp=x.who&&mem(x.who),m=sp||pick(alive());
 const out=[{sys:1,ev:1,text:`사슬 — ${ch.name}${key==='end'?' (결말)':''}`},{sys:1,text:fill(x.n,{who:m.c}),res:applyFx(m,x.fx)}];
 if(sp&&x.q)out.push({who:sp.id,n:'',q:fill(x.q,{who:sp.c})});
 const cx=S.codex.chains||(S.codex.chains={}),rank={find:1,grow:2,end:3};if((rank[cx[ch.id]]||0)<rank[key]){cx[ch.id]=key;save()}

const CHAIN_END_HEAT=5;/* 결말은 위험도 5 이상인 판에서만: 깊이 간 사람이 이야기 끝을 본다 */
function chainTick(){

  if(stepOk(x)&&(key!=='end'||run.heat>=CHAIN_END_HEAT)&&(ctTurn()>=x.turn[1]||chance(.6))){st.stage=key;if(key==='end')st.done=true;return chainScene(ch,x,key)}}

 const cand=SCRIPT.chains.filter(ch=>!run.chains.some(x=>x.id===ch.id)&&!(S.lastChains||[]).includes(ch.id)&&stepOk(ch.steps.find));
 if(!cand.length||!chance(.4+(DAY('chain')||0)))return null;

function enterZone(z){const Z=ZONES[z];

const STAR=[3500,7000,12000,18000],RISK_PAY=.01,WIPE_KEEP=.4;

 S.yen+=inc;S.codex.reports++;S.codex.best=Math.max(S.codex.best,st);S.lastChains=r.chains.map(x=>x.id);S.lastDay=S.today;S.today=null;save();

function afterStory(r,reason){
 const ids=r.party.map(m=>m.id),inP=id=>ids.includes(id),L=[{n:'르블랑 다락방. 탐사를 마친 괴도단이 소파와 의자에 아무렇게나 늘어졌다.'}];
 const ctx={result:reason};const kind=a=>a.c.some(c=>c.k==='result')?'result':a.c.some(c=>c.k==='prop')?'prop':a.c.some(c=>c.k==='mood')?'mood':'tag';
 const scene=a=>a.lines.filter(l=>!l.need||inP(l.need)).map(l=>l.who?{who:l.who,q:l.t}:{n:l.t});
 const elig=SCRIPT.afters.filter(a=>(!a.lines[0].need||inP(a.lines[0].need))&&(ok(a.c,ctx)||(r.hidden&&ok(a.c,{result:'hidden'}))));
 const pick1=k=>{let c=elig.filter(a=>kind(a)===k);if(k==='result'&&r.hidden&&c.some(a=>a.c.some(x=>x.v==='hidden')))c=c.filter(a=>a.c.some(x=>x.v==='hidden'));return c.length?pick(c):null};
 const res=pick1('result');if(res)L.push(...scene(res));
 const covered=new Set();for(const a of elig.filter(a=>kind(a)==='tag')){const key=JSON.stringify(a.c);if(covered.has(key))continue;covered.add(key);L.push(...scene(a))}
 const sheetTag=t=>SCRIPT.afters.some(a=>a.c.some(c=>c.k==='tag'&&c.v===t));
 if(!sheetTag('100엔 손실')&&hasTag('100엔 손실','ryuji'))L.push({who:'ryuji',q:'내 100엔… 다음엔 꼭 되찾는다고.'});
 if(!sheetTag('수상한 음료')&&hasTag('수상한 음료'))L.push({n:'가져온 수상한 음료는 아무도 손대지 않은 채 카운터 구석에 놓였다.'});
 if(!sheetTag('배탈')){const sick=r.tags.find(t=>t.l==='배탈');if(sick)L.push({n:`${un(CH[sick.w].name)} 배를 감싸 쥐고 소파에 드러누웠다.`})}
 if(!sheetTag('함정 발동')&&hasTag('함정 발동'))L.push({n:'누군가 화이트보드에 적었다. “보물상자는 함부로 열지 말 것.”'});
 if(hasTag('미완성 스케치'))L.push({who:'yusuke',q:'메멘토스에서 시작한 스케치, 여기서 마무리하지.'},{who:'futaba',q:'나 또 모델 하는 거야?!'});
 if(hasTag('티타임 약속'))L.push({who:'haru',q:'아까 약속한 티타임, 지금 열어 볼까?'});
 if(!sheetTag('티격태격')&&hasTag('티격태격'))L.push({n:'돌아오는 길 내내 이어진 말다툼은 르블랑에서도 끝나지 않았다.'});
 for(const st of r.chains){const ch=CHAIN[st.id],x=st.done?ch.steps.after:(reason!=='forced'?ch.steps.miss:null);if(!x)continue;
  L.push({n:x.n});if(x.who&&inP(x.who)&&x.q)L.push({who:x.who,q:x.q})}
 const md=pick1('mood');if(md)L.push(...scene(md));
 const pr=pick1('prop');if(pr)L.push(...scene(pr));
 if(!res&&r.hidden)L.push({n:'다들 존재하지 않는 역 이야기를 하느라 밤이 깊어지는 줄도 몰랐다.'});
 for(const m of r.party)L.push({who:m.id,q:say(m.c,'back')});
 return L.filter(l=>(l.q||l.n));
}

function tutGo(d){const n=ui.tstep+d;if(n<0)return;if(n>=TUT.length){S.tut=true;save();ui.screen=ui.tafter;ui.enter=true;render();window.scrollTo(0,0);return}ui.tstep=n;ui.enter=true;render();window.scrollTo(0,0)}
function render(){
 const ol=$('#log'),stick=!ol||ol.scrollHeight-ol.scrollTop-ol.clientHeight<40,top=ol?ol.scrollTop:0;
 const fa=document.activeElement,fk=fa&&fa.closest&&fa.closest('#app')&&fa.dataset?fa.dataset.act:null;
 const app=$('#app');app.innerHTML=({main:vMain,party:vParty,explore:vExplore,result:vResult,shop:vShop,codex:vCodex,tutorial:vTut})[ui.screen]();
 app.classList.toggle('scr-in',!!ui.enter&&!RM);ui.enter=false;
 const l=$('#log');if(l)l.scrollTop=stick?l.scrollHeight:top;
 if(fk){const el=[...document.querySelectorAll('#app [data-act]')].find(x=>x.dataset.act===fk);if(el)el.focus({preventScroll:true})}
 if(ui.screen==='explore'&&run){countYen();if(run.banner){showBanner(run.banner);run.banner=null}}
 const inc=$('#inc');if(inc&&inc.dataset.to)countTo(inc,0,+inc.dataset.to,1100,500);
}
/* ============ 연출 ============ */
let raf=0;
const stepVals=(from,to,n)=>Array.from({length:n},(_,k)=>Math.round(from+(to-from)*(1-Math.pow(1-(k+1)/n,3))));
function countTo(el,from,to,dur,delay=0){
 if(RM){el.textContent='¥'+fmt(to);return}
 const vals=stepVals(from,to,Math.max(6,Math.round(dur/33))),t0=performance.now()+delay;
 const tick=now=>{const i=Math.floor((now-t0)/33);if(i>=0)el.textContent='¥'+fmt(vals[Math.min(i,vals.length-1)]);if(i<vals.length-1)requestAnimationFrame(tick)};
 requestAnimationFrame(tick);
}
function countYen(){
 const el=$('#yen');if(!el)return;
 const d=run.yen-(run.ly??run.yen);run.ly=run.yen;
 if(d&&!RM){const f=document.createElement('span');f.className='fly'+(d<0?' neg':'');f.textContent=`${d>0?'+':'-'}¥${fmt(Math.abs(d))}`;el.parentNode.appendChild(f)}
 cancelAnimationFrame(raf);const from=run.dy??run.yen,to=run.yen;
 if(RM||from===to){run.dy=to;el.textContent='¥'+fmt(to);return}
 const vals=stepVals(from,to,run.speed===2?9:15),t0=performance.now();
 const tick=now=>{const i=Math.max(0,Math.min(vals.length-1,Math.floor((now-t0)/33)));run.dy=vals[i];const x=$('#yen');if(x)x.textContent='¥'+fmt(run.dy);if(i<vals.length-1)raf=requestAnimationFrame(tick)};
 raf=requestAnimationFrame(tick);
}
function showBanner(b){
 if(RM)return;document.querySelectorAll('.banner').forEach(x=>x.remove());
 const el=document.createElement('div');el.className='banner';el.setAttribute('aria-hidden','true');
 el.innerHTML=`<span>${rn(b.t)}<small>${esc(b.s)}</small></span>`;document.body.appendChild(el);
 setTimeout(()=>el.remove(),1150);
}
function spend(c){if(S.yen<c){ui.msg='엔이 부족합니다. 메멘토스에서 더 벌어 오십시오.';return false}S.yen-=c;return true}

/* ============ 입력 ============ */
let sx=null;
$('#app').addEventListener('pointerdown',e=>{if(ui.screen==='tutorial')sx=[e.clientX,e.clientY]});
$('#app').addEventListener('pointerup',e=>{if(ui.screen!=='tutorial'||!sx)return;const dx=e.clientX-sx[0],dy=e.clientY-sx[1];sx=null;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)tutGo(dx<0?1:-1)});
$('#app').addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
 const [a,v]=b.dataset.act.split(':');
 if(a!=='retreat')ui.rc=false;if(a!=='reset')ui.reset=false;
 if(a==='go'&&v==='party'&&!S.tut){ui.screen='tutorial';ui.tstep=0;ui.tafter='party';ui.enter=true;render();window.scrollTo(0,0);return}
 if(a==='howto'){ui.screen='tutorial';ui.tstep=0;ui.tafter='main';ui.enter=true;render();window.scrollTo(0,0);return}
 if(a==='tutnext'){tutGo(1);return}
 if(a==='tutprev'){tutGo(-1);return}
 if(a==='tutskip'){ui.tstep=TUT.length-1;tutGo(1);return}
 if(a==='tipok'){if(ui.tip){S.tips.push(ui.tip.id);save();ui.tip=null}if(run&&run.tipPause){run.paused=false;run.tipPause=false}render();schedule();return}
 if(a==='go'){ui.screen=v;ui.enter=true;ui.msg='';render();window.scrollTo(0,0);return}
 if(a==='tab'){ui.tab=v;ui.msg='';render();return}
 if(a==='sel'){ui.focus=v;const i=ui.sel.indexOf(v);if(i>=0)ui.sel.splice(i,1);else if(ui.sel.length<3)ui.sel.push(v);render();return}
 if(a==='random'){ui.sel=shuffle(CHARS.map(c=>c.id)).slice(0,3);render();return}
 if(a==='start'&&ui.sel.length===3){newRun([...ui.sel]);ui.screen='explore';ui.enter=true;ui.tip=null;window.scrollTo(0,0);step();tip('start');render();schedule();return}
 if(a==='move'){move(v);return}
 if(a==='choice'){choose(+v);return}
 if(a==='pause'){run.paused=!run.paused;render();schedule();return}
 if(a==='speed'){run.speed=run.speed===1?2:1;render();schedule();return}
 if(a==='manual'){run.manual=!run.manual;render();schedule();return}
 if(a==='next'){step();return}
 if(a==='curry'){useCurry();return}
 if(a==='cashout'){if(run&&run.phase==='choose'){log({sys:1,text:'괴도단은 여기서 탐사를 접고 르블랑으로 돌아갔다.'});endRun('retreat')}return}
 if(a==='retreat'){if(!ui.rc){ui.rc=true;render();return}ui.rc=false;log({sys:1,text:'괴도단은 탐사를 접고 르블랑으로 돌아갔다.'});endRun('retreat');return}
 if(a==='copy'){const t=reportText();try{navigator.clipboard.writeText(t).then(()=>{ui.copy='ok';render()},()=>{ui.copy='fail';render()})}catch(err){ui.copy='fail';render()}return}
 if(a==='buy'){const p=PROPS.find(x=>x.id===v);if(p&&!has(p.id)&&spend(p.cost)){S.props.push(p.id);ui.msg=`${p.name} 배치 완료! ${p.unlock} 해금 · ${p.eff}`}save();render();return}
 if(a==='bus'){const nb=BUS[S.bus+1];if(nb&&spend(nb.cost)){S.bus++;ui.msg=`모나 버스 Lv.${S.bus} 튜닝 완료! ${nb.eff}`}save();render();return}
 if(a==='pick'){const c=PICK[S.pick+1];if(c&&spend(c)){S.pick++;ui.msg=`자물쇠 따개 Lv.${S.pick} 강화 완료!`}save();render();return}
