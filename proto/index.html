<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오늘도 메멘토스! · 코어 시제품</title>
<link href="../fonts/galmuri/galmuri.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<!-- 코어 개편 시제품 (Phase 2a: B1~B3 · 템 16+5 · 작업대) (docs/core-proto.md). 본 게임(index.html)과 따로 돈다. 그림은 ../img 를 같이 쓴다 -->
<style>
:root{color-scheme:dark;--bg:#0f0b0c;--p:#1b1416;--p2:#2a1e22;--ink:#f6f1ea;--mut:#b9aca5;--red:#e5191c;--red2:#8e0f13;--gold:#f5b942;--line:#3b2b2f;--en:'Anton',Galmuri11,sans-serif;--kr:Galmuri11,'Apple SD Gothic Neo',sans-serif;
 --phys:#d9d2c5;--curse:#b45cff;--elec:#ffe14a;--wind:#5ee08a;--heal:#6ec8ff}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--kr);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.35;cursor:default}
#app{max-width:460px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.en{font-family:var(--en);letter-spacing:.03em;font-weight:400}
/* 상단 HUD */
.hud{display:flex;align-items:center;gap:10px;padding:10px 12px 8px;background:#000;border-bottom:4px solid var(--red)}
.hud .fl{font:22px/1 var(--en)}.hud .fl small{display:block;font:11px/1.3 var(--kr);color:var(--mut)}
.hud .sp{flex:1}
.risk{font:16px/1 var(--en);padding:6px 9px;background:var(--gold);color:#141012}.risk.hot{background:var(--red);color:#fff}
.yen{font:20px/1 var(--en)}
.mini{display:grid;grid-template-columns:repeat(4,11px);gap:2px}.mini i{width:11px;height:11px;background:#1d1517}.mini i.v{background:#5a4247}.mini i.k{background:#3a2a2e;outline:1px dashed #6b5157}.mini i.at{background:var(--red)}.mini i.b{box-shadow:inset 0 0 0 2px var(--gold)}
/* 무대 */
.stage{position:relative;height:300px;overflow:hidden;background:var(--w2,#160f11);--w1:#2a1216;--w2:#140a0c;--t1:#3b1a20;--t2:#24101410;--lamp:255,170,120}
.stage.f1{--w1:#141b26;--w2:#0b0f16;--t1:#1f2a3a;--lamp:150,200,255}.stage.f2{--w1:#151d15;--w2:#0a0e0a;--t1:#22301f;--lamp:190,255,160}
.pxbg{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;z-index:0;pointer-events:none}
.stage>*:not(.pxbg){position:relative;z-index:1}.stage>.side,.stage>.rt,.stage>.fx{position:absolute}
.stage.quake{animation:quake .4s}@keyframes quake{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,0)}}
.stage:before{display:none;content:'';position:absolute;left:0;right:0;top:64%;height:6px;background:repeating-linear-gradient(90deg,#4b3a3e 0 18px,transparent 18px 30px);opacity:.7}
.stage .rt{position:absolute;left:12px;top:10px;right:12px;font:12px/1.4 var(--kr);color:var(--mut)}
.stage .rt b{display:block;font:20px/1.1 var(--en);color:var(--ink)}
.side{position:absolute;bottom:60px;display:flex;align-items:flex-end;gap:2px}
.side.pt{left:4px}.side.en{right:6px;flex-direction:row;align-items:flex-start;bottom:auto;top:146px;gap:4px}.foe.boss,.foe.reap{margin-top:-24px}
.unit{position:relative;display:flex;flex-direction:column;align-items:center;width:48px;transition:transform .2s}
.unit img{animation:bob 1.1s steps(1,end) infinite;image-rendering:pixelated;flex:none;filter:drop-shadow(0 4px 0 rgba(0,0,0,.5))}
.unit.act img{filter:drop-shadow(0 0 6px var(--gold)) drop-shadow(0 4px 0 rgba(0,0,0,.5))}
.unit.ko{opacity:.35;transform:translateY(8px) rotate(-8deg)}.unit.ko img{animation:none}
@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.stage.walk .unit:not(.ko) img{animation:walk .32s steps(1,end) infinite}@keyframes walk{0%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(2deg)}}
.unit.lunge{animation:lunge .38s ease-out}@keyframes lunge{40%{transform:translateX(26px) scale(1.06)}100%{transform:none}}
.unit.cast img{animation:cast .5s steps(2,end)}@keyframes cast{50%{filter:drop-shadow(0 0 10px #fff) brightness(1.6)}}
.unit.hop img{animation:hop .5s steps(4,end) 2}@keyframes hop{50%{transform:translateY(-12px)}}
.unit.act:not(.ko) img{animation:bob .55s steps(1,end) infinite}
.unit.coll img{animation:coll .25s steps(2,end) infinite;filter:hue-rotate(250deg) saturate(1.6) drop-shadow(0 0 6px #ff4fd8)}@keyframes coll{50%{transform:translateX(2px)}}
.unit.awk img{filter:drop-shadow(0 0 8px var(--gold)) brightness(1.15)}
.unit .row{font:10px/1 var(--kr);color:var(--mut);margin-top:4px}
.unit .hb{width:40px;height:5px;background:#3a2a2e;margin-top:3px}.unit .hb i{display:block;height:100%;background:#6fdc6a}.unit .hb i.lo{background:var(--red)}
.unit.hitf{animation:hit .3s}@keyframes hit{0%,100%{transform:none}30%{transform:translateX(-6px)}60%{transform:translateX(5px)}}
.bub{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);width:max-content;max-width:150px;background:var(--ink);color:#141012;font:11px/1.35 var(--kr);padding:5px 7px;margin-bottom:6px;z-index:3;animation:pop .2s}
.bub:after{content:'';position:absolute;top:100%;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--ink)}
.side.pt .unit:nth-child(2) .bub{margin-bottom:44px}.side.pt .unit:first-child .bub{left:0;transform:none;animation:none;max-width:112px}.side.pt .unit:first-child .bub:after{left:24px}/* 맨 왼쪽 말풍선은 화면 밖으로 안 나가게 *//* 가운데 사람 말풍선은 한 층 위로 (겹침 방지) */
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}}
.foe{position:relative;width:58px;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.foe .bd{animation:float 1.7s ease-in-out infinite alternate;width:40px;height:46px;background:radial-gradient(60% 50% at 50% 35%,#3a0f18,#0a0607);border-radius:40% 40% 30% 30%;position:relative;box-shadow:0 0 0 2px #000,0 6px 0 rgba(0,0,0,.5)}
.foe .bd:before,.foe .bd:after{content:'';position:absolute;top:17px;width:8px;height:4px;background:var(--red);box-shadow:0 0 4px var(--red)}.foe .bd:before{left:9px}.foe .bd:after{right:9px}
.foe.boss,.foe.reap{width:96px}.foe.boss .bd{width:62px;height:70px;background:radial-gradient(60% 50% at 50% 30%,#24324a,#05070b)}
.foe.reap .bd{width:64px;height:74px;background:radial-gradient(60% 50% at 50% 30%,#2b2b2b,#000);box-shadow:0 0 0 2px var(--red),0 0 18px var(--red2)}
.foe.sel .bd{outline:3px solid var(--gold);outline-offset:3px}
.foe.down .bd{animation:none;transform:rotate(80deg) translateX(14px);opacity:.75}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.foe .bd:before,.foe .bd:after{animation:blink 3.2s steps(1,end) infinite}@keyframes blink{0%,94%{transform:none}95%,98%{transform:scaleY(.15)}}
.foe.fhit .bd{filter:brightness(3) saturate(0)}.foe.flunge{animation:flunge .35s ease-out}@keyframes flunge{40%{transform:translateX(-24px)}100%{transform:none}}
.foe.dead{visibility:visible;animation:fade .5s forwards;pointer-events:none}@keyframes fade{to{opacity:0;transform:translateY(10px) scale(.7)}}
.foe.boss .bd,.foe.reap .bd{animation-duration:2.4s}
.stage .bg{display:none}@media (prefers-reduced-motion:reduce){.unit img,.foe .bd,.stage.quake{animation:none!important}}
.foe.gone{visibility:hidden}
.foe .nm{font:10px/1.2 var(--kr);margin-top:5px;text-align:center;white-space:nowrap}
.foe .hb{width:44px;height:5px;background:#3a2a2e;margin-top:3px}.foe .hb i{display:block;height:100%;background:var(--red)}
.wk{font:10px/1 var(--kr);padding:2px 4px;margin-top:3px;background:#2a1e22;color:var(--mut)}
.wk.k{color:#141012}
.foe .dn{position:absolute;top:-6px;font:16px/1 var(--en);color:var(--gold);text-shadow:0 2px 0 #000}
.fx{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center;z-index:5}
.fx b{font:52px/1 var(--en);color:#fff;background:var(--red);padding:6px 18px;transform:rotate(-6deg);box-shadow:8px 8px 0 #000;animation:slam .5s}
.fx b.g{background:var(--gold);color:#141012}
@keyframes slam{from{transform:rotate(-6deg) scale(2.2);opacity:0}}
.dmg{position:absolute;top:-24px;font:18px/1 var(--en);color:#fff;text-shadow:0 2px 0 #000;animation:up .8s forwards;z-index:4}.dmg.w{color:var(--gold)}.dmg.h{color:#6fdc6a}
@keyframes up{to{transform:translateY(-18px);opacity:0}}
/* 하단 */
.panel{flex:1;background:var(--p);padding:10px 12px 14px;display:flex;flex-direction:column;gap:9px}
.party{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pc{background:var(--p2);padding:6px 7px;border-left:4px solid var(--c)}
.pc b{font:15px/1 var(--en);color:var(--c)}.pc small{float:right;color:var(--mut);font-size:10px}
.bar{height:6px;background:#3a2a2e;margin-top:4px}.bar i{display:block;height:100%;background:#6fdc6a}.bar.s i{background:#59a7ff}.bar i.lo{background:var(--red)}
.pc .nu{font-size:10px;color:var(--mut);margin-top:2px}
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.slot{height:52px;background:#120d0f;border:2px dashed #3b2b2f;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:5px;font-size:19px;line-height:1;position:relative}
.slot.f{border:2px solid var(--line);background:var(--p2)}.slot.f[data-r=증폭]{border-color:#59a7ff}.slot.f[data-r=폭발]{border-color:var(--gold)}
.slot small{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:9px;line-height:1.1;color:var(--mut)}
.slot.on{animation:glow .6s}@keyframes glow{50%{box-shadow:0 0 12px var(--gold)}}
.slot.evo{border-color:var(--gold)!important;background:#2b2210}.slot.pick{outline:3px solid #fff;outline-offset:-3px}.slot.seal{opacity:.35;filter:grayscale(1)}
.pk.evo{border-left-color:var(--gold);background:#2b2210}
.bar.t i{background:#b45cff}.bar.t i.hi{background:#ff4fd8}
.md{font-size:10px;padding:0 4px;color:#141012}.md.c{background:#ff4fd8}.md.a{background:var(--gold)}
.negs{display:flex;flex-wrap:wrap;gap:5px}.neg{font-size:11px;padding:4px 7px;background:#2a0f14;border:1px solid var(--red2);color:#ffb3b3}.neg small{color:var(--gold)}
.psg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.psc{display:flex;gap:8px;align-items:center;text-align:left;background:var(--p);padding:7px;border-left:4px solid var(--c);position:relative;min-height:62px}
.psc.on{background:#3a2a2e;outline:2px solid var(--c)}.psc img{image-rendering:pixelated;flex:none}.psc b{color:var(--c);font:15px/1 var(--en)}
.psc small{display:block;font-size:10px;color:var(--mut)}.psc .po{position:absolute;top:4px;right:6px;font:16px/1 var(--en);font-style:normal;color:var(--c)}
.els{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px}.els i{font-style:normal;font-size:9px;color:#141012;padding:0 3px}
.wk+.wk{margin-left:2px}.foe .wk{display:inline-block}.foe .wks{display:flex;flex-wrap:wrap;justify-content:center}
.tip{font-size:12px;color:var(--mut);min-height:18px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.ab{background:var(--p2);padding:9px 10px;text-align:left;border-left:4px solid var(--c,#777);min-height:54px}
.ab b{display:block;font-size:15px}.ab small{display:block;font-size:11px;color:var(--mut)}
.ab.wide{grid-column:1/-1}
.ab.gold{background:var(--gold);color:#141012;border-color:#000}.ab.gold small{color:#3b2b10}
.ab.red{background:var(--red);color:#fff;border-color:#000}.ab.red small{color:#ffd9d9}
.row2{display:flex;gap:7px}.row2>*{flex:1}
.go{background:var(--red);color:#fff;font:22px/1 var(--en);padding:14px;clip-path:polygon(3% 0,100% 0,97% 100%,0 100%);letter-spacing:.04em}
.go.sub{background:#3a2a2e;font-size:18px}
.sm{font-size:12px;color:var(--mut);text-decoration:underline;padding:6px}
.tog{font-size:12px;padding:6px 9px;border:2px solid var(--line);color:var(--mut)}.tog.on{background:var(--ink);color:#141012;border-color:var(--ink)}
/* 큰 지도 */
.map{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:relative;aspect-ratio:1/1;max-width:300px;margin:0 auto;width:100%}
.cell{background:#120d0f;display:grid;place-items:center;font-size:22px;position:relative;color:var(--mut)}
.cell.k{background:#241a1d;border:2px dashed #5b444a}.cell.v{background:#33262a}.cell.at{background:var(--red);color:#fff}
.cell.nx{background:#3b2b2f;border:2px solid var(--gold);animation:pulse 1.2s infinite;clip-path:none;font-size:22px;padding:0}
@keyframes pulse{50%{border-color:#fff}}
.cell small{position:absolute;bottom:2px;font-size:9px;color:var(--mut)}.cell.at small{color:#fff}
.lk{position:absolute;background:#5b444a;z-index:0}
/* 대화창 · 선택 */
.dlg{background:#000;border:3px solid var(--ink);padding:10px 12px;position:relative}
.dlg .who{position:absolute;top:-13px;left:10px;background:var(--gold);color:#141012;font:14px/1 var(--en);padding:4px 8px}
.dlg p{margin:6px 0 0}.dlg q{display:block;margin-top:6px;color:var(--gold)}.dlg q:before,.dlg q:after{content:''}
.cmd{border:3px dashed var(--gold);padding:10px;background:#1a1410}
.cmd h3{margin:0;font:18px/1 var(--en);color:var(--gold)}.cmd h3 span{float:right;font:12px var(--kr);color:var(--mut)}
.pick{display:grid;gap:7px}
.pk{background:var(--p2);padding:10px;text-align:left;border-left:4px solid var(--line);display:flex;gap:10px;align-items:center}
.pk .ic{font-size:26px;width:34px;text-align:center}.pk b{font-size:15px}.pk small{display:block;color:var(--mut);font-size:11px}
.pk .tg{font-size:10px;padding:1px 5px;background:#000;color:var(--gold);margin-left:4px;vertical-align:2px}
.pk.syn{border-left-color:var(--gold)}
.log{max-height:160px;overflow:auto;font-size:12px;background:#0b0809;padding:6px 8px;color:var(--mut)}
.log p{margin:2px 0}.log p b{color:var(--ink)}
.title{padding:28px 18px;display:flex;flex-direction:column;gap:14px}
.title h1{font:46px/.95 var(--en);margin:0}.title h1 span{color:var(--red)}
.title p{margin:0;color:var(--mut)}
.card{background:var(--p);padding:12px 14px;border-left:4px solid var(--red)}
.card b{color:var(--ink)}
.res dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:8px 0}.res dt{color:var(--mut)}.res dd{margin:0;text-align:right;font-family:var(--en);font-size:18px}
</style>
</head>
<body>

<script>

","qa":"아케치 선배, 아까 그 판단 정말 빨랐어요!","qb":"당연한 계산이었어. 요시자와도 발놀림이 나쁘지 않네.","end":{"who":"kasumi","q":"감사합니다! 더 힘낼게요!"}},{"a":"joker","b":"futaba","qa":"내비, 이 앞은 어때?","qb":"반응 대박이야! 레어 템 냄새가 진동해!","end":{"who":"joker","q":"그럼 가 봐야지."}},{"a":"makoto","b":"yusuke","qa":"유스케, 차비는 챙겨 왔지?","qb":"…방금 문득 불길한 예감이 스쳤군.","end":{"who":"makoto","q":"하아, 끝나고 역까지 같이 가자."}},{"a":"haru","b":"mona","qa":"모나 쨩, 오늘 털에 윤기가 도네.","qb":"후훗, 하루는 역시 보는 눈이 있다니까!","end":null},{"a":"ann","b":"kasumi","qa":"카스미, 너 진짜 안 지친다! 비결이 뭐야?","qb":"매일 아침 스트레칭 덕분이에요! 안 선배도 같이해요!","end":{"who":"ann","q":"음… 내일부터 해 볼게!"}},{"a":"ryuji","b":"haru","qa":"하루, 너 아까 섀도 날려 버릴 때 좀 무서웠다고…","qb":"어머, 그랬어? 다음엔 조금 더 상냥하게 때려 볼게.","end":{"who":"ryuji","q":"그게 더 무섭잖아!"}},{"a":"futaba","b":"akechi","qa":"아케치, 너 아까 함정 미리 알고 있었지?","qb":"눈치챘나 보네. 굳이 먼저 말할 필요는 없었거든.","end":{"who":"futaba","q":"성격 진짜 꼬였어…"}},{"a":"joker","b":"makoto","qa":"슬슬 깊어졌네. 계속 갈까?","qb":"응, 다들 아직 버틸 만해. 조심해서 나아가자.","end":{"who":"joker","q":"좋아, 믿을게."}},{"a":"joker","b":"ryuji","qa":"류지, 너무 앞서가지 마.","qb":"아, 걱정 마! 문제 생기면 내가 먼저 막아 준다고!","end":{"who":"joker","q":"그게 제일 걱정인데."}},{"a":"joker","b":"ann","qa":"어두우니까 발밑 조심해.","qb":"응, 고마워! 근데 여기 은근히 으스스하지 않아?","end":{"who":"joker","q":"내 옆으로 와."}},{"a":"joker","b":"yusuke","qa":"유스케, 또 딴생각 중이지.","qb":"이 선로의 원근감이 너무 완벽해서 말이지…","end":{"who":"joker","q":"일단 걸으면서 봐."}},{"a":"joker","b":"haru","qa":"하루, 아직 괜찮아?","qb":"응, 도끼 휘두르니까 오히려 스트레스가 풀리는 기분이야.","end":{"who":"joker","q":"…다행이네."}},{"a":"joker","b":"mona","qa":"모나, 오늘 감은 어때?","qb":"최고지! 이 몸의 직감은 절대 안 빗나간다고!","end":null},{"a":"mona","b":"yusuke","qa":"어이 폭스! 보물 앞에서 그림 그리지 마!","qb":"진정한 보물은 돈이 아니라 그 안에 깃든 미학이다.","end":{"who":"mona","q":"아 진짜, 말 안 통하네!"}},{"a":"mona","b":"makoto","qa":"퀸, 운전할 때 너무 험하게 몰지 마!","qb":"미안 모나… 섀도가 튀어나와서 급브레이크를 밟았어.","end":{"who":"mona","q":"내 타이어 수명이 줄어든다고!"}},{"a":"mona","b":"futaba","qa":"내비! 이 몸 귀 자꾸 만지지 마!","qb":"말랑말랑해서 힐링된단 말이야~ 한 번만 더!","end":{"who":"mona","q":"안 돼! 집중하라고!"}},{"a":"mona","b":"akechi","qa":"크로우, 너 수상한 짓 하면 이 몸이 가만 안 둬!","qb":"안심해. 지금은 같은 배를 탄 입장이잖아.","end":{"who":"mona","q":"흥, 두고 보겠어!"}},{"a":"mona","b":"kasumi","qa":"바이올렛! 네 발놀림 꽤 날렵한데?","qb":"감사해요 모나 선배! 리듬체조 덕분이에요!","end":{"who":"mona","q":"오, 선배라니 기분 좋은데!"}},{"a":"ryuji","b":"futaba","qa":"야 후타바, 여기 숨겨진 치트키 같은 거 없냐?","qb":"치트키라니, 발로 뛰어서 파밍해야 제맛이지!","end":{"who":"ryuji","q":"아, 빡세네 진짜!"}},{"a":"ryuji","b":"akechi","qa":"야, 아케치! 굳이 그렇게 비꼬아야 속이 시원하냐?!","qb":"사실만 말했을 뿐인데, 찔리는 거라도 있어?","end":{"who":"ryuji","q":"뭐라고?!"}},{"a":"ryuji","b":"kasumi","qa":"카스미, 너 아까 점프 대박이더라!","qb":"헤헤, 류지 선배도 달리기가 엄청 빠르시잖아요!","end":{"who":"ryuji","q":"하하, 육상부 짬바라고!"}},{"a":"ann","b":"yusuke","qa":"유스케, 또 밥 굶고 온 거 아니지?","qb":"…어제 산 랍스터 두 마리를 바라보며 배를 채웠다.","end":{"who":"ann","q":"그건 관상용이잖아! 끝나고 밥 먹자!"}},{"a":"ann","b":"makoto","qa":"마코토, 아까 어두운 데서 살짝 떨었지?","qb":"아, 아니야! 그냥 기온이 낮아서 그랬던 거야!","end":{"who":"ann","q":"후훗, 비밀로 해 줄게~"}},{"a":"ann","b":"futaba","qa":"후타바, 나 배고파… 달달한 거 당긴다.","qb":"인정! 끝나고 크레이프 먹으러 가자! 내가 길 안내할게!","end":null},{"a":"ann","b":"haru","qa":"하루, 메멘토스 끝나고 같이 디저트 카페 갈래?","qb":"어머, 좋아! 맛있는 마카롱 파는 곳을 알고 있거든.","end":{"who":"ann","q":"와, 완전 기대돼!"}},{"a":"ann","b":"akechi","qa":"아케치, 넌 진짜 빈틈이 없네.","qb":"빈틈을 보이면 바로 당하는 곳이니까. 팬서도 조심해.","end":{"who":"ann","q":"응, 알았어!"}},{"a":"yusuke","b":"akechi","qa":"아케치, 그 칼놀림에는 서늘한 직선미가 있군.","qb":"칭찬으로 들어 두지. 폭스의 그림도 꽤 독특하던데.","end":null},{"a":"yusuke","b":"kasumi","qa":"요시자와, 그 우아한 턴… 잠시 멈춰 줄 수 있겠어?","qb":"네?! 여기서 리본을 돌리라고요?!","end":{"who":"yusuke","q":"지금 이 붉은 조명이 완벽하단 말이다!"}},{"a":"makoto","b":"futaba","qa":"후타바, 전방 섀도 수 파악됐어?","qb":"응! 세 마리 대기 중! 선제공격 각 나왔어!","end":{"who":"makoto","q":"좋아, 바로 들어가자."}},{"a":"makoto","b":"kasumi","qa":"카스미, 학교 연습이랑 병행하느라 안 힘들어?","qb":"괜찮아요 마코토 선배! 다들 같이 있어서 힘나요!","end":{"who":"makoto","q":"무리하면 언제든 말해."}},{"a":"futaba","b":"kasumi","qa":"카스미, 너 아까 공중회전 완전 액션 게임 같았어!","qb":"에헤헤, 다음엔 착지 포즈까지 멋지게 해 볼게요!","end":null},{"a":"haru","b":"akechi","qa":"아케치 군, 너무 혼자 앞서가지 말고 같이 가.","qb":"걱정할 필요 없어. 뒤처지는 쪽이 문제지.","end":{"who":"haru","q":"어머… 도끼가 근질거리네."}},{"a":"haru","b":"kasumi","qa":"카스미 쨩, 끝나고 옥상 텃밭 채소 좀 가져갈래?","qb":"와, 정말요?! 도시락 반찬으로 꼭 만들어 먹을게요!","end":{"who":"haru","q":"후훗, 넉넉히 싸 줄게."}},{"a":"joker","b":"akechi","qa":"오늘 꽤 호흡이 잘 맞네.","qb":"흥, 우연이야. …뭐, 나쁘진 않지만.","end":{"who":"joker","q":"솔직하네."}},{"a":"ryuji","b":"mona","qa":"야 모나, 방금 건 좀 멋있었다고!","qb":"흐흥, 이제야 이 몸의 진가를 알았냐 스컬!","end":{"who":"ryuji","q":"아, 칭찬 괜히 했네!"}},{"a":"kasumi","b":"akechi","qa":"선배랑 아케치 선배, 방금 호흡 정말 대단했어요!","qb":"그냥 서로 뭘 할지 대충 보였을 뿐이야.","end":{"who":"joker","q":"꽤 잘 맞았지."}},{"a":"joker","b":"akechi","qa":"아케치, 오늘은 좀 여유가 보이네.","qb":"요시자와가 자꾸 밝게 굴어서 장단 맞추기 피곤할 뿐이야.","end":{"who":"kasumi","q":"에헤헤, 칭찬으로 들을게요!"}},{"a":"kasumi","b":"joker","qa":"선배, 다음 코너는 제가 먼저 치고 나갈게요!","qb":"좋아. 뒤는 나랑 아케치가 맡을게.","end":{"who":"akechi","q":"멋대로 정하지 마… 뭐, 상관없지만."}},{"a":"haru","b":"akechi","qa":"아케치 군, 도끼 날이 좀 무뎌진 것 같은데 봐 줄래?","qb":"…사양할게. 지금 그걸 내 앞에서 휘두르지 마.","end":{"who":"futaba","q":"크크, 아케치 식은땀 흘리는데?"}},{"a":"futaba","b":"akechi","qa":"어이 아케치, 뒤통수 치면 바로 내비 경고음 울린다?","qb":"그렇게 경계할 거면 애초에 같은 파티에 넣지 말았어야지.","end":{"who":"haru","q":"어머, 사이좋게 지내야지~"}},{"a":"haru","b":"futaba","qa":"후타바 쨩, 우리끼리 먼저 앞장서서 다 정리해 버릴까?","qb":"오, 완전 찬성! 아케치는 짐꾼이나 해!","end":{"who":"akechi","q":"…빨리 끝내고 돌아가지."}},{"a":"ryuji","b":"ann","qa":"야, 이렇게 셋이 다니니까 카모시다 때 생각나지 않냐?","qb":"맞아! 그땐 진짜 정신없었는데, 이제 완전 베테랑이지~","end":{"who":"joker","q":"많이 컸네, 다들."}},{"a":"mona","b":"ryuji","qa":"어이 스컬, 조커랑 이 몸이 처음 만났을 때 기억하냐?","qb":"당연하지! 네가 감옥에서 엄청 거들먹거렸잖아!","end":{"who":"joker","q":"그때나 지금이나 똑같네."}},{"a":"makoto","b":"akechi","qa":"같은 3학년끼리 모였으니 모범을 보여야겠지.","qb":"모범이라… 괴도단에서 할 말은 아닌 것 같은데.","end":{"who":"haru","q":"후훗, 그래도 든든하잖아."}},{"a":"haru","b":"makoto","qa":"마코토 쨩, 아케치 군이랑 동갑이라 그런지 대화가 잘 통하네.","qb":"잘 통하는 건지, 신경전인 건지 모르겠지만…","end":{"who":"akechi","q":"후자에 한 표 던지지."}},{"a":"ryuji","b":"yusuke","qa":"야, 오늘 탐사 끝나면 라멘 먹으러 가자! 내가 반은 내 줄게!","qb":"진심인가, 류지?! 그 우정을 화폭에 새겨 두지!","end":{"who":"joker","q":"나머지 반은 내가 낼게."}},{"a":"yusuke","b":"joker","qa":"류지가 아까부터 헛발질을 세 번이나 했군.","qb":"그러게, 곧 네 번째가 올 것 같은데.","end":{"who":"ryuji","q":"야! 다 들린다고!"}},{"a":"futaba","b":"makoto","qa":"퀸! 섀도 이동 경로 3초 만에 계산 끝났어!","qb":"고마워 후타바. 크로우, 왼쪽 측면 막아 줄래?","end":{"who":"akechi","q":"이미 자리 잡았어. 이 팀, 효율은 최고네."}},{"a":"akechi","b":"futaba","qa":"네 스캔 속도, 인정해 주지. 꽤 쓸 만하잖아.","qb":"흥, 당연하지! 내비님 실력을 뭘로 보고!","end":{"who":"makoto","q":"둘이 은근히 죽이 잘 맞네."}},{"a":"ann","b":"haru","qa":"여자끼리만 나오니까 왠지 수다 떨면서 산책하는 기분이다!","qb":"그러게, 탐사 끝나고 같이 디저트 먹으러 갈래?","end":{"who":"makoto","q":"좋아, 단 건 나도 찬성이야."}},{"a":"ann","b":"kasumi","qa":"카스미, 후타바! 우리 셋이 오늘 MVP 싹쓸이하자!","qb":"네, 안 선배! 열심히 할게요!","end":{"who":"futaba","q":"걸즈 파워 버프 발동~!"}},{"a":"mona","b":"kasumi","qa":"바이올렛! 내비한테 이 몸이 얼마나 대단한 선배인지 말해 줘!","qb":"모나 선배는 길도 잘 아시고 정말 멋지세요!","end":{"who":"futaba","q":"우쭈쭈, 모나 꼬리 흔들리는데?"}},{"a":"futaba","b":"joker","qa":"오늘 저녁 메뉴, 소지로가 카레 말고 다른 거 해 줄까?","qb":"아마 오늘도 특제 카레일 걸.","end":{"who":"mona","q":"이 몸은 참치만 있으면 된다고!"}},{"a":"ryuji","b":"akechi","qa":"아 진짜, 실수할 수도 있는 거잖아!","qb":"실수에도 급이 있지. 방금 건 예술 수준이던데.","end":{"who":"ryuji","q":"뭐라고, 이 자식아?!"}},{"a":"mona","b":"ryuji","qa":"어이 스컬, 방금 이 몸이 미끄러진 거 못 봤지?!","qb":"야, 네가 천장까지 날아가는 걸 못 본 놈이 어딨냐!","end":{"who":"mona","q":"입 다물라고!!"}},{"a":"akechi","b":"joker","qa":"…웃지 마. 방금 건 단순한 변수였을 뿐이야.","qb":"응, 엄청 완벽한 변수였네.","end":{"who":"akechi","q":"진심으로 한 대 치고 싶어지네."}},{"a":"makoto","b":"ann","qa":"으으… 리더 보좌가 이런 실수를 하다니 면목이 없어.","qb":"에이~ 마코토도 가끔 허당이어야 인간미 있지!","end":{"who":"makoto","q":"그건 위로가 아닌 것 같은데…"}},{"a":"yusuke","b":"futaba","qa":"물웅덩이의 감촉… 이 실패마저 하나의 작품이군.","qb":"이나리, 그냥 젖은 생쥐 꼴이거든? 빨리 닦아!","end":{"who":"yusuke","q":"예술을 모르는군."}},{"a":"haru","b":"mona","qa":"어머, 상자 안에 있던 보물까지 가루가 돼 버렸네…","qb":"하루… 다음엔 도끼 대신 이 몸한테 열어 달라고 해!","end":{"who":"haru","q":"미안해 모나 쨩, 조심할게."}},{"a":"futaba","b":"makoto","qa":"으아앙, 시스템 다운됐어! 나 이제 끝이야!","qb":"진정해 후타바, 재부팅될 동안 내가 앞을 막아 줄게.","end":{"who":"futaba","q":"역시 퀸밖에 없어…!"}},{"a":"kasumi","b":"haru","qa":"선배님들께 폐를 끼쳐 버렸어요… 어떡하죠?","qb":"괜찮아 카스미 쨩, 안 다쳤으면 그걸로 충분해.","end":{"who":"kasumi","q":"하루 선배… 감사합니다!"}},{"a":"ann","b":"ryuji","qa":"야 류지! 아까 경보 울린 거 비밀로 해 줄 거지?!","qb":"어? 그럼 끝나고 라멘 한 그릇 사 주면 입 닫아 주지!","end":{"who":"ann","q":"치사해! 알았어, 사 줄게!"}},{"a":"joker","b":"kasumi","qa":"방금 코트 걸린 건 좀 창피했네.","qb":"아, 아니에요 선배! 오히려 매달린 포즈가 멋지셨어요!","end":{"who":"joker","q":"…고마워, 카스미."}},{"a":"joker","b":"ryuji","qa":"류지, 저기 자판기 또 쳐다보고 있지.","qb":"아니, 이번엔 진짜 대박 캔이 나올 것 같단 말이야!","end":{"who":"joker","q":"100엔은 네 돈으로 넣어."}},{"a":"ann","b":"makoto","qa":"여기 플랫폼, 묘하게 조용해서 좀 무섭지 않아?","qb":"응… 나도 아까부터 등골이 살짝 서늘해. 붙어 걷자.","end":{"who":"ann","q":"응! 절대 떨어지지 마!"}},{"a":"yusuke","b":"kasumi","qa":"요시자와, 그 체조 동작에는 선의 미학이 살아 있더군.","qb":"어머, 감사해요 유스케 선배! 다음엔 경기 보러 와 주세요!","end":null},{"a":"futaba","b":"mona","qa":"모나, 슬슬 심층 가까워졌어! 엔진 상태 어때?","qb":"끄떡없지! 이 몸의 모나 버스는 아직 멀쩡하다고!","end":null},{"a":"haru","b":"yusuke","qa":"유스케 군, 오늘 저녁은 르블랑에서 같이 카레 먹을래?","qb":"…하루, 너는 진정한 자비의 화신이군. 감사히 받겠다.","end":{"who":"haru","q":"후훗, 넉넉히 준비해 달라고 할게."}},{"a":"akechi","b":"makoto","qa":"슬슬 위험도가 높아졌네. 퀸, 철수 시점은 생각해 뒀어?","qb":"응, 한 구역만 더 보고 판단할 거야. 크로우도 동의해?","end":{"who":"akechi","q":"합리적이네. 따르지."}},{"a":"ryuji","b":"haru","qa":"야, 이 상자 진짜 무거운데… 하루, 잠깐만 들어 줄 수 있어?","qb":"응, 이 정도쯤이야! 자, 어디다 옮겨 놓을까?","end":{"who":"ryuji","q":"우와… 도끼질 근육 장난 아니네!"}},{"a":"joker","b":"ann","qa":"안, 오늘따라 발걸음이 가볍네.","qb":"헤헤, 다들 기분 좋아 보이니까 나까지 신나서 그래!","end":null},{"a":"futaba","b":"ann","qa":"안, 아까 빅뱅 버거 신메뉴 광고 봤어?","qb":"봤지! 끝나고 같이 먹으러 갈래? 류지도 부르면 좋아할걸!","end":null},{"a":"kasumi","b":"mona","qa":"모나 선배, 저 높은 선반 위에 반짝이는 게 있어요!","qb":"오오, 역시 바이올렛! 이 몸이 올라가서 바로 물어 오지!","end":null},{"a":"yusuke","b":"futaba","qa":"후타바, 너도 눈이 반쯤 감겨 있군…","qb":"이나리도 다크서클 내려왔거든? 우리 둘 다 절전 모드야…","end":null},{"a":"akechi","b":"joker","qa":"연속으로 굴리니까 슬슬 피곤한데. 리더, 페이스 조절 좀 해.","qb":"미안. 이번 판만 끝내고 르블랑에서 쉬자.","end":{"who":"akechi","q":"커피는 네가 타는 걸로 해 둬."}},{"a":"ryuji","b":"makoto","qa":"마코토… 나 다음 판엔 진짜 쉬면 안 되냐?","qb":"그래, 무리하면 안 되지. 이번 판 끝나고 푹 쉬어.","end":{"who":"ryuji","q":"오예! 역시 학생회장님!"}},{"a":"haru","b":"ann","qa":"안 쨩, 푹 쉬고 왔더니 얼굴이 완전 화사해 보여!","qb":"하루도! 오늘 우리 둘 다 컨디션 최상이지?","end":null},{"a":"joker","b":"kasumi","qa":"여기까지 왔네. 무섭지 않아?","qb":"선배가 옆에 계시니까 전혀 안 무서워요!","end":null},{"a":"mona","b":"akechi","qa":"여긴 공기가 심상치 않다고. 크로우, 딴생각하지 마!","qb":"누구한테 잔소리야. 앞이나 똑바로 보고 운전해.","end":null},{"a":"ryuji","b":"akechi","qa":"야 아케치, 오늘 좀 덜 틱틱거린다? 기분 좋은 일 있냐?","qb":"그냥 일이 순조롭게 풀려서 그래. 네가 사고만 안 치면 완벽하겠네.","end":{"who":"ryuji","q":"아, 역시 한마디를 안 지네!"}},{"a":"makoto","b":"futaba","qa":"후타바, 이 보관실 문 너머에 섀도 반응 있어?","qb":"없음! 보물상자 두 개랑 먼지만 잔뜩 있어!","end":{"who":"makoto","q":"좋아, 바로 챙겨서 나가자."}},{"a":"haru","b":"joker","qa":"분위기가 조금 가라앉았네. 내가 사탕이라도 나눠 줄까?","qb":"응, 부탁해. 하루가 나서면 다들 금방 풀릴 거야.","end":null},{"a":"yusuke","b":"mona","qa":"모르가나, 그 노란 스카프는 어둠 속에서 훌륭한 포인트 컬러군.","qb":"흐흥, 역시 예술가라 이 몸의 패션 센스를 알아보네!","end":null},{"a":"kasumi","b":"futaba","qa":"후타바 선배! 오늘 내비 안내 덕분에 한 번도 안 부딪혔어요!","qb":"헤헷, 내비님 실력 좀 나오지? 다음엔 타임어택 가 볼까!","end":null},{"a":"ann","b":"yusuke","qa":"유스케, 여기서 너무 오래 서 있으면 추워져! 얼른 가자!","qb":"잠시만… 이 플랫폼의 적막함을 마음에 새기는 중이다.","end":{"who":"ann","q":"에휴, 알았어 딱 10초만!"}},{"a":"makoto","b":"joker","qa":"오늘따라 다들 척척 움직여서 지휘할 게 없네.","qb":"마코토가 미리 잘 챙겨 둔 덕분이지.","end":{"who":"makoto","q":"…그렇게 말해 주니 기쁘네."}},{"a":"akechi","b":"haru","qa":"체력 괜찮아? 무리하면 발목 잡힌다고.","qb":"걱정해 주는 거야, 아케치 군? 난 아직 한참 남았어.","end":{"who":"akechi","q":"…그럼 다행이네."}},{"a":"ryuji","b":"kasumi","qa":"야 요시자와, 너 달리기 진짜 빠르다! 육상부 해도 되겠는데?","qb":"체조 덕분에 순발력은 좀 있어요! 다음엔 류지 선배랑 경주해 볼까요?","end":{"who":"ryuji","q":"오, 안 진다고!"}},{"a":"ryuji","b":"futaba","qa":"야 후타바, 이 길 막다른 골목 아니냐? 미니맵 좀 다시 봐!","qb":"네비 님 스캔을 의심해? 3미터 앞에 숨겨진 우회로 있다고!","end":{"who":"ryuji","q":"어, 진짜네?!"}},{"a":"mona","b":"joker","qa":"오늘도 출발 좋네, 조커! 이 몸만 믿고 따라오라고!","qb":"그래, 길 안내는 맡길게, 파트너.","end":{"who":"mona","q":"흐흥, 든든하지?"}},{"a":"akechi","b":"ann","qa":"타카마키, 지금 방금 섀도 시선 돌린 타이밍 꽤 좋았어.","qb":"어? 아케치한테 칭찬받으니까 왠지 얼떨떨한데… 고마워!","end":{"who":"akechi","q":"사실만 말했을 뿐이야."}},{"a":"akechi","b":"yusuke","qa":"여기서 또 스케치할 생각은 아니겠지, 키타가와?","qb":"안심해라. 이 차가운 정적은 붓보다 눈으로 담는 편이 낫더군.","end":{"who":"akechi","q":"의외로 말이 통하네."}},{"a":"makoto","b":"mona","qa":"모나, 코너 돌 때 속도 조금만 줄여 줄 수 있을까?","qb":"이 몸의 드리프트는 예술이라고! 퀸, 꽉 잡으라고!","end":{"who":"makoto","q":"하아… 알았어, 손잡이 잡을게."}},{"a":"makoto","b":"kasumi","qa":"요시자와, 오늘 발걸음이 유난히 가벼워 보이네.","qb":"푹 쉬고 왔더니 몸이 날아갈 것 같아요! 마코토 선배도 힘내세요!","end":null},{"a":"mona","b":"ann","qa":"안 아가씨, 기운 빠져 보이는데… 이 몸이 재밌는 얘기 해 줄까?","qb":"후훗, 모나가 옆에 있는 것만으로도 벌써 기운 나!","end":{"who":"mona","q":"엣헴! 역시 이 몸이지!"}},{"a":"makoto","b":"yusuke","qa":"유스케, 방금 그 섀도 움직임 패턴 기억해 뒀어?","qb":"물론이지. 왼쪽으로 기울어지는 우아한 포물선이었어.","end":{"who":"makoto","q":"…표현은 특이하지만 도움 됐어."}},{"a":"joker","b":"ryuji","qa":"류지, 오늘따라 텐션이 엄청 높은데.","qb":"당연하지! 푹 자고 나왔더니 오늘 대박 칠 예감이 팍팍 온다고!","end":{"who":"joker","q":"기대할게."}},{"a":"joker","b":"ann","qa":"안, 아까부터 저쪽 벽면 보던데 뭐 있어?","qb":"아니, 저 포스터 색감이 예뻐서… 괴도단 끝나고 쇼핑 가고 싶네.","end":{"who":"joker","q":"보물 많이 챙겨야겠네."}},{"a":"joker","b":"yusuke","qa":"유스케, 여기서 너무 오래 멈춰 있으면 위험해.","qb":"알고 있다. 다만 이 끝없는 선로의 소실점이 마음을 붙잡는군.","end":{"who":"joker","q":"돌아가는 길에 다시 봐."}},{"a":"joker","b":"haru","qa":"하루, 괜찮아? 조금 지쳐 보이는데.","qb":"어머, 들켰네. 그래도 조커 군이 옆에 있으니 끝까지 해 볼게.","end":{"who":"joker","q":"무리하면 바로 말해."}},{"a":"ryuji","b":"yusuke","qa":"야 유스케, 저기 쌓인 상자 중에 먹을 거라도 있으려나?","qb":"메멘토스의 음식은 허상일 뿐이다… 그래도 캔커피 하나쯤은 탐나는군.","end":{"who":"ryuji","q":"야, 결국 너도 배고픈 거잖아!"}},{"a":"ryuji","b":"haru","qa":"하루, 오늘 도끼 휘두르는 폼 완전 물올랐는데?!","qb":"후훗, 고마워 류지 군! 다들 신나 보이니까 나도 힘이 나네.","end":null},{"a":"ann","b":"futaba","qa":"후타바, 나 아까 포즈 어땠어? 좀 멋있었지?","qb":"오, 앵글 완벽! 채찍 휘두르는 컷 캡처해서 저장해 뒀어!","end":{"who":"ann","q":"진짜?! 나중에 꼭 보여 줘!"}},{"a":"ann","b":"makoto","qa":"슬슬 다리 아파 오는데… 마코토는 아직 멀쩡해?","qb":"아직은 괜찮아. 조금만 더 집중해서 마무리하자, 안.","end":{"who":"ann","q":"응! 조금만 더 힘내 볼게!"}},{"a":"ann","b":"kasumi","qa":"카스미, 머리 리본 오늘도 깔끔하게 잘 묶었네!","qb":"감사합니다 안 선배! 뛰어다녀도 안 풀리게 단단히 묶었어요!","end":null},{"a":"yusuke","b":"kasumi","qa":"요시자와, 방금 그 착지 동작… 한 마리 백조 같더군.","qb":"에엑, 백조라뇨! 부끄럽지만 칭찬 감사해요 유스케 선배!","end":{"who":"yusuke","q":"진심이다. 다음엔 꼭 그려 보고 싶군."}},{"a":"yusuke","b":"haru","qa":"하루, 우아한 몸짓과 도끼의 대비는 언제 봐도 강렬하군.","qb":"어머, 예술가한테 그런 말 들으니 조금 쑥스럽네. 고마워, 유스케 군.","end":null},{"a":"makoto","b":"akechi","qa":"이 구역은 퇴로가 좁아. 섣불리 들어가지 말자.","qb":"동의해. 함정이 숨어 있을 확률이 높으니 내가 먼저 훑어보지.","end":{"who":"makoto","q":"부탁할게, 아케치 군."}},{"a":"futaba","b":"haru","qa":"하루! 저 구석 상자에 레어 반응 떴어! 도끼로 팍 열어 버려!","qb":"후훗, 알았어 후타바 쨩. 깔끔하게 뚜껑만 따 볼게!","end":null},{"a":"futaba","b":"mona","qa":"모나! 오늘 내비 스캔 속도 평소보다 2배 빠르다고!","qb":"오오! 이 몸도 컨디션 최상이니까 보물 싹 다 쓸어 담자고!","end":null},{"a":"futaba","b":"joker","qa":"조커, 파티 텐션 좀 떨어졌어… 내가 BGM이라도 틀어 줄까?","qb":"좋아, 신나는 걸로 부탁해 내비.","end":{"who":"futaba","q":"오케이! 텐션 업 트랙 재생!"}},{"a":"haru","b":"kasumi","qa":"카스미 쨩, 끝나고 르블랑에서 같이 디저트 먹을래?","qb":"와아, 정말요?! 하루 선배랑 같이면 무조건 갈래요!","end":{"who":"haru","q":"후훗, 기대하고 있을게."}},{"a":"haru","b":"mona","qa":"모나 쨩, 앞이 어두운데 길 잘 보여?","qb":"흥, 이 몸의 야간 시력을 얕보지 말라고! 하루는 이 몸만 믿어!","end":null},{"a":"akechi","b":"kasumi","qa":"요시자와, 후반인데도 폼이 전혀 안 무너지네.","qb":"아케치 선배한테 뒤처지지 않으려고 끝까지 집중하고 있어요!","end":{"who":"akechi","q":"…꽤 근성이 있군."}},{"a":"akechi","b":"joker","qa":"다들 소풍이라도 나온 줄 아나 보네. 너무 들떴어.","qb":"그만큼 여유가 있다는 뜻이지. 나쁘지 않잖아?","end":{"who":"akechi","q":"…네 그 낙관주의도 참 대단해."}},{"a":"ryuji","b":"ann","qa":"야 안, 저번에 보물 대박 터졌던 거 기억나냐? 오늘도 가자고!","qb":"당연하지! 오늘도 지갑 두둑하게 채워서 돌아가자!","end":null},{"a":"joker","b":"futaba","qa":"저번에 쇠사슬 소리 들었을 때 진짜 아슬아슬했지.","qb":"으으, 떠올리니까 또 등골 오싹해! 오늘은 위험도 관리 철저히 하자!","end":{"who":"joker","q":"알았어, 조심할게."}},{"a":"makoto","b":"ryuji","qa":"류지, 저번처럼 거두는 자 코앞까지 끌지 말자. 알았지?","qb":"아, 알았어! 나도 그때 진짜 심장 떨어지는 줄 알았다고!","end":null},{"a":"yusuke","b":"akechi","qa":"아케치, 미간에 깊은 주름이 잡혔군. 초조한가?","qb":"쓸데없는 관찰은 집어치워. 빨리 끝내고 돌아가고 싶을 뿐이야.","end":{"who":"yusuke","q":"그 날 선 고뇌… 나쁘지 않군."}},{"a":"mona","b":"kasumi","qa":"바이올렛, 슬슬 깊은 구역이니까 긴장 늦추지 마!","qb":"네, 모나 선배! 언제든 움직일 수 있게 준비해 둘게요!","end":null},{"a":"haru","b":"akechi","qa":"아케치 군, 오늘은 시작부터 공기가 꽤 차갑네.","qb":"방심하지 말라는 신호겠지. 각자 맡은 역할만 확실히 하자고.","end":{"who":"haru","q":"응, 물론이지."}},{"a":"ann","b":"yusuke","qa":"유스케… 너도 피곤하지? 나 눈꺼풀이 천 근 만 근이야…","qb":"정신이 몽롱해질 때 비로소 보이는 색채도 있는 법이지… 쿨럭.","end":{"who":"ann","q":"에휴, 이번 판만 끝내고 꼭 쉬자!"}}],"chem":[{"a":"ryuji","b":"akechi","qa":"…야, 아까 일 아직도 꽁해 있냐?","qb":"기억력이 좋아서 말이지.","end":{"who":"mona","q":"둘 다 그만하라고!"}},{"a":"ryuji","b":"mona","qa":"고양이 주제에 지도는 잘 읽네?","qb":"고양이가 아니라고 몇 번을 말해!","end":null},{"a":"akechi","b":"ryuji","qa":"…아까는 고마웠어. 한 번만 말할 거야.","qb":"어? 어어… 뭐, 당연한 거 아니냐!","end":null},{"a":"joker","b":"akechi","qa":"다음 코너, 동시에 치고 들어갈까.","qb":"좋아. 네 타이밍에 맞춰 주지.","end":null},{"a":"ryuji","b":"ann","qa":"야, 오늘 우리 둘 다 텐션 미치지 않았냐?!","qb":"맞아! 이 기세면 보스도 한 방이겠어!","end":null},{"a":"makoto","b":"haru","qa":"하루, 왼쪽 섀도는 네가 맡아 줄래?","qb":"응, 맡겨 줘! 깔끔하게 정리해 버릴게.","end":null},{"a":"joker","b":"kasumi","qa":"준비됐어, 카스미?","qb":"네, 선배! 언제든 뛰어 나갈 수 있어요!","end":null},{"a":"futaba","b":"mona","qa":"모나! 보물 반응 찍었어! 바로 대시!","qb":"오오, 내비랑 손발이 척척 맞는다고!","end":null},{"a":"yusuke","b":"joker","qa":"지금 이 순간, 완벽한 구도가 보였군.","qb":"그래, 그대로 밀고 가자.","end":null},{"a":"makoto","b":"futaba","qa":"약점 스캔 끝났어? 바로 들어간다.","qb":"전부 마킹 완료! 퀸, 싹 쓸어 버려!","end":null},{"a":"futaba","b":"yusuke","qa":"이나리! 보물 앞에서 스케치북 좀 치워!","qb":"이 빛의 각도를 놓치면 평생 후회한다!","end":{"who":"ann","q":"둘 다 얼른 걸어!"}},{"a":"makoto","b":"ryuji","qa":"류지, 또 계획 없이 뛰어들었지?!","qb":"아, 결과만 좋으면 된 거 아니냐고!","end":{"who":"joker","q":"둘 다 진정해."}},{"a":"akechi","b":"futaba","qa":"네 내비 안내, 가끔 너무 시끄럽지 않아?","qb":"뭐?! 내 완벽한 보이스 서포트를 무시해?!","end":null},{"a":"mona","b":"yusuke","qa":"어이 폭스! 동전 줍는 데 무슨 예술이 필요하냐!","qb":"세속의 물욕에도 품격이 필요한 법이다.","end":null},{"a":"ryuji","b":"haru","qa":"하루, 아까 도끼 너무 내 옆으로 스쳤다고!","qb":"어머, 안 맞았으니까 괜찮은 거 아니야?","end":{"who":"ryuji","q":"그게 더 무섭다고!"}},{"a":"ann","b":"ryuji","qa":"야 사카모토 류지, 아까 내 쪽으로 먼지 튀겼지!","qb":"일부러 그런 게 아니라 미끄러진 거라고!","end":null},{"a":"akechi","b":"mona","qa":"고양이 주제에 지휘관 행세가 지나치네.","qb":"고양이가 아니라 괴도단 선배라고 몇 번을 말해!","end":null},{"a":"haru","b":"akechi","qa":"아케치 군, 지금은 말을 안 거는 게 서로 편할 것 같네.","qb":"…동감이야. 할 일만 하고 끝내지.","end":null},{"a":"futaba","b":"akechi","qa":"흥, 아케치 쪽 루트는 스캔 안 해 줄 거야.","qb":"필요 없어. 내 눈으로 보는 게 더 빠르니까.","end":{"who":"makoto","q":"하아… 둘 다 그만해."}},{"a":"mona","b":"ryuji","qa":"흥, 저 녀석한테는 한마디도 안 걸 거야.","qb":"나도 고양이랑은 말 안 섞는다고!","end":{"who":"ann","q":"언제까지 저럴 거야…"}},{"a":"makoto","b":"akechi","qa":"독단적인 판단은 파티 전체를 위험하게 해.","qb":"효율을 따졌을 뿐이야. 불만이면 네가 앞장서든가.","end":null},{"a":"joker","b":"akechi","qa":"아까 그 선택, 너무 위험했어.","qb":"결과를 냈잖아. 설교는 사양할게.","end":null},{"a":"ann","b":"mona","qa":"모나, 방금 그건 좀 심했어.","qb":"으… 아, 안 아가씨한테까지 그런 소리를 듣다니…","end":null},{"a":"yusuke","b":"ryuji","qa":"…너와는 미학적 대화가 통하지 않는군.","qb":"미학이고 뭐고, 말 좀 알아듣게 하라고!","end":null},{"a":"futaba","b":"akechi","qa":"…아까 막아 준 건 꽤 나이스였어. 딱 이번만 인정해 줄게.","qb":"의외네. 네 입에서 칭찬이 다 나오고.","end":null},{"a":"haru","b":"akechi","qa":"아케치 군, 아까 뒤를 지켜 줘서 고마워.","qb":"…신경 쓰지 마. 전력을 유지하는 게 유리했을 뿐이야.","end":null},{"a":"mona","b":"ryuji","qa":"어이 스컬… 아까는 제법 듬직했다고.","qb":"뭐, 뭐야 갑자기! 기분 나쁘게 왜 칭찬하고 그래!","end":null},{"a":"makoto","b":"akechi","qa":"방금 판단은 정확했어. 네가 있어서 다행이야.","qb":"네 백업이 빨랐던 덕분이지. 호흡이 꽤 맞네.","end":null},{"a":"yusuke","b":"futaba","qa":"후타바, 아까 네 지시 덕분에 위기를 넘겼다. 고맙군.","qb":"에헤헤, 이나리가 솔직하게 고맙다고 하니까 좀 쑥스러운데?","end":null},{"a":"kasumi","b":"akechi","qa":"아케치 선배, 아까 제 빈틈을 메워 주셔서 정말 감사했어요!","qb":"네 움직임이 워낙 깔끔해서 맞추기 쉬웠을 뿐이야.","end":null},{"a":"joker","b":"akechi","qa":"등 뒤는 너한테 맡겨도 되겠네.","qb":"흥, 당연한 소리를. 놓치지 말고 따라와.","end":null},{"a":"joker","b":"akechi","qa":"이제 말 안 해도 다음 수가 보이네.","qb":"흥, 네가 내 속도에 맞춰 주는 것뿐이야. 가자.","end":null},{"a":"joker","b":"kasumi","qa":"카스미, 호흡 완벽해졌는데.","qb":"선배 옆에서 계속 뛰어온 덕분이에요! 끝까지 함께할게요!","end":null},{"a":"ryuji","b":"mona","qa":"야 모나, 이제 네 잔소리 안 들으면 좀 허전하다고.","qb":"흐흥, 이 몸의 소중함을 이제야 알았냐 스컬!","end":null},{"a":"ryuji","b":"ann","qa":"야, 우리 이제 눈 감고도 호흡 맞출 수 있지 않냐?","qb":"당연하지! 영원한 콤비잖아!","end":null},{"a":"makoto","b":"haru","qa":"하루가 뒤에 있으면 어떤 상황에서도 안심이 돼.","qb":"나도 마코토 쨩이 곁에 있어서 늘 든든해.","end":null},{"a":"futaba","b":"yusuke","qa":"이나리, 오늘 구도 나쁘지 않은데? 내비 인증 도장 쾅!","qb":"후타바에게 인정받다니… 오늘 그림은 걸작이 되겠군.","end":null},{"a":"akechi","b":"haru","qa":"…네가 맡은 쪽은 굳이 돌아볼 필요가 없네. 깔끔해.","qb":"어머, 아케치 군한테 그런 말을 다 듣네. 기분 좋다.","end":null},{"a":"akechi","b":"futaba","qa":"네 데이터만큼은 이제 의심 없이 믿고 움직여도 되겠어.","qb":"흥, 진작 그랬어야지! 믿고 맡겨!","end":null},{"a":"joker","b":"makoto","qa":"작전은 완벽해. 이제 마무리만 남았네.","qb":"응, 네가 옆에 있으니 걱정 없어. 가자!","end":null},{"a":"joker","b":"mona","qa":"오늘도 잘 부탁해, 파트너.","qb":"당연하지, 조커! 이 몸과 네 조합은 무적이라고!","end":null},{"a":"ann","b":"haru","qa":"하루, 저쪽 섀도들 같이 한 번에 날려 버릴까?","qb":"좋아! 안 쨩이 불 붙이면 내가 마무리할게.","end":null},{"a":"yusuke","b":"makoto","qa":"퀸, 그 일격에는 군더더기 없는 조형미가 있군.","qb":"고마워 유스케. 네 검술도 빈틈이 없어서 든든해.","end":null},{"a":"futaba","b":"kasumi","qa":"바이올렛! 전방 3미터 점프 각 나왔어!","qb":"네, 후타바 선배! 지금 바로 뛰어넘을게요!","end":null},{"a":"ryuji","b":"kasumi","qa":"카스미, 저 끝까지 누가 먼저 도착하나 내기할래?!","qb":"좋아요 류지 선배! 저도 안 질 거예요!","end":null},{"a":"joker","b":"haru","qa":"하루, 오늘 유난히 기세가 좋네.","qb":"네가 옆에서 지휘해 주니까 마음이 놓여서 그래.","end":null},{"a":"joker","b":"futaba","qa":"내비, 다음 루트 부탁해.","qb":"오케이 조커! 최단 보물 코스 바로 띄워 줄게!","end":null},{"a":"mona","b":"haru","qa":"하루, 오늘 우리 콤비 플레이 최고라고!","qb":"후훗, 모나 쨩이랑 같이 다니면 늘 즐거워.","end":null},{"a":"makoto","b":"kasumi","qa":"카스미, 호흡 흐트러지지 않고 완벽해.","qb":"마코토 선배가 리드해 주신 덕분이에요!","end":null},{"a":"ryuji","b":"yusuke","qa":"야 유스케, 굶고 다니지 말고 편의점 빵이라도 사 먹으라고!","qb":"빵 살 돈으로 새 붓을 샀다. 후회는 없다.","end":{"who":"ann","q":"아 진짜 못 말려…"}},{"a":"ann","b":"akechi","qa":"아케치, 가끔은 계산 좀 내려놓고 편하게 걸어도 되잖아?","qb":"방심하다 발목 잡히는 쪽보단 낫지 않아?","end":null},{"a":"mona","b":"futaba","qa":"내비! 이 몸 수염 자꾸 톡톡 건드리지 마!","qb":"반응 속도 테스트 중이거든? 0.2초 합격!","end":null},{"a":"makoto","b":"yusuke","qa":"유스케, 지금 이 어두운 통로에서 화구를 꺼내면 어떡해!","qb":"어둠 속의 한 줄기 붉은 선… 지금 아니면 못 그린단 말이다!","end":null},{"a":"ryuji","b":"futaba","qa":"야 후타바, 아까 나한테 '탱커 몸빵'이라고 했지?!","qb":"어? 제일 튼튼하니까 칭찬한 건데 왜 그래~","end":null},{"a":"yusuke","b":"akechi","qa":"아케치, 그 걸음걸이는 너무 인위적이군. 자연스러움이 부족해.","qb":"칭찬이 아닌 건 알겠네. 감상은 나중에 혼자 해.","end":null},{"a":"ann","b":"mona","qa":"모나, 자꾸 보물만 보면 앞뒤 안 가리고 달려가잖아!","qb":"안 아가씨한테는 예쁜 보물만 보여 주고 싶단 말이야!","end":null},{"a":"haru","b":"yusuke","qa":"유스케 군, 아까 내 화분 흙을 스케치 재료로 쓰려던 거 다 봤어.","qb":"오해다, 하루! 그저 자연의 색감을 채집하려 했을 뿐…","end":null},{"a":"ann","b":"ryuji","qa":"…류지, 아까 내 말 무시하고 뛰어나간 거 아직 화났거든?","qb":"아, 알았다고… 미안하니까 그만 째려봐.","end":null},{"a":"makoto","b":"ryuji","qa":"류지, 다음엔 내 신호 떨어지기 전에 절대 움직이지 마.","qb":"…알았어, 알았다고. 조용히 따라갈게.","end":null},{"a":"yusuke","b":"akechi","qa":"…그 차가운 시선에는 예술적 온기가 전혀 없군.","qb":"흥, 나도 네 4차원적인 궤변에 어울려 줄 기분은 아니야.","end":null},{"a":"futaba","b":"ryuji","qa":"류지한테는 당분간 미니맵 공유 안 해 줄 거야.","qb":"어이, 야! 길 잃으면 어쩌려고 그래!","end":null},{"a":"mona","b":"makoto","qa":"퀸, 아까 급커브 꺾을 때 이 몸 멀미할 뻔했다고!","qb":"미안하다고 했잖아… 나도 급해서 그랬어.","end":null},{"a":"haru","b":"ryuji","qa":"류지 군, 아까 그 행동은 조금 위험했어.","qb":"으… 하루가 정색하니까 진짜 무섭네. 미안해!","end":null},{"a":"joker","b":"mona","qa":"모나, 이번엔 네가 좀 성급했어.","qb":"흥… 조커까지 이 몸 편을 안 들어 주다니.","end":null},{"a":"kasumi","b":"akechi","qa":"아케치 선배… 방금 말씀은 조금 너무하신 것 같아요.","qb":"현실을 말했을 뿐이야. 듣기 싫으면 귀를 막든가.","end":null},{"a":"ann","b":"akechi","qa":"아케치, 아까 내 뒤 지켜 준 거… 사실 좀 감동했어.","qb":"별일 아니야. 다음엔 시야를 좀 더 넓게 써.","end":null},{"a":"yusuke","b":"akechi","qa":"아케치, 방금 그 냉철한 일격… 솔직히 경이로웠다.","qb":"네가 내 싸움 방식을 칭찬할 줄은 몰랐네.","end":null},{"a":"ryuji","b":"makoto","qa":"야 마코토, 아까 네 말 듣길 진짜 잘했다! 완전 살았네!","qb":"후훗, 이제 내 작전을 좀 믿어 주는 거야?","end":null},{"a":"futaba","b":"ryuji","qa":"류지, 아까 몸으로 막아 줘서 고마워! 오늘 MVP 줄게!","qb":"하하! 당연하지! 내비는 내가 지켜야지!","end":null},{"a":"mona","b":"akechi","qa":"크로우… 아까 그 함정 해제, 제법 쓸 만하더군.","qb":"고양이한테 인정받으니 묘한 기분이네. 고맙다고 해 두지.","end":null},{"a":"yusuke","b":"ryuji","qa":"류지, 아까 나를 끌어올려 준 그 힘… 진정한 우정이더군.","qb":"에이, 뭘 그런 걸로 감동하고 그래! 친구잖아!","end":null},{"a":"haru","b":"futaba","qa":"후타바 쨩, 네 안내 덕분에 하나도 안 다쳤어. 고마워.","qb":"에헤헤, 하루가 그렇게 말해 주니까 의욕 200% 충전됐어!","end":null},{"a":"makoto","b":"ann","qa":"안, 아까 분위기 처졌을 때 네가 웃겨 줘서 정말 고마웠어.","qb":"에이~ 우리 사이에 뭘! 서로 챙기는 거지!","end":null},{"a":"joker","b":"ryuji","qa":"류지, 오른쪽은 네가 뚫어 줘.","qb":"오케이! 내 방망이 맛 좀 제대로 보여 주지!","end":null},{"a":"joker","b":"ann","qa":"안, 불꽃으로 시선 끌어 줄래?","qb":"맡겨만 둬! 화려하게 태워 버릴게!","end":null},{"a":"ann","b":"yusuke","qa":"유스케, 내 마법 다음에 바로 이어서 쳐 줘!","qb":"알았다. 불꽃 뒤에 피어나는 얼음이라… 완벽한 대비군!","end":null},{"a":"ann","b":"futaba","qa":"후타바! 다음 약점 속성 뭐야?","qb":"화염 약점 확정! 팬서, 풀파워로 날려 버려!","end":null},{"a":"yusuke","b":"haru","qa":"하루, 네 포격 타이밍에 맞춰 파고들지.","qb":"후훗, 좋아 유스케 군! 신호 줄 테니까 멋지게 마무리해 줘.","end":null},{"a":"haru","b":"kasumi","qa":"카스미 쨩, 같이 리듬 맞춰서 들어가 볼까?","qb":"네, 하루 선배! 완벽하게 보조 맞출게요!","end":null},{"a":"joker","b":"ryuji","qa":"등 뒤는 늘 네게 맡기고 있어, 류지.","qb":"하하, 당연하지! 우린 처음부터 최강 콤비잖아!","end":null},{"a":"joker","b":"ann","qa":"안이랑 같이 싸우면 이상하게 마음이 놓여.","qb":"후훗, 나도! 조커가 옆에 있으면 뭐든 이길 것 같거든!","end":null},{"a":"ann","b":"makoto","qa":"마코토, 이제 눈빛만 봐도 다음 작전 알겠어!","qb":"나도 그래, 안. 이제 우리 호흡은 누구도 못 따라올 거야.","end":null},{"a":"yusuke","b":"joker","qa":"너와 함께 서는 전장은 언제나 한 폭의 명화로군.","qb":"그럼 마지막 붓질은 같이 끝내자, 유스케.","end":null},{"a":"joker","b":"ryuji","qa":"류지, 소리 좀 낮춰. 섀도 다 몰려오겠다.","qb":"아 진짜, 신나서 그랬단 말이야! 리더 너무 엄격한 거 아니냐?!","end":null},{"a":"ann","b":"yusuke","qa":"유스케! 전투 중에 포즈 주문하지 말라고 몇 번을 말해!","qb":"하지만 방금 그 각도에서 흩날린 머리카락은 실로 절경이었다!","end":{"who":"ann","q":"진짜 못 말려!"}},{"a":"makoto","b":"futaba","qa":"후타바, 약점 안내할 때 게임 용어 말고 제대로 말해 줄래?","qb":"에이~ 퀸도 슬슬 겜잘알 용어 외울 때 됐거든?!","end":null},{"a":"kasumi","b":"ryuji","qa":"류지 선배! 방금 또 준비운동 없이 뛰어드셨죠?!","qb":"어, 어이 요시자와! 잔소리가 점점 마코토 닮아 가는데?!","end":null},{"a":"akechi","b":"makoto","qa":"니지마, 네 작전은 지나치게 교과서적이야. 변수를 못 읽잖아.","qb":"아케치 군의 도박 같은 판단보다는 훨씬 안전하다고 생각하는데.","end":null},{"a":"haru","b":"mona","qa":"모나 쨩, 자꾸 혼자 튀어 나가면 미아 될지도 몰라.","qb":"미, 미아라니! 이 몸은 메멘토스의 살아 있는 지도라고!","end":null},{"a":"ann","b":"makoto","qa":"마코토, 그렇게 빡빡하게 굴면 피곤해진다니까?","qb":"안, 지금 긴장 풀었다가 함정 밟으면 어쩌려고 그래!","end":null},{"a":"futaba","b":"kasumi","qa":"카스미! 너 너무 빨리 뛰어다녀서 레이더 핀이 쫓아가질 못해!","qb":"죄, 죄송해요 후타바 선배! 조금만 속도 줄일게요!","end":null},{"a":"joker","b":"yusuke","qa":"유스케, 보물상자 앞에서 구도 잡는 건 끝나고 하자.","qb":"안 될 말이다! 열리기 직전의 긴장감이야말로 미의 정점이지!","end":null},{"a":"akechi","b":"ryuji","qa":"사카모토, 발소리 좀 줄여. 섀도한테 초대장 보낼 셈이야?","qb":"아 시끄러! 원래 내 보폭이 크다고!","end":{"who":"mona","q":"또 시작이네…"}},{"a":"joker","b":"ryuji","qa":"류지, 아까는 분명 기다리라고 했잖아.","qb":"…알았다고. 다음엔 말없이 안 튀어 나갈게.","end":null},{"a":"joker","b":"ann","qa":"안, 지금은 농담할 분위기가 아니야.","qb":"…미안. 나도 모르게 선을 넘었나 봐.","end":null},{"a":"ann","b":"yusuke","qa":"유스케, 지금은 정말 예술 타령 듣고 싶지 않아.","qb":"…그렇게까지 말한다면 입을 다물지.","end":null},{"a":"makoto","b":"yusuke","qa":"유스케, 파티 전체 안전보다 그림이 먼저인 건 아니지?","qb":"…내 미학을 오해하고 있군, 마코토.","end":null},{"a":"haru","b":"makoto","qa":"마코토 쨩, 아까는 조금 너무 몰아붙인 것 같아.","qb":"…미안해 하루. 나도 여유가 없었나 봐.","end":null},{"a":"futaba","b":"makoto","qa":"흥, 퀸이 다 알아서 할 거면 내비는 왜 데려왔어?","qb":"…그런 뜻이 아니었잖아, 후타바.","end":null},{"a":"mona","b":"yusuke","qa":"폭스, 지금 이 몸 말 한 귀로 흘린 거지?!","qb":"…지금은 침묵이 가장 고결한 답이로군.","end":null},{"a":"ann","b":"futaba","qa":"후타바, 아까 그 말은 좀 상처였어…","qb":"…으, 미안. 나도 모르게 필터 없이 말해 버렸어.","end":null},{"a":"kasumi","b":"ryuji","qa":"류지 선배… 아까는 정말 위험하셨어요.","qb":"…미안하다, 요시자와. 내가 너무 앞만 보고 달렸네.","end":null},{"a":"mona","b":"futaba","qa":"흥! 내비라고 이 몸을 구닥다리 취급하다니!","qb":"팩트 체크했을 뿐이거든? 당분간 통신 음소거할 거야!","end":null},{"a":"joker","b":"yusuke","qa":"유스케, 아까 네가 막아 줘서 살았어.","qb":"동료를 지키는 데 이유 따윈 필요 없지. 신경 쓰지 마라.","end":null},{"a":"ann","b":"yusuke","qa":"유스케, 평소엔 엉뚱한데 중요한 순간엔 진짜 믿음직하네.","qb":"그 말, 최고의 찬사로 받아들이지.","end":null},{"a":"makoto","b":"kasumi","qa":"요시자와, 위급할 때 판단이 정말 빨랐어. 고마워.","qb":"마코토 선배께 도움이 됐다면 그것만으로 기뻐요!","end":null},{"a":"haru","b":"ryuji","qa":"류지 군, 아까 제일 먼저 달려와 줘서 정말 고마웠어.","qb":"에이, 뭘 그런 걸로! 하루가 다치면 큰일이잖아!","end":null},{"a":"mona","b":"makoto","qa":"퀸, 아까 지휘 덕분에 위기 넘겼어. 인정할게!","qb":"후훗, 모나한테 칭찬받으니까 묘하게 뿌듯하네.","end":null},{"a":"ann","b":"kasumi","qa":"카스미, 너 진짜 대단해! 방금 완전 프로 같았어!","qb":"안 선배가 옆에서 응원해 주신 덕분이에요!","end":null},{"a":"futaba","b":"mona","qa":"모나, 아까 급회전 대박이었어! 내비 레이더보다 빨랐는데?","qb":"흐흥! 역시 이 몸의 진가를 알아보는군!","end":null},{"a":"ryuji","b":"haru","qa":"야 하루, 아까 네가 뒤 받쳐 줘서 맘 놓고 쳤다고! 최고야!","qb":"후훗, 류지 군이랑 호흡이 딱 맞아서 다행이야.","end":null},{"a":"haru","b":"kasumi","qa":"카스미 쨩이 옆에 있으면 어쩐지 마음까지 환해지는 기분이야.","qb":"저도 하루 선배랑 함께할 때가 제일 든든하고 따뜻해요!","end":null},{"a":"akechi","b":"kasumi","qa":"요시자와, 이제 네가 뒤를 맡아 주면 안심하고 앞만 볼 수 있겠네.","qb":"아케치 선배…! 그 믿음, 절대 저버리지 않을게요!","end":null}],"solo":[{"who":"joker","n":"조커가 아무도 못 본 환기구로 슬쩍 들어갔다 나왔다.","q":"지름길이야.","need":[]},{"who":"joker","n  const allDown=foeAlive().length&&foeAlive().every(f=>f.down),freeN=cnt('oil')+3*cnt('rails'),fl=freeN-B.free;

 const sw=d=>`<button class="ab" data-a="sw:${d}" ${(d<0?m.row>1:m.row<3)&&!ui.busy&&!cuffed(m,d)?'':'disabled'}><b>${d<0?'앞 열로':'뒤 열로'}</b><small>${cuffed(m,d)?'녹슨 수갑 · 이동 불가':`자리 교대${fl>0&&!B.extra?` · 무료 ${fl}번`:''}`}</small></button>`;
 return `<div class="tip"><b style="color:${m.c.col}">${m.c.name}</b>의 차례 (${m.row}열)${B.extra?' · <b style="color:var(--gold)">1 MORE!</b>':''} — 적을 눌러 대상을 고르십시오.</div>
 <div class="acts">${allDown?`<button class="ab gold wide" data-a="allout"><b>ALL-OUT ATTACK</b><small>전원 DOWN · 총공격${cnt('dice')?' · 주사위 ×2':''}</small></button>`:''}${sk}${bat}${sw(-1)}${sw(1)}</div>
 <div class="row2"><button class="tog ${G.auto?'on':''}" data-a="auto">자동 전투 ${G.auto?'ON':'OFF'}</button>${B.kind==='reaper'?'<button class="ab red" data-a="ret"><b>RETURN NOW</b><small>엔 전부 들고 귀환</small></button>':''}</div>`}
function vEvent(){const e=G.ev;if(e.kind==='deal'){const N=e.neg&&NEG[e.neg];return `<div class="dlg"><span class="who">SHADY DEAL</span><p>${esc(e.n)}</p>${N?`<p class="tip">떠안을 것: ${N.ic} <b>${N.n}</b> — ${N.d}<br>버티거나 깨뜨리면: ${N.up}<br>받을 것: <b>폭발기</b> 3개 중 하나</p>`:'<p class="tip">부정 기물 칸(3칸)이 찼거나 남은 게 없어 거래할 수 없습니다.</p>'}</div>
 <div class="row2"><button class="go" data-a="deal:take" ${N?'':'disabled'}>DEAL</button><button class="go sub" data-a="deal:skip">NO DEAL</button></div>`}
 if(e.kind==='plain')return `<div class="dlg"><span class="who">ROOM</span><p>${esc(e.n)}</p></div><button class="go" data-a="ev:open">OPEN</button>`;
 const m=CH[e.who];return `<div class="cmd"><h3>COMMAND <span>지휘 ${G.cmd}/3</span></h3><p style="margin:8px 0 2px">${esc(e.n)}</p><p class="tip">${esc(e.odds)}</p>
 <div class="acts"><button class="ab" data-a="ev:stop" ${G.cmd?'':'disabled'}><b>1. 말린다</b><small>사고 없음 · 지휘 -1${e.kind==='chest'?' · 조심히 열기':''}</small></button><button class="ab" data-a="ev:boost" ${G.cmd?'':'disabled'}><b>2. 부추긴다</b><small>보상·위험 2배 · 지휘 -1</small></button><button class="ab wide" data-a="ev:leave"><b>3. 그냥 둔다</b><small>${esc(m.name)} 마음대로</small></button></div></div>`}
function vPick(){const P=G.pick;if(!P)return '';return `<div class="tip"><b>${esc(P.why)}</b> — 하나를 고르십시오.${P.left>1?` (${P.left}번)`:''}</div><div class="pick">${P.ch.map((id,i)=>{const I=IT(id),n=cnt(id);
 return `<button class="pk ${P.syn[i]?'syn':''} ${EVO[id]?'evo':''}" data-a="take:${id}"><span class="ic">${I.ic}</span><span><b>${I.n}</b><span class="tg">${I.r}</span><span class="tg">${I.ax}</span>${P.syn[i]?'<span class="tg">시너지</span>':''}${n?`<span class="tg">×${n+1}</span>`:''}<small>${I.d}</small></span></button>`}).join('')}</div>`}
function vBench(){const s=ui.bsel;return `<div class="dlg"><span class="who">WORKBENCH</span><p>${G.benchUsed?'오늘 작업대는 다 썼습니다.':`위 템 칸에서 <b>아무 템 2개</b>를 골라 넣으면, 넣은 템 계열 위주로 <b>진화 템 3개</b> 중 하나가 나옵니다. 넣은 2개는 사라집니다.`}</p>${!G.benchUsed&&s.length?`<p class="tip">넣을 것: ${s.map(i=>IT(G.items[i]).n).join(' + ')}</p>`:''}</div>
 <div class="row2">${G.benchUsed?'':`<button class="go" data-a="synth" ${s.length===2?'':'disabled'}>SYNTHESIZE</button>`}<button class="go sub" data-a="leave">LEAVE</button></div>${hasNeg('cuffs')?'<button class="ab wide" data-a="uncuff"><b>⛓️ 녹슨 수갑 해체</b><small>수갑을 없애고 템 3지선다 하나</small></button>':''}`}
function vFloor(){const n=G.fl+1;return `<div class="dlg"><span class="who">B${n} CLEAR</span><p>관문을 넘었습니다. 지금 돌아가면 <b>¥${G.yen}</b>를 전부 챙깁니다.<br>내려가면 B${n+1} ${FLOORS[n].n} — 적이 단단해지고, 보상과 진화 템이 늘어납니다. 전멸하면 엔의 절반을 잃습니다.<br><small>하강하면 위험도 -4 · HP 30% · SP 50% 회복</small></p></div>
 <div class="row2"><button class="go sub" data-a="ret">RETURN</button><button class="go" data-a="down">GO DEEPER ↓</button></div>`}
function vMap(){const m=G.map,nb=m.adj(G.at),sz=100/4;
 const lk=m.edges.filter(([a,b])=>known(a)&&known(b)&&(m.vis.has(a)||m.vis.has(b))).map(([a,b])=>{const [r1,c1,r2,c2]=[a>>2,a%4,b>>2,b%4],h=r1===r2;
  return `<i class="lk" style="${h?`left:${(Math.min(c1,c2)+.5)*sz}%;top:calc(${(r1+.5)*sz}% - 2px);width:${sz}%;height:4px`:`left:calc(${(c1+.5)*sz}% - 2px);top:${(Math.min(r1,r2)+.5)*sz}%;height:${sz}%;width:4px`}"></i>`}).join('');
 const cells=Array.from({length:16},(_,i)=>{if(!m.cells.includes(i)||!known(i))return `<div class="cell" style="opacity:.45"></div>`;const t=m.T[i],can=nb.includes(i),cl=i===G.at?'at':can?'nx':m.vis.has(i)?'v':'k';
  return can?`<button class="cell ${cl}" data-a="mv:${i}" aria-label="${ROOM[t].n} 방으로">${ROOM[t].ic}<small>${m.done.has(i)?'지나옴':ROOM[t].n}</small></button>`:`<div class="cell ${cl}" style="z-index:1">${ROOM[t].ic}<small>${i===G.at?'지금':m.done.has(i)?'지나옴':ROOM[t].n}</small></div>`}).join('');
 return `<div class="tip">반짝이는 방을 눌러 이동합니다. 한 칸마다 위험도 +1.</div><div class="map">${lk}${cells}</div>
 <div class="row2"><button class="go sub" data-a="ret">RETURN NOW</button></div><p class="tip" style="text-align:center">지금 돌아가면 ¥${G.yen}를 전부 챙깁니다.</p>`}
function vLog(){return `<button class="sm" data-a="log">${ui.log?'로그 접기 ▴':'로그 펼치기 ▾'}</button>${ui.log?`<div class="log">${G.log.map(l=>`<p>${l.who?`<b>${CH[l.who].name}</b> 「${esc(l.t)}」`:esc(l.t)}</p>`).join('')}</div>`:''}`}
function vResult(){const e=G.end||{kind:'clear',y:G.yen},s=G.stats,head=e.kind==='wipe'?'WIPED OUT':G.cleared?'ALL CLEAR':'RETURNED';
 return `<div class="title res"><h1>${head.split(' ').join('<br>')}</h1><p>${e.kind==='wipe'?`B${G.fl+1}에서 전멸했습니다. 번 엔의 절반을 건졌습니다.`:G.cleared?'거두는 자를 쓰러뜨리고 메멘토스 끝까지 내려갔습니다.':`B${G.fl+1}에서 무사히 르블랑으로 돌아왔습니다.`}</p>
 <div class="card"><dl><dt>수익</dt><dd>¥${e.y}</dd><dt>도달</dt><dd>B${G.fl+1}</dd><dt>지나온 방 · 전투</dt><dd>${s.rooms} · ${s.battles}</dd><dt>1 MORE (한 턴 최다)</dt><dd>${s.moreT} (${s.maxMore})</dd><dt>총공격 · SHOWTIME</dt><dd>${s.allout} · ${s.showtime}</dd><dt>최고 한 방</dt><dd>${s.best}</dd><dt>합성</dt><dd>${s.evo}</dd></dl>
 <div class="slots">${Array.from({length:6},(_,i)=>{const I=IT(G.items[i]||'');return I?`<div class="slot f ${EVO[G.items[i]]?'evo':''}" data-r="${I.r}">${I.ic}<small>${I.r}</small></div>`:'<div class="slot"></div>'}).join('')}</div></div>
 <div class="card">이 판의 조합, <b>한 번 더 해 보고 싶습니까?</b> 그 느낌이 이 시제품의 합격 기준입니다.</div>
 <button class="go" data-a="start">ONE MORE RUN →</button><button class="sm" data-a="title">처음 화면</button></div>`}
/* ============ 입력 ============ */
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const [a,v]=b.dataset.a.split(':');
 if(a==='start'){ui.screen='party';ui.ps=null;return render()}
 if(a==='ps'){const p=ui.ps,j=p.indexOf(v);if(j>=0)p.splice(j,1);else if(p.length<3)p.push(v);return render()}
 if(a==='go'){if(ui.ps&&ui.ps.length===3)return newRun(ui.ps);return}if(a==='title'){ui.screen='title';return render()}
 if(a==='mv')return move(+v);if(a==='ret')return endRun('return');if(a==='down')return descend();
 if(a==='ev')return resolveEv(v==='open'?'leave':v);
 if(a==='take')return takeItem(v);if(a==='swap')return swapItem(+v);if(a==='nodrop'){ui.drop=null;return afterPick()}
 if(a==='bsel')return benchToggle(+v);if(a==='synth')return synth();if(a==='leave'){ui.screen='map';return render()}
 if(a==='tip'){ui.ntip=null;ui.tip=ui.tip===v?null:v;return render()}
 if(a==='ntip'){ui.tip=null;ui.ntip=ui.ntip===v?null:v;return render()}
 if(a==='uncuff')return unCuff();
 if(a==='deal')return resolveEv(v);
 if(a==='log'){ui.log=!ui.log;return render()}
 if(!G.battle)return;
 if(a==='sel'){G.battle.sel=+v;return render()}
 if(a==='sk')return useSkill(+v);if(a==='sw')return doSwap(+v);if(a==='bt')return baton(v);if(a==='allout')return allOut();
 if(a==='auto'){G.auto=!G.auto;if(G.auto)say('joker','decide');render();return autoGo()}});
document.addEventListener('keydown',e=>{if(ui.screen==='battle'&&G.battle&&!ui.busy){const k=e.key;if(k==='1'||k==='2')useSkill(+k-1);else if(k==='3')doSwap(-1);else if(k==='4')doSwap(1);else if(k===' '){const al=foeAlive();if(al.length&&al.every(f=>f.down))allOut()}}
 else if(ui.screen==='event'&&G.ev&&G.ev.kind!=='deal'){if(G.ev.kind==='plain'&&(e.key===' '||e.key==='Enter'))resolveEv('leave');else if(e.key==='1')resolveEv('stop');else if(e.key==='2')resolveEv('boost');else if(e.key==='3')resolveEv('leave')}});
render();
</script>
</body>
</html>
